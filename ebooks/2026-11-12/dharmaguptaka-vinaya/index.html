const CHAPTERS=[{"id":"section-001","kind":"volume","number":1,"title":"第1卷｜《四分律》卷一深度拆解","html":"<h3>主题：为什么佛法能不能久住，关键不在禅定，不在神通，而在戒律？</h3>\n<p>很多人学佛，最喜欢《心经》《金刚经》《楞严经》。</p>\n<p>很少有人愿意读《四分律》。</p>\n<p>因为空性谈起来很舒服，戒律执行起来很痛苦。</p>\n<p>但《四分律》一开篇，就直接告诉我们：</p>\n<p><strong><span style=\"color: #00A340;\">戒律不是佛法的附属品，而是佛法存在的根基。</span></strong></p>\n<p>如果说《般若经》解决的是“见地问题”，</p>\n<p>那么《四分律》解决的是“人格问题”。</p>\n<p>一个没有戒律的人，即使谈空说妙，也未必能解脱。</p>\n<p>一个有戒律的人，即使智慧尚浅，也已经走在解脱路上。</p>\n<p>《四分律》卷一，其实讲了三件极重要的大事：</p>\n<ol><li>为什么要有戒律？</li><li>佛为什么一开始不制定戒律？</li><li>为什么淫戒和盗戒会成为第一批重戒？</li></ol>\n<p>这三件事，几乎决定了整个佛教未来两千多年的命运。</p>\n<hr>\n<h2>第一部分</h2>\n<h3>《四分律》序言到底在说什么？</h3>\n<p>开篇第一句话：</p>\n<blockquote><p>夫戒之興，所以防邪檢失，禁止四魔、超世之道。</p></blockquote>\n<p>翻译：</p>\n<p><span style=\"color: #E00;\">戒律的建立，</span></p>\n<p><span style=\"color: #E00;\">是为了防止邪恶行为，</span></p>\n<p><span style=\"color: #E00;\">检点自己的过失，</span></p>\n<p><span style=\"color: #E00;\">降伏四魔，</span></p>\n<p><span style=\"color: #E00;\">最终超越生死轮回。</span></p>\n<p>这里已经指出戒律的真正功能。</p>\n<p>很多人以为：</p>\n<p>戒律＝道德规范。</p>\n<p>其实不对。</p>\n<p>佛教戒律从来不是伦理学。</p>\n<p>而是解脱学。</p>\n<p>因为戒律真正要对付的，</p>\n<p>不是社会秩序。</p>\n<p>而是烦恼。</p>\n<hr>\n<h2>什么叫四魔？</h2>\n<p>四魔：</p>\n<h4>①烦恼魔</h4>\n<p>贪嗔痴慢疑。</p>\n<h4>②五阴魔</h4>\n<p>色受想行识。</p>\n<h4>③死魔</h4>\n<p>生死轮回。</p>\n<h4>④天魔</h4>\n<p>波旬魔王。</p>\n<p>所以戒律的敌人不是别人。</p>\n<p>而是自己。</p>\n<hr>\n<h2>第二部分</h2>\n<h3>众生为什么轮回？</h3>\n<p>序文说：</p>\n<blockquote><p><span style=\"color: #E00;\">群生愚惑，安寢冥室</span></p></blockquote>\n<p><span style=\"color: #E00;\">意思是：</span></p>\n<p><span style=\"color: #E00;\">众生就像睡在黑屋子里的人。</span></p>\n<p><span style=\"color: #E00;\">根本不知道自己在哪。</span></p>\n<p><span style=\"color: #E00;\">更不知道自己在干什么。</span></p>\n<p>接着说：</p>\n<blockquote><p>宛轉四流，甘履八苦</p></blockquote>\n<p>什么叫四流？</p>\n<p>四种烦恼洪流：</p>\n<ul><li>欲流</li><li>有流</li><li>见流</li><li>无明流</li></ul>\n<p>什么叫八苦？</p>\n<ul><li>生苦</li><li>老苦</li><li>病苦</li><li>死苦</li><li>爱别离苦</li><li>怨憎会苦</li><li>求不得苦</li><li>五阴炽盛苦</li></ul>\n<p>注意一个字：</p>\n<blockquote><p>甘履八苦</p></blockquote>\n<p>甘。</p>\n<p>甘心情愿。</p>\n<p>众生不是被迫轮回。</p>\n<p>而是喜欢轮回。</p>\n<p>这句话极深。</p>\n<p>赌场里的人如此。</p>\n<p>色情网站里的人如此。</p>\n<p>短视频里的人如此。</p>\n<p>我们自己也是如此。</p>\n<p>明知苦。</p>\n<p>却舍不得。</p>\n<p>这就是无明。</p>\n<hr>\n<h2>第三部分</h2>\n<h3>佛为什么制定戒律？</h3>\n<p>序文说：</p>\n<blockquote><p>開戒德之妙門，示涅槃之正路</p></blockquote>\n<p>这句话可以说是整个律藏总纲。</p>\n<p><span style=\"color: #E00;\">戒律有两个功能：</span></p>\n<h4><span style=\"color: #E00;\">第一层：止恶</span></h4>\n<p><span style=\"color: #E00;\">不让你继续造业。</span></p>\n<h4><span style=\"color: #E00;\">第二层：生善</span></h4>\n<p><span style=\"color: #E00;\">培养清净人格。</span></p>\n<h4><span style=\"color: #E00;\">第三层：入定</span></h4>\n<p><span style=\"color: #E00;\">戒生定。</span></p>\n<h4><span style=\"color: #E00;\">第四层：发慧</span></h4>\n<p><span style=\"color: #E00;\">定生慧。</span></p>\n<h4><span style=\"color: #E00;\">第五层：证涅槃</span></h4>\n<p><span style=\"color: #E00;\">慧断烦恼。</span></p>\n<p><span style=\"color: #E00;\">所以佛法路径其实很简单：</span></p>\n<p><span style=\"color: #E00;\">戒 → 定 → 慧 → 解脱</span></p>\n<p>很多现代学佛人想直接跳到慧。</p>\n<p>结果戒没修。</p>\n<p>定没有。</p>\n<p>最后只剩嘴巴上的空性。</p>\n<hr>\n<h2>第四部分</h2>\n<h3>为什么佛法能久住？</h3>\n<p>后面有个极重要问题。</p>\n<p>舍利弗问佛：</p>\n<blockquote><p>哪些佛法久住？  哪些佛法不久住？</p></blockquote>\n<p>佛回答非常震撼。</p>\n<p>过去六佛中：</p>\n<h4>久住的</h4>\n<ul><li>毗婆尸佛</li><li>尸弃佛</li><li>拘留孙佛</li><li>迦叶佛</li></ul>\n<h4>不久住的</h4>\n<ul><li>拘那含牟尼佛</li><li>随叶佛</li></ul>\n<p>为什么？</p>\n<p>不是因为智慧差。</p>\n<p>不是因为神通差。</p>\n<p>而是：</p>\n<blockquote><p>不結戒亦不說戒</p></blockquote>\n<p>没有建立完整戒律体系。</p>\n<hr>\n<h2>佛举的比喻</h2>\n<p>非常经典。</p>\n<p>他说：</p>\n<p>花放在桌子上。</p>\n<p>风一吹就散。</p>\n<p>为什么？</p>\n<p>因为没有线串起来。</p>\n<p>而戒律，</p>\n<p>就是那根线。</p>\n<hr>\n<h2>这是佛教组织学</h2>\n<p>佛法为什么灭？</p>\n<p>不是经典丢了。</p>\n<p>不是佛像坏了。</p>\n<p>而是人坏了。</p>\n<p>人坏了以后：</p>\n<p>经典还在。</p>\n<p>佛法已经没了。</p>\n<p>所以佛说：</p>\n<blockquote><p>以經法善攝故</p></blockquote>\n<p>靠什么摄持僧团？</p>\n<p>戒律。</p>\n<p>不是感情。</p>\n<p>不是人情。</p>\n<p>不是威望。</p>\n<p>而是制度。</p>\n<hr>\n<h2>第五部分</h2>\n<h3>佛为什么最开始不制戒？</h3>\n<p>这是《四分律》最有价值的部分之一。</p>\n<p>舍利弗请求：</p>\n<blockquote><p>请佛赶快制定戒律。</p></blockquote>\n<p>佛却说：</p>\n<blockquote><p>且止，佛自知時。</p></blockquote>\n<p>为什么？</p>\n<p>因为：</p>\n<blockquote><p>比丘中未有犯有漏法</p></blockquote>\n<p>还没人犯错。</p>\n<p>所以佛不立戒。</p>\n<p>这里透露一个原则：</p>\n<h4><span style=\"color: #E00;\">佛教戒律不是先验规定</span></h4>\n<p><span style=\"color: #E00;\">而是问题导向。</span></p>\n<p><span style=\"color: #E00;\">发现问题。</span></p>\n<p><span style=\"color: #E00;\">解决问题。</span></p>\n<p><span style=\"color: #E00;\">然后立戒。</span></p>\n<p><span style=\"color: #E00;\">因此每条戒背后都有一个真实案例。</span></p>\n<hr>\n<h2>第六部分</h2>\n<h3>第一条波罗夷为什么是淫戒？</h3>\n<p>故事主人公：</p>\n<p>须提那。</p>\n<p>这是佛教历史上第一个犯重戒的比丘。</p>\n<p>他的母亲逼他：</p>\n<p>传宗接代。</p>\n<p>保住家产。</p>\n<p>最后须提那与前妻发生关系。</p>\n<p>佛知道以后大呵责：</p>\n<blockquote><p><span style=\"color: #E00;\">寧持男根著毒蛇口中，不持著女根中。</span></p></blockquote>\n<p><span style=\"color: #E00;\">意思非常直接：</span></p>\n<p><span style=\"color: #E00;\">宁可把生殖器伸进毒蛇口里。</span></p>\n<p><span style=\"color: #E00;\">也不要犯淫欲。</span></p>\n<p><span style=\"color: #E00;\">为什么这么重？</span></p>\n<p><span style=\"color: #E00;\">因为淫欲是轮回发动机。</span></p>\n<hr>\n<h2>佛对欲望的定义</h2>\n<p>佛列出一长串比喻：</p>\n<p>欲望如：</p>\n<ul><li>火坑</li><li>草炬</li><li>毒蛇</li><li>枯骨</li><li>梦境</li><li>刀锋</li><li>利戟</li></ul>\n<p>核心只有一句：</p>\n<blockquote><p>欲爱不断，生死不断。</p></blockquote>\n<p>所以第一波罗夷：</p>\n<p>淫戒。</p>\n<p>一犯即失比丘资格。</p>\n<hr>\n<h2>为什么不是杀戒排第一？</h2>\n<p>因为对于修行人来说：</p>\n<p>最难断的是欲。</p>\n<p>不是杀。</p>\n<p>尤其出家人。</p>\n<p>杀生未必天天遇到。</p>\n<p>欲念天天都在。</p>\n<p>所以佛先处理根本烦恼。</p>\n<hr>\n<h2>第七部分</h2>\n<h3>十句义：佛制定戒律的终极目的</h3>\n<p>佛制定第一戒时说：</p>\n<p>戒律有十种意义：</p>\n<h4>①摄取于僧</h4>\n<p>团体稳定。</p>\n<h4>②令僧欢喜</h4>\n<p>减少矛盾。</p>\n<h4>③令僧安乐</h4>\n<p>建立秩序。</p>\n<h4>④未信者信</h4>\n<p>增强社会信任。</p>\n<h4>⑤已信增长</h4>\n<p>增加信众信心。</p>\n<h4>⑥难调者调顺</h4>\n<p>帮助问题人物。</p>\n<h4>⑦惭愧者安乐</h4>\n<p>保护善人。</p>\n<h4>⑧断现在漏</h4>\n<p>减少现行烦恼。</p>\n<h4>⑨断未来漏</h4>\n<p>减少未来造业。</p>\n<h4>⑩正法久住</h4>\n<p>佛法延续。</p>\n<p>注意最后一个：</p>\n<p>不是个人成佛。</p>\n<p>而是：</p>\n<blockquote><p>正法久住</p></blockquote>\n<p>这是大乘精神。</p>\n<hr>\n<h2>第八部分</h2>\n<h3>第二条波罗夷：盗戒</h3>\n<p>檀尼迦比丘偷用国王木材。</p>\n<p>国王本来想判死刑。</p>\n<p>后来放过。</p>\n<p>结果社会大众开始骂：</p>\n<blockquote><p>沙门释子无有惭愧</p></blockquote>\n<p>问题来了。</p>\n<p>佛为什么如此重视盗戒？</p>\n<p>因为偷盗破坏的是：</p>\n<p>信任。</p>\n<p>而僧团最大的资产，</p>\n<p>不是钱。</p>\n<p>是信誉。</p>\n<p>信誉没了。</p>\n<p>佛法就没了。</p>\n<hr>\n<h2>佛法衰败的根源</h2>\n<p>《四分律》已经提前预言：</p>\n<blockquote><p>不以戒学為先</p></blockquote>\n<p>如果不把戒律放第一位。</p>\n<p>结果会怎样？</p>\n<p>序文用了两个可怕比喻：</p>\n<h4>鸟鼠之喻</h4>\n<p>经典变成鸟窝。</p>\n<p>没人修。</p>\n<h4>猿猴之况</h4>\n<p>大众聚会像猴群。</p>\n<p>混乱不堪。</p>\n<p>这其实就是佛法衰败全过程。</p>\n<hr>\n<h2>核心金句</h2>\n<h4>1</h4>\n<blockquote><p>眾經億百千，戒為第一最。</p></blockquote>\n<p>无数经典之中，</p>\n<p>戒律第一。</p>\n<hr>\n<h4>2</h4>\n<blockquote><p>欲求第一最，當持此禁戒。</p></blockquote>\n<p>想得到真正利益，</p>\n<p>先守戒。</p>\n<hr>\n<h4>3</h4>\n<blockquote><p>佛戒不缺漏，奉持者無憂。</p></blockquote>\n<p>守戒的人，</p>\n<p>内心最安稳。</p>\n<hr>\n<h4>4</h4>\n<blockquote><p>如是諸佛子，修行禁戒本，終不迴邪流，沒溺生死海。</p></blockquote>\n<p>戒律是出离生死的大船。</p>\n<hr>\n<h4>5</h4>\n<blockquote><p><span style=\"color: #E00;\">禁戒猶慈母，守護於行者。</span></p></blockquote>\n<p><span style=\"color: #E00;\">戒律不是束缚。</span></p>\n<p><span style=\"color: #E00;\">是保护。</span></p>\n<hr>\n<h2>给现代修行人的落地启示</h2>\n<p>《四分律》卷一，其实是在告诉今天所有学佛人：</p>\n<p>不要急着研究空性。</p>\n<p>先看看自己有没有做到：</p>\n<ul><li>不邪淫</li><li>不偷盗</li><li>不妄语</li><li>不沉迷欲望</li><li>不被利养名闻牵着走</li></ul>\n<p>佛法衰败从来不是因为没人讲经。</p>\n<p>而是因为没人持戒。</p>\n<p>龙树在《大智度论》中说：</p>\n<blockquote><p>戒为无上菩提本。</p></blockquote>\n<p>《四分律》卷一则进一步告诉我们：</p>\n<p><strong><span style=\"color: #E00;\">戒律不是修行的起点而已。</span></strong></p>\n<p><strong><span style=\"color: #E00;\">戒律本身，就是佛法在人间存在的形状。</span></strong></p>\n<p><span style=\"color: #E00;\">一个人守住戒律，</span></p>\n<p><span style=\"color: #E00;\">佛法就在他身上住世。</span></p>\n<p><span style=\"color: #E00;\">一群人守住戒律，</span></p>\n<p><span style=\"color: #E00;\">佛法就在世间久住。</span></p>\n<p>所以整卷《四分律》开篇其实只讲了一句话：</p>\n<p><strong><span style=\"color: #E00;\">佛法能不能救世界，不取决于经典有多高深，而取决于还有多少人愿意认真持戒。</span></strong></p>\n<p><strong><span style=\"color: #E00;\">​</span></strong></p>"},{"id":"section-002","kind":"volume","number":2,"title":"第2卷｜《四分律卷第二》到底讲什么？","html":"<p>这是《四分律》卷第二中极重要的一卷，内容涵盖：</p>\n<ol><li>第二波罗夷——杀人戒（断人命）</li><li>第四波罗夷——大妄语戒（未证言证）</li><li>第一僧残——故意手淫出精</li><li>第二僧残——淫心触女身</li></ol>\n<p>这卷实际上揭示了一个非常深刻的问题：</p>\n<p><strong>修行最大的危险，不是外境，而是走偏。</strong></p>\n<p>有的人把厌离修成厌世；</p>\n<p>有的人把修行修成名利；</p>\n<p>有的人把持戒修成压抑；</p>\n<p>有的人把梵行修成邪行。</p>\n<p>佛陀在这一卷里，连续纠正四种严重偏差。</p>\n<hr>\n<h2>《四分律卷第二》到底讲什么？</h2>\n<h3>第一部分</h3>\n<h2>不净观修偏了，竟然导致集体自杀</h2>\n<p>这一段是整个佛教史上极著名的事件。</p>\n<p>佛在毗舍离赞叹：</p>\n<ul><li>不净观</li><li>身体不净</li><li>厌离贪欲</li></ul>\n<p>比丘们非常认真。</p>\n<p>结果出现问题。</p>\n<p>他们没有证空性。</p>\n<p>只证到厌恶。</p>\n<p>于是：</p>\n<blockquote><p>厌恶身体  厌恶生命  厌恶存在</p></blockquote>\n<p>最后发展成：</p>\n<ul><li>求人杀自己</li><li>赞叹死亡</li><li>劝别人去死</li></ul>\n<p>甚至出现一个比丘：</p>\n<p>勿力伽难提。</p>\n<p>专门帮人杀人。</p>\n<p>后来越杀越多。</p>\n<p>一天杀几十个。</p>\n<p>整个僧园尸体遍地。</p>\n<p>犹如坟场。</p>\n<hr>\n<h3>龙树为什么特别重视这一段？</h3>\n<p>因为这里暴露出一个修行陷阱：</p>\n<h4>厌离 ≠ 解脱</h4>\n<p>很多人以为：</p>\n<p>讨厌身体就是修行。</p>\n<p>错。</p>\n<p>佛教不是厌恶身体。</p>\n<p>佛教是看破身体。</p>\n<p>二者完全不同。</p>\n<p>厌恶：</p>\n<blockquote><p>这是脏东西。</p></blockquote>\n<p>看破：</p>\n<blockquote><p>这是因缘法。</p></blockquote>\n<hr>\n<p>一个恨身体的人：</p>\n<p>还是执着身体。</p>\n<p>只是从贪变成嗔。</p>\n<p>还是被身体绑住。</p>\n<p>所以《大智度论》说：</p>\n<blockquote><p>贪身是病，嗔身亦是病。</p></blockquote>\n<hr>\n<h3>佛陀如何纠偏？</h3>\n<p>佛没有继续加强不净观。</p>\n<p>而是改讲：</p>\n<p>阿那般那念。</p>\n<p>即：</p>\n<h4>观呼吸</h4>\n<p>呼吸出。</p>\n<p>知道出。</p>\n<p>呼吸入。</p>\n<p>知道入。</p>\n<p>安住当下。</p>\n<p>身心自然平衡。</p>\n<hr>\n<p>佛说：</p>\n<p>阿那般那三昧能灭诸不善法。</p>\n<p>这是佛教禅修史上的重大转折。</p>\n<hr>\n<h2>对现代人的启示</h2>\n<p>今天很多人也在犯同样错误。</p>\n<p>例如：</p>\n<ul><li>抑郁</li><li>厌世</li><li>否定自己</li><li>觉得人生没意义</li></ul>\n<p>其实本质一样。</p>\n<p>都属于：</p>\n<blockquote><p>厌离没有智慧引导。</p></blockquote>\n<p>佛法不是教你恨人生。</p>\n<p>佛法是教你看透人生。</p>\n<hr>\n<h2>第二部分</h2>\n<h2>杀人戒为什么列第一重罪？</h2>\n<p>佛制定：</p>\n<blockquote><p>故自手断人命，波罗夷。</p></blockquote>\n<p>即：</p>\n<p>开除僧籍。</p>\n<p>永远失去比丘资格。</p>\n<hr>\n<p>因为生命是一切修行基础。</p>\n<p>杀人等于：</p>\n<p>直接断掉众生成佛因缘。</p>\n<p>所以极重。</p>\n<hr>\n<p>这一戒特别值得现代人注意。</p>\n<p>佛不仅禁止：</p>\n<h4>自己杀</h4>\n<p>还禁止：</p>\n<ul><li>教人杀</li><li>雇人杀</li><li>暗示别人自杀</li><li>提供自杀工具</li><li>鼓励别人去死</li></ul>\n<p>全部重罪。</p>\n<hr>\n<p>最震撼的是这一条：</p>\n<blockquote><p>宁死不生。</p></blockquote>\n<p>如果故意对别人说：</p>\n<blockquote><p>你活着有什么意思？  不如死了算了。</p></blockquote>\n<p>导致对方自杀。</p>\n<p>佛律判定：</p>\n<p>波罗夷。</p>\n<hr>\n<h2>现代启示</h2>\n<p>网络时代特别容易犯。</p>\n<p>例如：</p>\n<ul><li>网暴</li><li>霸凌</li><li>恶意羞辱</li></ul>\n<p>如果导致别人轻生。</p>\n<p>业极重。</p>\n<hr>\n<h2>第三部分</h2>\n<h2>未证言证——佛说这是最大的贼</h2>\n<p>当时饥荒。</p>\n<p>比丘讨饭困难。</p>\n<p>于是有人想出办法：</p>\n<p>向居士吹牛。</p>\n<p>说自己：</p>\n<ul><li>阿罗汉</li><li>有神通</li><li>会他心通</li></ul>\n<p>结果居士感动得：</p>\n<p>自己舍不得吃。</p>\n<p>全供养比丘。</p>\n<hr>\n<p>佛听后震怒。</p>\n<p>直接说：</p>\n<blockquote><p>世有二贼。</p></blockquote>\n<p>又说：</p>\n<blockquote><p>为口腹故，自称得上人法者，是最大贼。</p></blockquote>\n<p>为什么？</p>\n<p>因为：</p>\n<p>骗钱只是骗财。</p>\n<p>未证言证：</p>\n<p>骗的是众生信心。</p>\n<hr>\n<h3>这一戒今天更值得警惕</h3>\n<p>现在网络上：</p>\n<p>到处都是：</p>\n<ul><li>开悟大师</li><li>神通大师</li><li>转世活佛</li><li>宇宙导师</li></ul>\n<p>动不动：</p>\n<blockquote><p>我见佛了。  我证果了。  我开悟了。</p></blockquote>\n<hr>\n<p>佛律态度极明确：</p>\n<p>如果没证而说证。</p>\n<p>波罗夷。</p>\n<p>直接出局。</p>\n<hr>\n<h3>这里有个特殊例外</h3>\n<p>佛特别补充：</p>\n<h4>增上慢不犯</h4>\n<p>什么意思？</p>\n<p>有人确实以为自己证果。</p>\n<p>后来发现没证。</p>\n<p>不是故意骗人。</p>\n<p>属于误判。</p>\n<p>不犯波罗夷。</p>\n<hr>\n<p>说明佛法重：</p>\n<h4>故意欺骗</h4>\n<p>而不是认知错误。</p>\n<hr>\n<h2>第四部分</h2>\n<h2>手淫戒为什么列入僧残？</h2>\n<p>这里出现著名人物：</p>\n<p>迦留陀夷。</p>\n<p>欲火很重。</p>\n<p>他发现：</p>\n<p>手淫以后舒服。</p>\n<p>于是故意自慰。</p>\n<hr>\n<p>佛制定：</p>\n<blockquote><p>故弄阴失精，僧伽婆尸沙。</p></blockquote>\n<p>即：</p>\n<p>僧残罪。</p>\n<p>重罪。</p>\n<p>必须向僧团忏悔并接受处分。</p>\n<hr>\n<p>这里很多人容易误解。</p>\n<p>佛并不是说：</p>\n<p>精液神圣。</p>\n<p>而是说：</p>\n<p>问题在欲心。</p>\n<p>核心不在精。</p>\n<p>核心在贪。</p>\n<hr>\n<p>所以梦遗不犯。</p>\n<p>佛明确说：</p>\n<blockquote><p>除梦中。</p></blockquote>\n<p>因为梦遗不是故意。</p>\n<p>没有造作心。</p>\n<hr>\n<h3>佛陀对睡眠的观察</h3>\n<p>这里还有一段极有价值。</p>\n<p>佛说乱意睡眠五过失：</p>\n<ol><li>恶梦</li><li>诸天不护</li><li>心不入法</li><li>不思惟明相</li><li>梦中失精</li></ol>\n<p><span style=\"color: #00C7B9;\">善意睡眠五功德：</span></p>\n<ol><li><span style=\"color: #00C7B9;\">不见恶梦</span></li><li><span style=\"color: #00C7B9;\">诸天守护</span></li><li><span style=\"color: #00C7B9;\">心入于法</span></li><li><span style=\"color: #00C7B9;\">明相现前</span></li><li><span style=\"color: #00C7B9;\">不失精</span></li></ol>\n<p><span style=\"color: #00C7B9;\">这与现代心理学也相通：</span></p>\n<p><span style=\"color: #00C7B9;\">睡前最后一个念头，</span></p>\n<p><span style=\"color: #00C7B9;\">会影响整个潜意识活动。</span></p>\n<hr>\n<h2>第五部分</h2>\n<h2>淫心触女——为什么也是僧残？</h2>\n<p>迦留陀夷后来学聪明了。</p>\n<p>不能手淫。</p>\n<p>那就接触女人。</p>\n<p>于是：</p>\n<ul><li>拉手</li><li>抚摸</li><li>亲吻</li><li>搂抱</li></ul>\n<p>佛再制定第二僧残。</p>\n<p>只要：</p>\n<blockquote><p>淫欲意 + 身体接触</p></blockquote>\n<p>即犯僧残。</p>\n<hr>\n<p>关键条件有两个：</p>\n<h4>第一</h4>\n<p>有欲心。</p>\n<h4>第二</h4>\n<p>有身体接触。</p>\n<p>缺一不成。</p>\n<hr>\n<p>所以律中特别说明：</p>\n<p>正常接触。</p>\n<p>帮助别人。</p>\n<p>拿东西。</p>\n<p>意外碰触。</p>\n<p>都不犯。</p>\n<hr>\n<h2>全卷核心</h2>\n<p>如果把《四分律》卷第二浓缩成一句话：</p>\n<blockquote><p>修行最大的危险，不是烦恼，而是把烦恼包装成修行。</p></blockquote>\n<p>婆裘园比丘：</p>\n<p>把厌世包装成解脱。</p>\n<p>妄语比丘：</p>\n<p>把求利包装成证果。</p>\n<p>迦留陀夷：</p>\n<p>把欲望包装成方便。</p>\n<p>结果全部被佛严厉制止。</p>\n<hr>\n<h2>给现代修行人的落地指南</h2>\n<h4>第一条</h4>\n<p>不要把厌离修成厌世。</p>\n<p>看破身体。</p>\n<p>不要恨身体。</p>\n<p>看透人生。</p>\n<p>不要否定人生。</p>\n<hr>\n<h4>第二条</h4>\n<p><span style=\"color: #00C7B9;\">永远不要谈自己证果。</span></p>\n<p><span style=\"color: #00C7B9;\">真正有功夫的人，</span></p>\n<p><span style=\"color: #00C7B9;\">往往越来越谦卑。</span></p>\n<p><span style=\"color: #00C7B9;\">越接近实相，</span></p>\n<p><span style=\"color: #00C7B9;\">越知道自己习气深重。</span></p>\n<hr>\n<h4>第三条</h4>\n<p><span style=\"color: #00C7B9;\">色情问题不要硬压。</span></p>\n<p><span style=\"color: #00C7B9;\">佛陀在这里给出的方向很清楚：</span></p>\n<p><span style=\"color: #00C7B9;\">不是靠恐惧。</span></p>\n<p><span style=\"color: #00C7B9;\">不是靠自责。</span></p>\n<p><span style=\"color: #00C7B9;\">而是：</span></p>\n<ul><li><span style=\"color: #00C7B9;\">持戒</span></li><li><span style=\"color: #00C7B9;\">远缘</span></li><li><span style=\"color: #00C7B9;\">正念</span></li><li><span style=\"color: #00C7B9;\">调息</span></li></ul>\n<p><span style=\"color: #00C7B9;\">尤其是阿那般那念。</span></p>\n<p><span style=\"color: #00C7B9;\">这是佛亲自拿来纠正整个僧团偏差的方法。</span></p>\n<hr>\n<h4>第四条</h4>\n<p>不要研究别人。</p>\n<p>先观察自己的心。</p>\n<p>当出现：</p>\n<ul><li>贪</li><li>嗔</li><li>慢</li><li>求名</li><li>求利</li><li>求异于人</li></ul>\n<p>立刻警觉。</p>\n<p>因为《四分律》这一卷所处罚的所有重罪，根源其实只有一个：</p>\n<blockquote><p>不肯老实面对自己的烦恼，却想绕过烦恼直接成圣。</p></blockquote>\n<p>而佛陀整部律藏都在告诉我们：</p>\n<p><strong>解脱没有捷径。先做一个诚实的人，才有资格做一个修行人。</strong></p>\n<p><strong>​</strong></p>"},{"id":"section-003","kind":"volume","number":3,"title":"第3卷｜一、本卷核心主题","html":"<p>这是《四分律》十三僧残法中的第3、4、5、6、7条戒，内容开始从前面单纯的淫欲行为，进一步深入到<strong>语言、暗示、媒介、财物、建筑、僧团管理</strong>等层面。</p>\n<p>如果说前面两条戒是在堵住「身体造业」，那么这一卷开始是在堵住「欲心的变形」。</p>\n<hr>\n<h2>一、本卷核心主题</h2>\n<p>这一卷实际上围绕一个主题：</p>\n<blockquote><p><strong>比丘最大的危险，不只是犯淫，而是利用僧人的身份满足自己的欲望。</strong></p></blockquote>\n<p>欲望有很多种：</p>\n<ul><li>色欲</li><li>名欲</li><li>利养欲</li><li>建筑欲</li><li>权力欲</li><li>人情欲</li></ul>\n<p>佛陀在这里一层一层堵死。</p>\n<hr>\n<h2>第一部分：粗恶淫语戒（僧残第三）</h2>\n<p>缘起人物：</p>\n<p><strong>迦留陀夷</strong></p>\n<p>这位在《四分律》里几乎是著名的「戒律贡献者」。</p>\n<p>很多戒都是因他而制。</p>\n<hr>\n<h3>犯戒经过</h3>\n<p>他已经知道：</p>\n<ul><li>不可手淫</li><li>不可身体接触女人</li></ul>\n<p>于是开始钻空子。</p>\n<p>站在门口：</p>\n<blockquote><p>「诸妹，进来看看。」</p></blockquote>\n<p>等女人进房后：</p>\n<p>开始讲黄色话。</p>\n<p>询问：</p>\n<ul><li>生殖器怎样</li><li>与丈夫如何行淫</li><li>与别人如何行淫</li></ul>\n<p>甚至直接要求。</p>\n<p>结果妇女吓坏。</p>\n<hr>\n<p>她们说了一句很经典的话：</p>\n<blockquote><p>我们本来以为这里是最安全的地方，  今天反而生出恐惧。</p></blockquote>\n<p>又说：</p>\n<blockquote><p>本谓水能灭火，  今火从水生。</p></blockquote>\n<p>意思是：</p>\n<p>本来以为出家人能灭贪欲，</p>\n<p>结果贪欲反而从出家人这里冒出来。</p>\n<p>非常重的话。</p>\n<hr>\n<h3>佛为什么判僧残？</h3>\n<p>因为这里已经不是普通说话。</p>\n<p>而是：</p>\n<blockquote><p>利用宗教身份进行性骚扰。</p></blockquote>\n<p>本质上已经属于：</p>\n<p><strong>精神淫行。</strong></p>\n<p>身体虽未犯，</p>\n<p>心已经在犯。</p>\n<hr>\n<h3>佛陀真正防范什么？</h3>\n<p>不是语言本身。</p>\n<p>而是：</p>\n<blockquote><p>借法衣接近异性。</p></blockquote>\n<p>今天同样适用。</p>\n<p>例如：</p>\n<ul><li>打着学佛名义聊天</li><li>打着开示名义暧昧</li><li>打着关怀名义撩拨</li></ul>\n<p>都属于这一类。</p>\n<hr>\n<h2>第二部分：赞叹自己求淫供养戒（僧残第四）</h2>\n<p>迦留陀夷继续升级。</p>\n<p>他说：</p>\n<blockquote><p>我持戒第一。  我修梵行。  我是好修行人。</p></blockquote>\n<p>然后接一句：</p>\n<blockquote><p>你应该用淫欲供养我。</p></blockquote>\n<p>这就离谱了。</p>\n<hr>\n<h3>佛为何重判？</h3>\n<p>因为已经出现：</p>\n<h4>宗教包装下的性索取</h4>\n<p>用现代语言说：</p>\n<p>就是：</p>\n<blockquote><p>利用修行身份骗色。</p></blockquote>\n<p>佛陀对此极其严厉。</p>\n<p>直接判：</p>\n<p>僧残。</p>\n<hr>\n<h3>深层意义</h3>\n<p>佛陀不是怕别人赞叹自己。</p>\n<p>而是怕：</p>\n<h4>把修行变成交易</h4>\n<p>例如：</p>\n<ul><li>我有神通</li><li>我持戒清净</li><li>我能加持你</li></ul>\n<p>然后：</p>\n<ul><li>收钱</li><li>收色</li><li>收供养</li></ul>\n<p>这都是同一逻辑。</p>\n<hr>\n<h2>第三部分：媒嫁戒（僧残第五）</h2>\n<p>缘起：</p>\n<p>比丘迦罗。</p>\n<p>以前是大臣。</p>\n<p>特别会做人情。</p>\n<p>于是开始帮人介绍对象。</p>\n<hr>\n<p>后来全城人都来找他：</p>\n<ul><li>看八字</li><li>看门当户对</li><li>看婚姻</li></ul>\n<p>甚至：</p>\n<blockquote><p>男找女  女找男</p></blockquote>\n<p>都让他介绍。</p>\n<hr>\n<p>佛陀发现后立即制戒。</p>\n<hr>\n<h3>为什么介绍婚姻这么严重？</h3>\n<p>很多人会奇怪。</p>\n<p>介绍对象不是好事吗？</p>\n<p>佛陀看到的更深。</p>\n<p>因为这里面有：</p>\n<h4>欲爱</h4>\n<h4>利益</h4>\n<h4>人情债</h4>\n<h4>站队</h4>\n<h4>偏私</h4>\n<h4>纠纷</h4>\n<hr>\n<p>一旦：</p>\n<p>婚姻成功</p>\n<p>双方感谢你。</p>\n<p>婚姻失败</p>\n<p>双方怨恨你。</p>\n<p>僧团立即卷入世俗网。</p>\n<hr>\n<p>所以佛说：</p>\n<blockquote><p>我是教你离欲，  不是教你和合欲。</p></blockquote>\n<p>这句话是重点。</p>\n<hr>\n<h3>现代启示</h3>\n<p>出家人：</p>\n<p>不要做媒人。</p>\n<p>在家修行人：</p>\n<p>也不要过度卷入别人的感情因缘。</p>\n<p>否则：</p>\n<p>两边不讨好。</p>\n<p>还背业。</p>\n<hr>\n<h2>第四部分：建房戒（僧残第六）</h2>\n<p>这是非常重要的一条。</p>\n<p>缘起：</p>\n<p>旷野比丘盖豪宅。</p>\n<hr>\n<p>为了盖房：</p>\n<p>天天找居士要：</p>\n<ul><li>木材</li><li>竹子</li><li>绳索</li><li>工匠</li><li>车辆</li></ul>\n<p>结果出现什么？</p>\n<p>居士一看见比丘：</p>\n<p>马上躲。</p>\n<hr>\n<p>佛陀讲了三个故事。</p>\n<hr>\n<h3>龙王珠子的故事</h3>\n<p>梵志向龙王要珠子。</p>\n<p>龙王立刻不来了。</p>\n<p>因为：</p>\n<blockquote><p>你见面就要东西。</p></blockquote>\n<hr>\n<h3>鸟翅膀故事</h3>\n<p>鸟晚上住树林。</p>\n<p>比丘对鸟说：</p>\n<blockquote><p>把翅膀给我。</p></blockquote>\n<p>鸟立刻飞走。</p>\n<hr>\n<h3>赖吒婆罗故事</h3>\n<p>连自己父母家都不求。</p>\n<p>因为：</p>\n<blockquote><p>多求人不爱。</p></blockquote>\n<hr>\n<p>佛最后总结：</p>\n<blockquote><p><span style=\"color: #00C7B9;\">多求人不爱，</span>  <span style=\"color: #00C7B9;\">过求致怨憎。</span></p></blockquote>\n<p><span style=\"color: #00C7B9;\">这已经超越戒律。</span></p>\n<p><span style=\"color: #00C7B9;\">是人性规律。</span></p>\n<hr>\n<h3>佛为什么限制房屋尺寸？</h3>\n<p>规定：</p>\n<p>长十二搩手</p>\n<p>宽七搩手</p>\n<p>必须僧团审批。</p>\n<hr>\n<p>原因不是建筑学。</p>\n<p>而是：</p>\n<h4>防贪</h4>\n<h4>防攀比</h4>\n<h4>防资源浪费</h4>\n<h4>防僧团地产化</h4>\n<hr>\n<p>今天看很多寺院乱象。</p>\n<p>其实佛二千五百年前早看到了。</p>\n<hr>\n<h2>第五部分：大房戒（僧残第七）</h2>\n<p>缘起：</p>\n<p>尊者闡陀。</p>\n<p>砍神树盖大房。</p>\n<p>引起众怒。</p>\n<hr>\n<p>佛说：</p>\n<blockquote><p>不得斫伐神树。</p></blockquote>\n<p>这里重点不是迷信。</p>\n<p>而是：</p>\n<h4>尊重生态</h4>\n<h4>尊重公众利益</h4>\n<h4>尊重众生依止处</h4>\n<hr>\n<p>因为那棵树：</p>\n<ul><li>行人休息</li><li>车马停靠</li><li>众生依止</li></ul>\n<p>属于公共资源。</p>\n<hr>\n<p>为了自己住得舒服。</p>\n<p>把公共资源毁掉。</p>\n<p>佛认为不如法。</p>\n<hr>\n<h3>与上一戒区别</h3>\n<p>第六戒：</p>\n<p>无主自建房。</p>\n<p>第七戒：</p>\n<p>有施主供养建大房。</p>\n<hr>\n<p>无论谁出钱。</p>\n<p>都必须：</p>\n<ul><li>僧团批准</li><li>无难处</li><li>无妨处</li></ul>\n<p>不能自己决定。</p>\n<hr>\n<h2>本卷最精彩的一句话</h2>\n<p>来自佛陀的总结：</p>\n<blockquote><p>多求人不爱，  过求致怨憎。</p></blockquote>\n<p>这是修行人极重要的处世原则。</p>\n<hr>\n<h2>本卷大义总结</h2>\n<p>这一卷表面讲五条僧残戒。</p>\n<p>实际上佛陀在解决五种欲望：</p>\n<p>| <strong>戒条</strong> | <strong>对治烦恼</strong> | | ------ | -------- | | 粗恶淫语   | 色欲       | | 自赞求供养  | 名欲＋色欲    | | 媒嫁     | 人情欲      | | 私建房舍   | 利养欲      | | 大房舍    | 享受欲      |</p>\n<p>归根到底：</p>\n<blockquote><p><span style=\"color: #00C7B9;\">一切戒律，</span>  <span style=\"color: #00C7B9;\">都是在保护修行人的出离心。</span></p></blockquote>\n<p>《四分律》到了这里已经越来越清楚地告诉我们：</p>\n<p><strong><span style=\"color: #00C7B9;\">毁掉一个修行人的，往往不是大恶，而是那些披着合理外衣的欲望。</span></strong></p>\n<p><span style=\"color: #00C7B9;\">色欲可以穿上关怀的外衣；</span></p>\n<p><span style=\"color: #00C7B9;\">贪财可以穿上建设的外衣；</span></p>\n<p><span style=\"color: #00C7B9;\">名利可以穿上弘法的外衣；</span></p>\n<p><span style=\"color: #00C7B9;\">人情可以穿上慈悲的外衣。</span></p>\n<p><span style=\"color: #00C7B9;\">而戒律的作用，就是把这些伪装一层层撕开，让修行人看见自己的真实动机。</span></p>\n<p><span style=\"color: #00C7B9;\">这正是本卷最值得现代学佛人反复观照的地方。</span></p>\n<p><span style=\"color: #00C7B9;\">​</span></p>\n<p><span style=\"color: #00C7B9;\">​</span></p>"},{"id":"section-004","kind":"volume","number":4,"title":"第4卷｜一、第八僧残：无根诽谤戒","html":"<p>这是《四分律》卷第四的重要内容，主要包含两大部分：</p>\n<ol><li><strong>十三僧残法第八、第九条的制定因缘（诽谤戒）</strong></li><li><strong>提婆达多破僧因缘的开始</strong></li><li><strong>阿那律、优波离等释种出家的经典故事</strong></li></ol>\n<p>这一卷对于现代修行人尤其重要，因为它集中讨论了三个极容易犯的根本问题：</p>\n<blockquote><p><strong>瞋恨、诽谤、名利。</strong></p></blockquote>\n<p>这三样东西，几乎贯穿整个佛教僧团史，也贯穿每个人的修行史。</p>\n<hr>\n<h2>一、第八僧残：无根诽谤戒</h2>\n<h3>戒文核心</h3>\n<p>佛制定：</p>\n<blockquote><p>若比丘因为瞋恨，  明知没有事实依据，  却故意诬陷别人犯波罗夷重罪，  想毁坏其清净名誉，  犯僧伽婆尸沙（僧残）。</p></blockquote>\n<p>这就是：</p>\n<h4>无根谤戒</h4>\n<hr>\n<h2>慈地比丘为什么犯戒？</h2>\n<p>事情起因很简单。</p>\n<p>慈地比丘觉得：</p>\n<ul><li>分房子时没照顾自己</li><li>分卧具时没照顾自己</li><li>分食物时没照顾自己</li></ul>\n<p>于是越想越气。</p>\n<p>最后生起一个念头：</p>\n<blockquote><p>我让你身败名裂。</p></blockquote>\n<p>于是联合慈比丘尼，</p>\n<p>诬告：</p>\n<blockquote><p>沓婆摩罗子犯淫戒。</p></blockquote>\n<p>实际上：</p>\n<blockquote><p>完全没有这回事。</p></blockquote>\n<p>纯属捏造。</p>\n<hr>\n<p>佛知道后调查。</p>\n<p>沓婆摩罗子说：</p>\n<blockquote><p>我从出生以来，  连梦中都不曾犯淫欲，  何况清醒时。</p></blockquote>\n<p>最后查明：</p>\n<p>全部是假案。</p>\n<hr>\n<h2>为什么会发展到诬陷？</h2>\n<p>因为瞋心升级了。</p>\n<p>流程非常经典：</p>\n<p>第一步：</p>\n<p>不满意</p>\n<p>↓</p>\n<p>第二步：</p>\n<p>委屈</p>\n<p>↓</p>\n<p>第三步：</p>\n<p>抱怨</p>\n<p>↓</p>\n<p>第四步：</p>\n<p>怨恨</p>\n<p>↓</p>\n<p>第五步：</p>\n<p>报复</p>\n<p>↓</p>\n<p>第六步：</p>\n<p>造谣</p>\n<p>↓</p>\n<p>第七步：</p>\n<p>毁人</p>\n<hr>\n<p>很多人以为自己只是生气。</p>\n<p>实际上：</p>\n<blockquote><p>一切诽谤都从委屈开始。</p></blockquote>\n<hr>\n<h2><span style=\"color: #E00;\">佛说两种人决定堕地狱</span></h2>\n<p><span style=\"color: #E00;\">佛直接下结论：</span></p>\n<blockquote><p><span style=\"color: #E00;\">有二种人一向入地狱。</span></p></blockquote>\n<p><span style=\"color: #E00;\">第一：</span></p>\n<p><span style=\"color: #E00;\">假装圣人</span></p>\n<p><span style=\"color: #E00;\">第二：</span></p>\n<p><span style=\"color: #E00;\">诬陷圣人</span></p>\n<p>原文：</p>\n<blockquote><p>若非梵行自称梵行  若真梵行以无根非梵行谤之</p></blockquote>\n<p>这两种罪都极重。</p>\n<p>因为：</p>\n<p>第一种毁坏自己。</p>\n<p>第二种毁坏正法。</p>\n<hr>\n<h2>三种证据原则</h2>\n<p>佛教戒律特别严谨。</p>\n<p>不能听风就是雨。</p>\n<p>必须有：</p>\n<h3>见根</h3>\n<p>亲眼看到</p>\n<hr>\n<h3>闻根</h3>\n<p>亲耳听到</p>\n<hr>\n<h3>疑根</h3>\n<p>有合理疑点</p>\n<p>例如：</p>\n<p>看见深夜与女人进树林；</p>\n<p>听见床榻摇动声；</p>\n<p>看见带血刀具等。</p>\n<p>这才能形成调查依据。</p>\n<hr>\n<p>除此之外：</p>\n<p>统统叫</p>\n<blockquote><p>无根</p></blockquote>\n<hr>\n<p>现代网络时代尤其值得警惕。</p>\n<p>很多人：</p>\n<ul><li>看标题</li><li>看截图</li><li>看短视频</li></ul>\n<p>就开始定罪。</p>\n<p>佛法不允许。</p>\n<hr>\n<h2>现代启示</h2>\n<p>佛其实在建立一个原则：</p>\n<h3><span style=\"color: #E00;\">没有证据</span></h3>\n<p><span style=\"color: #E00;\">不要判断</span></p>\n<h3><span style=\"color: #E00;\">没有调查</span></h3>\n<p><span style=\"color: #E00;\">不要传播</span></p>\n<h3><span style=\"color: #E00;\">没有确认</span></h3>\n<p><span style=\"color: #E00;\">不要下结论</span></p>\n<hr>\n<p><span style=\"color: #E00;\">否则口业极重。</span></p>\n<hr>\n<h2>二、第九僧残：异分取片戒</h2>\n<p>这是比上一条更高级的诽谤。</p>\n<hr>\n<h2>什么叫异分取片？</h2>\n<p>简单说：</p>\n<blockquote><p>把别的事情，  偷换成另一件事情。</p></blockquote>\n<p>今天叫：</p>\n<h3><span style=\"color: #E00;\">断章取义</span></h3>\n<h3><span style=\"color: #E00;\">移花接木</span></h3>\n<h3><span style=\"color: #E00;\">恶意剪辑</span></h3>\n<h3><span style=\"color: #E00;\">带节奏</span></h3>\n<hr>\n<p>慈地比丘第一次诬陷失败后。</p>\n<p>还不死心。</p>\n<p>一天看见：</p>\n<p>一只公羊和母羊交配。</p>\n<p>竟然说：</p>\n<blockquote><p>公羊就是沓婆摩罗子。  母羊就是慈比丘尼。</p></blockquote>\n<p>然后传播：</p>\n<blockquote><p>我亲眼看见他们行淫。</p></blockquote>\n<hr>\n<p>简直荒唐到极点。</p>\n<p>但佛为什么因此再立一条戒？</p>\n<p>因为：</p>\n<p>很多谣言就是这么来的。</p>\n<hr>\n<h2>现代版异分取片</h2>\n<p>例如：</p>\n<p>某法师年轻时谈过恋爱</p>\n<p>↓</p>\n<p>说成：</p>\n<p>现在破戒</p>\n<hr>\n<p>某居士以前做过错事</p>\n<p>↓</p>\n<p>说成：</p>\n<p>现在也是这样</p>\n<hr>\n<p>某人被调查</p>\n<p>↓</p>\n<p>说成：</p>\n<p>已经坐牢</p>\n<hr>\n<p>某人和异性同框</p>\n<p>↓</p>\n<p>说成：</p>\n<p>关系不正当</p>\n<hr>\n<p>这都属于：</p>\n<blockquote><p>异分取片</p></blockquote>\n<hr>\n<p>佛认为这种行为与无根诽谤同罪。</p>\n<p>同犯：</p>\n<h4>僧残</h4>\n<hr>\n<h2>三、阿那律出家的故事</h2>\n<p>这是本卷最温暖的一段。</p>\n<hr>\n<h3>阿那律是谁？</h3>\n<p>后来成为：</p>\n<p>阿那律</p>\n<p>佛弟子中：</p>\n<h4>天眼第一</h4>\n<hr>\n<p>但出家前。</p>\n<p>他是超级富二代。</p>\n<p>每天：</p>\n<ul><li>美女环绕</li><li>三时宫殿</li><li>五欲享受</li></ul>\n<p>标准王族生活。</p>\n<hr>\n<p>哥哥摩诃男告诉他：</p>\n<p>家业很复杂。</p>\n<p>要：</p>\n<ul><li>管田地</li><li>管工人</li><li>管房产</li><li>管礼仪</li></ul>\n<p>阿那律听完直接说：</p>\n<blockquote><p>太麻烦了。</p></blockquote>\n<blockquote><p>我还是出家吧。</p></blockquote>\n<p>这一段特别有意思。</p>\n<p>说明：</p>\n<p>有些人善根成熟时。</p>\n<p>世间荣华反而觉得麻烦。</p>\n<hr>\n<h2>最精彩一句</h2>\n<p>跋提说：</p>\n<p>再享受七年再出家吧。</p>\n<p>阿那律说：</p>\n<blockquote><p>七年太远。</p></blockquote>\n<p>改一年。</p>\n<p>他说：</p>\n<blockquote><p>一年太远。</p></blockquote>\n<p>改七个月。</p>\n<p>他说：</p>\n<blockquote><p>七个月太远。</p></blockquote>\n<p>改一个月。</p>\n<p>他说：</p>\n<blockquote><p>一个月太远。</p></blockquote>\n<p>最后：</p>\n<p>七天。</p>\n<p>阿那律同意。</p>\n<hr>\n<p>原因只有一句：</p>\n<blockquote><p>人命无常。</p></blockquote>\n<p>这是整段最重要的地方。</p>\n<hr>\n<h2>修行人与普通人的区别</h2>\n<p>普通人：</p>\n<p>以后再说。</p>\n<p>修行人：</p>\n<p>现在就做。</p>\n<hr>\n<h2>四、优波离出家</h2>\n<p>这是佛教史上最经典的破除阶级故事。</p>\n<hr>\n<p>优波离原本是：</p>\n<p>理发师。</p>\n<p>社会地位最低。</p>\n<hr>\n<p>释迦族王子们把珠宝全部送给他。</p>\n<p>准备出家。</p>\n<hr>\n<p>结果优波离突然觉悟：</p>\n<blockquote><p>王子都能舍弃荣华。  我为什么不能？</p></blockquote>\n<p>于是追上去一起出家。</p>\n<hr>\n<p>最精彩的是：</p>\n<p>王子们请求佛：</p>\n<blockquote><p>请先度优波离。</p></blockquote>\n<p>为什么？</p>\n<p>因为怕自己骄傲。</p>\n<hr>\n<p>结果：</p>\n<p>优波离先受戒。</p>\n<p>变成上座。</p>\n<hr>\n<p>王子们反而要向理发师顶礼。</p>\n<p>这一招直接打碎我慢。</p>\n<hr>\n<p>后来优波离成为：</p>\n<p>优波离</p>\n<p>佛弟子中：</p>\n<h4>持戒第一</h4>\n<hr>\n<h2>五、跋提比丘的“甚乐！甚乐！”</h2>\n<p>跋提过去是国王。</p>\n<p>有无数护卫。</p>\n<p>天天担心被杀。</p>\n<p>夜夜不安。</p>\n<hr>\n<p>出家后。</p>\n<p>独坐坟场。</p>\n<p>独住树林。</p>\n<p>却常说：</p>\n<blockquote><p>甚乐！  甚乐！</p></blockquote>\n<p>佛问：</p>\n<p>为什么？</p>\n<p>他说：</p>\n<blockquote><p>以前千军万马保护我，  我还是害怕。  现在独自住山林，  却无所恐惧。</p></blockquote>\n<hr>\n<p>这就是：</p>\n<h4>出离乐</h4>\n<hr>\n<p><span style=\"color: #E00;\">佛法的快乐。</span></p>\n<p><span style=\"color: #E00;\">不是得到更多。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<blockquote><p><span style=\"color: #E00;\">不再害怕失去。</span></p></blockquote>\n<hr>\n<h2>六、提婆达多堕落的全过程</h2>\n<p>这一卷后半部极重要。</p>\n<p>因为完整展示：</p>\n<p>一个修行人如何毁掉自己。</p>\n<hr>\n<p>第一阶段</p>\n<p>修行有成</p>\n<p>获得神通</p>\n<hr>\n<p>第二阶段</p>\n<p>获得供养</p>\n<p>阿阇世每天五百车供养。</p>\n<hr>\n<p>第三阶段</p>\n<p>嫉妒佛陀</p>\n<p>想领导僧团。</p>\n<hr>\n<p>第四阶段</p>\n<p>争权</p>\n<p>要求佛交出僧团。</p>\n<hr>\n<p>第五阶段</p>\n<p>被拒绝</p>\n<p>生瞋恨。</p>\n<hr>\n<p>第六阶段</p>\n<p>谋害佛陀</p>\n<p>派杀手。</p>\n<p>滚大石。</p>\n<p>伤佛足。</p>\n<hr>\n<p>第七阶段</p>\n<p>破和合僧</p>\n<p>另立组织。</p>\n<hr>\n<p>堕落完成。</p>\n<hr>\n<h2>本卷核心总结</h2>\n<p>这一卷实际上讲了四件事：</p>\n<h4>第一</h4>\n<p>瞋恨最终会发展成诽谤</p>\n<hr>\n<h4>第二</h4>\n<p>没有证据不要定罪</p>\n<p>不要传播未经证实的信息</p>\n<hr>\n<h4>第三</h4>\n<p><span style=\"color: #E00;\">真正的出离心来自深知无常</span></p>\n<p><span style=\"color: #E00;\">阿那律的出家就是典范</span></p>\n<hr>\n<h4>第四</h4>\n<p>提婆达多告诉我们：</p>\n<blockquote><p>修行最大的敌人，  不是贪欲。</p></blockquote>\n<p>而是：</p>\n<blockquote><p>名闻利养。</p></blockquote>\n<p>因为欲望未必毁掉修行人。</p>\n<p>但：</p>\n<p><strong>嫉妒、权力欲、领袖欲、名利心，足以让一个有神通、有禅定、有福报的人彻底堕落。</strong></p>\n<p>所以这一卷《四分律》的主旨，可以浓缩成一句话：</p>\n<blockquote><p><span style=\"color: #E00;\">宁可没有神通，不可没有戒德；宁可无人供养，不可生嫉妒心；宁可默默修行，不可因瞋恨而毁谤贤善。</span></p></blockquote>\n<p>​</p>\n<p>​</p>"},{"id":"section-005","kind":"volume","number":5,"title":"第5卷｜一、僧残第十条：破和合僧","html":"<p>这是《四分律》卷第五，内容主要完成了<strong>十三僧残法中的后半部分（第10～13条）</strong>，以及开始讲解<strong>二不定法</strong>。</p>\n<p>这一卷极其重要，因为它开始从“淫欲问题”转向“僧团问题”，重点处理：</p>\n<blockquote><p><strong>破僧、帮派、恶行败坏信众、拒绝接受批评。</strong></p></blockquote>\n<p>如果说前面的僧残戒是在治“欲望”，那么这一卷是在治：</p>\n<p><strong>我慢、党争、名利、权力欲。</strong></p>\n<p>从佛教历史来看：</p>\n<blockquote><p>色欲毁一个人；  权力欲毁一个团体。</p></blockquote>\n<p>所以佛陀把这些戒放进僧残罪。</p>\n<hr>\n<h2>一、僧残第十条：破和合僧</h2>\n<p>这一条因提婆达多而制定。</p>\n<p>提婆达多提出五法：</p>\n<ul><li>尽形寿乞食</li><li>尽形寿穿粪扫衣</li><li>尽形寿露坐</li><li>不食鱼肉</li><li>不受别请</li></ul>\n<p>这些本来是头陀行。</p>\n<p>问题不在头陀行。</p>\n<p>而在于：</p>\n<blockquote><p>提婆达多想把它变成强制标准，  借此另立山头。</p></blockquote>\n<p>所以佛陀说：</p>\n<blockquote><p>莫破和合僧。</p></blockquote>\n<hr>\n<h3>什么叫破僧？</h3>\n<p>律中列出十八种：</p>\n<ul><li>法说成非法</li><li>非法说成法</li><li>律说成非律</li><li>非律说成律</li></ul>\n<p>等等。</p>\n<p>核心一句：</p>\n<blockquote><p>把大众本来一致认可的法义故意撕裂。</p></blockquote>\n<p>这就叫破僧。</p>\n<hr>\n<h4>佛陀为什么把破僧判得这么重？</h4>\n<p>因为：</p>\n<p>杀一个人，</p>\n<p>伤害一个人。</p>\n<p>破僧：</p>\n<p>伤害未来无数众生。</p>\n<p>因此经中说：</p>\n<blockquote><p><span style=\"color: #E00;\">破和合僧者，</span>  <span style=\"color: #E00;\">一劫堕地狱。</span></p></blockquote>\n<hr>\n<h3>对现代佛教的启示</h3>\n<p>今天很多道场问题：</p>\n<p>不是邪见。</p>\n<p>而是：</p>\n<ul><li>拉山头</li><li>拉群</li><li>建小圈子</li></ul>\n<p>嘴上说：</p>\n<blockquote><p>我是护法。</p></blockquote>\n<p>实际上：</p>\n<blockquote><p>我是在护自己的人马。</p></blockquote>\n<p>这就是提婆达多路线。</p>\n<p>佛陀最怕的不是意见不同。</p>\n<p>而是：</p>\n<blockquote><p>把意见不同升级成组织分裂。</p></blockquote>\n<hr>\n<h2>二、僧残第十一条：助破僧者</h2>\n<p>佛陀发现：</p>\n<p>真正危险的人，</p>\n<p>往往不是提婆达多。</p>\n<p>而是：</p>\n<blockquote><p>提婆达多身边那群鼓掌的人。</p></blockquote>\n<p>因此制定第十一僧残。</p>\n<hr>\n<h3>什么叫助破僧？</h3>\n<p>律中原文：</p>\n<blockquote><p>此比丘是法语比丘，  此比丘是律语比丘，  我等忍可。</p></blockquote>\n<p>意思是：</p>\n<p>虽然知道他错。</p>\n<p>仍然替他站台。</p>\n<hr>\n<h4>佛陀看得很透</h4>\n<p>一个人造反不可怕。</p>\n<p>可怕的是：</p>\n<p>十个人替他传播。</p>\n<p>百个人替他洗白。</p>\n<p>千个人替他带节奏。</p>\n<p>于是：</p>\n<p>谣言变真理。</p>\n<p>邪见变潮流。</p>\n<hr>\n<h3>今天最像什么？</h3>\n<p>微信群。</p>\n<p>朋友圈。</p>\n<p>自媒体。</p>\n<p>短视频。</p>\n<p>很多人根本不懂戒律。</p>\n<p>但天天：</p>\n<ul><li>洗白错误</li><li>吹捧邪师</li><li>传播偏见</li></ul>\n<p>这其实已经接近：</p>\n<blockquote><p>助破僧。</p></blockquote>\n<hr>\n<h2>三、僧残第十二条：污家恶行</h2>\n<p>这是本卷最有现实意义的一条。</p>\n<p>故事主人公：</p>\n<p>阿湿婆与富那婆娑。</p>\n<hr>\n<h3>他们干了什么？</h3>\n<p>表面看：</p>\n<p>没犯淫戒。</p>\n<p>没偷盗。</p>\n<p>没杀生。</p>\n<p>但行为极其轻浮。</p>\n<p>例如：</p>\n<ul><li>种花</li><li>编花环</li><li>与妇女嬉笑</li><li>唱歌</li><li>跳舞</li><li>模仿鸟叫</li><li>给人表演</li><li>受雇娱乐</li></ul>\n<p>最后变成：</p>\n<p>当地人只喜欢他们。</p>\n<p>反而看不起持戒比丘。</p>\n<hr>\n<h3>佛陀为什么重罚？</h3>\n<p>因为：</p>\n<p>他们损坏了僧团形象。</p>\n<p>律中有句话非常经典：</p>\n<blockquote><p>污他家。</p></blockquote>\n<p>什么叫污家？</p>\n<p>利用信众建立私人关系网。</p>\n<hr>\n<h4>四种污家</h4>\n<h5>1、依家污家</h5>\n<p>向甲居士拿东西。</p>\n<p>转送乙居士。</p>\n<p>做人情。</p>\n<hr>\n<h5>2、依利养污家</h5>\n<p>把供养变成利益交换。</p>\n<p>谁供养我。</p>\n<p>我照顾谁。</p>\n<hr>\n<h5>3、依亲友污家</h5>\n<p>利用关系网。</p>\n<p>形成利益集团。</p>\n<hr>\n<h5>4、依僧伽蓝污家</h5>\n<p>拿寺院资源做人情。</p>\n<p>慷大众之慨。</p>\n<p>收自己的人情。</p>\n<hr>\n<h3>这条戒的现代意义</h3>\n<p>很多寺院问题：</p>\n<p>并非淫戒。</p>\n<p>而是：</p>\n<ul><li>拉关系</li><li>建圈子</li><li>经营人脉</li></ul>\n<p>最后形成：</p>\n<p>私人寺院。</p>\n<p>私人道场。</p>\n<p>私人粉丝团。</p>\n<p>佛陀两千五百年前已经全部看见。</p>\n<hr>\n<h2>四、僧残第十三条：恶性不受谏</h2>\n<p>主人公：</p>\n<p>闡陀比丘。</p>\n<p>特点：</p>\n<p>谁说都不听。</p>\n<hr>\n<p>他说：</p>\n<blockquote><p>你们不要教我。  应该我教你们。</p></blockquote>\n<p>这是典型的：</p>\n<p>我慢。</p>\n<hr>\n<h3>佛陀为什么把它列入僧残？</h3>\n<p>因为：</p>\n<p><span style=\"color: #E00;\">犯错不可怕。</span></p>\n<p><span style=\"color: #E00;\">不改才可怕。</span></p>\n<hr>\n<h4><span style=\"color: #E00;\">佛教最重要的修行能力</span></h4>\n<p><span style=\"color: #E00;\">不是禅定。</span></p>\n<p><span style=\"color: #E00;\">不是神通。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<blockquote><p><span style=\"color: #E00;\">能接受批评。</span></p></blockquote>\n<p><span style=\"color: #E00;\">所以佛陀说：</span></p>\n<blockquote><p><span style=\"color: #E00;\">展转相教。</span>  <span style=\"color: #E00;\">展转相谏。</span>  <span style=\"color: #E00;\">展转忏悔。</span></p></blockquote>\n<p><span style=\"color: #E00;\">这是僧团存在的根本。</span></p>\n<hr>\n<h3>修行最大的障碍</h3>\n<p>不是贪欲。</p>\n<p>不是愤怒。</p>\n<p>而是：</p>\n<blockquote><p>我没有错。</p></blockquote>\n<p>一旦进入这个状态。</p>\n<p>所有成长停止。</p>\n<hr>\n<h2>五、二不定法</h2>\n<p>这里又出现迦留陀夷。</p>\n<p>这个人几乎成为律藏里的反面教材。</p>\n<hr>\n<h3>第一不定法</h3>\n<p>比丘与女人：</p>\n<ul><li>独处</li><li>屏蔽环境</li><li>能发生淫行</li></ul>\n<p>又说淫欲话。</p>\n<p>被可信优婆夷看见。</p>\n<p>那么：</p>\n<p>到底犯什么罪？</p>\n<p>不预先固定。</p>\n<p>根据证据判断：</p>\n<p>可能是：</p>\n<ul><li>波罗夷</li><li>僧残</li><li>波逸提</li></ul>\n<p>故称：</p>\n<blockquote><p>不定法。</p></blockquote>\n<hr>\n<h3>第二不定法</h3>\n<p>与女人在公开地方坐。</p>\n<p>虽然不能行淫。</p>\n<p>但说淫秽话。</p>\n<p>可信优婆夷作证。</p>\n<p>则可能：</p>\n<ul><li>僧残</li><li>波逸提</li></ul>\n<p>仍然不预先确定。</p>\n<p>故名：</p>\n<p>不定。</p>\n<hr>\n<h2>本卷核心总结</h2>\n<p>这一卷实际上在解决四个极其严重的问题：</p>\n<h3>第一层：权力欲</h3>\n<p>提婆达多破僧。</p>\n<hr>\n<h3>第二层：帮派文化</h3>\n<p>伴党助破僧。</p>\n<hr>\n<h3>第三层：名利关系网</h3>\n<p>污家恶行。</p>\n<hr>\n<h3>第四层：我慢</h3>\n<p>恶性不受谏。</p>\n<hr>\n<p>把四条串起来看，你会发现一个惊人的规律：</p>\n<blockquote><p>一个修行人最危险的时候，  往往不是犯色欲的时候。</p></blockquote>\n<p>而是：</p>\n<ul><li>开始有追随者的时候；</li><li>开始有影响力的时候；</li><li>开始有资源的时候；</li><li>开始觉得自己永远正确的时候。</li></ul>\n<p>于是：</p>\n<p>从我慢生党争；</p>\n<p>从党争生破僧；</p>\n<p>从破僧毁正法。</p>\n<p>所以《四分律》这一卷真正要防范的，不是男女问题，而是更深层的人性问题：</p>\n<blockquote><p><strong>名闻利养与我执。</strong></p></blockquote>\n<p>这也是为什么佛陀反复强调：</p>\n<blockquote><p>「與僧和合，歡喜不諍，同一水乳，於佛法中安樂住。」</p></blockquote>\n<p>一个人能否长久修行，不在于他懂多少经论，而在于他是否还能保持这四个字：</p>\n<p><strong>可受人谏。</strong></p>\n<p>一旦失去受谏之心，提婆达多、阿湿婆、闡陀三人的路，就会在任何时代不断重演。</p>\n<p>​</p>"},{"id":"section-006","kind":"volume","number":6,"title":"第6卷｜一、这一卷到底在讲什么？","html":"<p>这是《四分律》卷六开始讲的\\<em>\\</em>三十舍堕法（尼萨耆波逸提，Nissaggiya Pācittiya）\\<em>\\</em>前五条。</p>\n<p>如果说前面的波罗夷、僧残是在防止修行人“毁灭佛法根基”，那么舍堕法开始处理的是：</p>\n<blockquote><p><strong>贪著资具、贪著供养、贪著人情关系的问题。</strong></p></blockquote>\n<p>表面上是在管衣服，实际上是在治心。</p>\n<p>这一卷非常有意思，因为佛陀面对的已经不是淫欲、偷盗这些粗重烦恼，而是：</p>\n<p><strong>「出家以后，对生活品质的执著。」</strong></p>\n<p>这比前面的戒更细。</p>\n<hr>\n<h2>一、这一卷到底在讲什么？</h2>\n<p>核心只有一句：</p>\n<blockquote><p><strong><span style=\"color: #E00;\">衣服是用来遮体修道的，不是用来满足贪爱和虚荣的。</span></strong></p></blockquote>\n<p>因此佛陀连续制定五条舍堕戒：</p>\n<h4>第一条：畜长衣戒</h4>\n<p>三衣之外的衣服，</p>\n<p>超过十天还留着。</p>\n<p>犯舍堕。</p>\n<hr>\n<h4>第二条：离衣宿戒</h4>\n<p>三衣必须随身。</p>\n<p>不能把衣服寄存在别人那里，</p>\n<p>自己空手跑出去游历。</p>\n<p>离衣异处过夜。</p>\n<p>犯舍堕。</p>\n<hr>\n<h4>第三条：非时衣戒</h4>\n<p>接受了非时供养的布料，</p>\n<p>允许保留一个月。</p>\n<p>必须赶快做成衣服。</p>\n<p>超过期限。</p>\n<p>犯舍堕。</p>\n<hr>\n<h4>第四条：受非亲里比丘尼衣戒</h4>\n<p>不能接受非亲属比丘尼赠送衣服。</p>\n<p>容易生染着。</p>\n<p>犯舍堕。</p>\n<hr>\n<h4>第五条：使非亲里比丘尼浣染打衣戒</h4>\n<p>不能让非亲属比丘尼：</p>\n<ul><li>洗衣</li><li>染衣</li><li>捶打整理</li></ul>\n<p>容易产生男女情感依附。</p>\n<p>犯舍堕。</p>\n<hr>\n<h2>二、佛陀真正要破的是什么？</h2>\n<p>很多人第一次看会觉得：</p>\n<blockquote><p>不就是几件衣服吗？</p></blockquote>\n<p>为什么这么严格？</p>\n<p>其实佛陀看的不是衣服。</p>\n<p>而是：</p>\n<blockquote><p><strong>贪心。</strong></p></blockquote>\n<hr>\n<p>六群比丘出现什么问题？</p>\n<p>他们开始收藏衣服。</p>\n<p>早晨穿一套。</p>\n<p>中午穿一套。</p>\n<p>下午穿一套。</p>\n<p>甚至专门保养收藏。</p>\n<p>天天研究搭配。</p>\n<p>天天研究质地。</p>\n<p>天天研究款式。</p>\n<hr>\n<p>你会发现：</p>\n<p>这和现代人完全一样。</p>\n<p>衣柜已经爆满。</p>\n<p>还在买。</p>\n<p>买完又收藏。</p>\n<p>收藏又舍不得穿。</p>\n<p>穿了又怕旧。</p>\n<p>旧了又继续买。</p>\n<hr>\n<p>佛陀看见这个苗头后立刻制戒。</p>\n<p>因为：</p>\n<blockquote><p>衣服越来越多，  欲望就越来越大。</p></blockquote>\n<hr>\n<h2>三、为什么允许十天？</h2>\n<p>这里有一个非常重要的细节。</p>\n<p>原来佛陀规定：</p>\n<p>只能持三衣。</p>\n<p>不能有多余衣服。</p>\n<hr>\n<p>后来阿难得到一件非常好的粪扫衣。</p>\n<p>想供养尊者迦叶。</p>\n<p>可是迦叶外出。</p>\n<p>十天后才回来。</p>\n<hr>\n<p>阿难请示佛陀。</p>\n<p>佛陀于是开缘：</p>\n<blockquote><p>长衣可以保留十天。</p></blockquote>\n<p>这是律藏非常重要的精神。</p>\n<hr>\n<p>很多人以为戒律是死板的。</p>\n<p>其实不是。</p>\n<p>佛陀制戒永远遵循：</p>\n<h4>原则严格</h4>\n<h4>具体灵活</h4>\n<p>不破原则。</p>\n<p>允许方便。</p>\n<hr>\n<p>这就是律藏精神。</p>\n<p>不是机械主义。</p>\n<p>不是形式主义。</p>\n<p>更不是苦行主义。</p>\n<hr>\n<h2>四、离衣宿戒为什么这么重要？</h2>\n<p>今天很多人看不懂。</p>\n<p>衣服放宿舍。</p>\n<p>我去隔壁住一晚。</p>\n<p>为什么犯戒？</p>\n<hr>\n<p>其实佛陀是在防什么？</p>\n<p>防财产积累。</p>\n<hr>\n<p>因为当时很多比丘开始这样操作：</p>\n<p>衣服放这里。</p>\n<p>衣服放那里。</p>\n<p>衣服寄朋友。</p>\n<p>衣服寄亲戚。</p>\n<p>衣服寄居士。</p>\n<p>到处都是库存。</p>\n<hr>\n<p>最后会怎样？</p>\n<p>形成私人仓库。</p>\n<p>形成私人财产。</p>\n<p>形成私人势力。</p>\n<hr>\n<p>于是佛陀说：</p>\n<p><span style=\"color: #E00;\">三衣必须跟着你。</span></p>\n<p><span style=\"color: #E00;\">不能建立私人储藏体系。</span></p>\n<hr>\n<p>你会发现：</p>\n<p>佛陀是在制度层面切断腐败。</p>\n<hr>\n<h2>五、莲华色比丘尼的故事</h2>\n<p>这一卷最有名的故事。</p>\n<p>就是莲华色比丘尼。</p>\n<p>莲华色比丘尼</p>\n<hr>\n<p>她的人生极其悲惨。</p>\n<p>年轻时发现：</p>\n<p>母亲和丈夫私通。</p>\n<p>离家出走。</p>\n<p>后来又阴差阳错。</p>\n<p>自己的女儿嫁给了自己的丈夫。</p>\n<p>形成：</p>\n<p>母女共一夫。</p>\n<hr>\n<p>她崩溃了。</p>\n<p>感叹：</p>\n<blockquote><p>何用女人身为！</p></blockquote>\n<p>于是出家。</p>\n<hr>\n<p>后来证阿罗汉。</p>\n<p>成为大神通比丘尼。</p>\n<hr>\n<p>有一天看见一位比丘穿着破烂僧伽梨。</p>\n<p>生起慈悲心。</p>\n<p>把自己的贵重衣服送给比丘。</p>\n<p>自己穿破衣服。</p>\n<hr>\n<p>佛陀知道后说：</p>\n<p>这不是正确做法。</p>\n<p>于是允许比丘尼保存五衣。</p>\n<p>保持庄严威仪。</p>\n<hr>\n<p>这里透露一个重要思想：</p>\n<blockquote><p>佛教不是故意邋遢。</p></blockquote>\n<p>很多人误会了。</p>\n<hr>\n<p>佛陀反对的是：</p>\n<p>贪著华服。</p>\n<p>不是反对整洁庄严。</p>\n<hr>\n<p>《四分律》经常强调：</p>\n<p>衣服应当：</p>\n<ul><li>清净</li><li>整齐</li><li>无破损</li></ul>\n<hr>\n<p>因为庄严威仪本身就是弘法。</p>\n<hr>\n<h2>六、迦留陀夷与偷兰难陀事件</h2>\n<p>这里简直是律藏里的警示案例。</p>\n<p>迦留陀夷</p>\n<p>与</p>\n<p>偷兰难陀比丘尼</p>\n<p>互生染心。</p>\n<hr>\n<p>后面发生一系列极不清净行为。</p>\n<p>最终导致佛陀制定：</p>\n<blockquote><p>不允许非亲属比丘尼为比丘洗染旧衣。</p></blockquote>\n<hr>\n<p>很多人读到这里会震惊：</p>\n<p>已经出家了。</p>\n<p>怎么还会这样？</p>\n<hr>\n<p>《四分律》恰恰在告诉我们：</p>\n<blockquote><p>头发剃了。  烦恼没剃。</p></blockquote>\n<hr>\n<p>戒律为什么存在？</p>\n<p>因为习气还在。</p>\n<p>欲望还在。</p>\n<p>业力还在。</p>\n<hr>\n<p>所以佛陀从来不相信：</p>\n<p>“我定力够，不会有事。”</p>\n<p>佛陀相信的是：</p>\n<blockquote><p>不给烦恼机会。</p></blockquote>\n<hr>\n<h2>七、这一卷对现代人的启示</h2>\n<p>如果把这些戒翻译成现代语言。</p>\n<p>其实就是五句话。</p>\n<hr>\n<h4>第一：不要让消费成为人生主题</h4>\n<p>今天很多人：</p>\n<p>挣钱。</p>\n<p>买东西。</p>\n<p>换东西。</p>\n<p>炫东西。</p>\n<hr>\n<p>最后一生都在经营衣柜。</p>\n<p>没有经营生命。</p>\n<hr>\n<h4>第二：东西越多，束缚越多</h4>\n<p>拥有越多。</p>\n<p>维护越多。</p>\n<p>担心越多。</p>\n<p>失去越痛苦。</p>\n<hr>\n<p>所以佛法说：</p>\n<blockquote><p><span style=\"color: #E00;\">少欲知足。</span></p></blockquote>\n<p>不是穷。</p>\n<p>而是自由。</p>\n<hr>\n<h4>第三：不要制造暧昧关系</h4>\n<p>很多烦恼不是突然发生。</p>\n<p>而是长期接触形成。</p>\n<hr>\n<p>佛陀的办法非常简单：</p>\n<p>直接切断诱因。</p>\n<hr>\n<h4>第四：慈悲要有智慧</h4>\n<p>莲华色送衣是慈悲。</p>\n<p>佛陀允许保存五衣是智慧。</p>\n<hr>\n<p>只有慈悲没有智慧。</p>\n<p>容易伤害自己。</p>\n<hr>\n<p>只有智慧没有慈悲。</p>\n<p>容易冷漠。</p>\n<hr>\n<p>菩萨道必须两者并行。</p>\n<hr>\n<h4>第五：修行真正的敌人不是贫穷</h4>\n<p>而是贪著</p>\n<p>《四分律》这一卷反复在讲：</p>\n<p>问题从来不是衣服。</p>\n<p>而是：</p>\n<blockquote><p>心被衣服绑架了。</p></blockquote>\n<p>问题不是财物。</p>\n<p>而是：</p>\n<blockquote><p>心被财物控制了。</p></blockquote>\n<p>问题不是人与人往来。</p>\n<p>而是：</p>\n<blockquote><p>心被情执牵走了。</p></blockquote>\n<hr>\n<h2>本卷核心金句</h2>\n<blockquote><p>三衣足以蔽体，贪心足以覆道。</p></blockquote>\n<blockquote><p>佛制长衣十日，不是限制衣服，而是限制欲望。</p></blockquote>\n<blockquote><p>修行人最大的贫穷，不是没有衣服，而是永远觉得不够。</p></blockquote>\n<blockquote><p>戒律不是束缚自由，而是保护解脱。</p></blockquote>\n<blockquote><p>东西越少，心越轻；执著越少，道越近。</p></blockquote>\n<p>这就是《四分律》卷六前三十舍堕法的核心精神：</p>\n<p><strong><span style=\"color: #E00;\">从管理衣服开始，最终管理的是贪心；从规范行为开始，最终解脱的是执著。</span></strong></p>\n<p><strong><span style=\"color: #E00;\">​</span></strong></p>\n<p><strong><span style=\"color: #E00;\">​</span></strong></p>"},{"id":"section-007","kind":"volume","number":7,"title":"第7卷｜《四分律》卷七（三十捨墮法第6～12條）深度拆解","html":"<p>這一卷內容非常有意思，幾乎全部圍繞一個主題：</p>\n<blockquote><p><strong>出家人的貪心，往往不是從大事開始，而是從「覺得理所當然」開始。</strong></p></blockquote>\n<p>佛陀在這一卷中連續制定七條「尼薩耆波逸提（捨墮罪）」。</p>\n<p>表面上是在講衣服、臥具、羊毛。</p>\n<p>實際上是在治療：</p>\n<p><strong>貪求心、攀緣心、享受心、控制心。</strong></p>\n<hr>\n<h2>第一部分：第六條捨墮</h2>\n<h3>不得向非親屬居士乞衣</h3>\n<p>緣起是跋難陀。</p>\n<p>這位仁兄堪稱《四分律》第一反面教材。</p>\n<p>長者聽他說法歡喜：</p>\n<blockquote><p>「大德需要什麼？」</p></blockquote>\n<p>正常比丘會說：</p>\n<blockquote><p>「知足即可。」</p></blockquote>\n<p>結果跋難陀說：</p>\n<blockquote><p>「你身上那件衣服給我吧。」</p></blockquote>\n<p>直接索取。</p>\n<p>而且還是人家正在穿的衣服。</p>\n<p>最後逼得長者當場脫衣。</p>\n<p>只穿一件衣服回城。</p>\n<p>整個舍衛城轟動。</p>\n<p>大家說：</p>\n<blockquote><p>「施主可以布施無厭，  受供養的人應該知足。」</p></blockquote>\n<p>佛陀因此制定：</p>\n<h4>戒條</h4>\n<p>非親屬居士，</p>\n<p>不得主動乞求衣服。</p>\n<p>除非：</p>\n<ul><li>被搶</li><li>遺失</li><li>燒毀</li><li>漂失</li></ul>\n<p>四種特殊情況。</p>\n<hr>\n<h3>佛陀真正防的是什麼？</h3>\n<p>不是防要衣服。</p>\n<p>而是防：</p>\n<h4>「把供養當權利」</h4>\n<p>今天很多學佛人容易犯同樣問題。</p>\n<p>例如：</p>\n<ul><li>你應該供養我</li><li>你應該支持我</li><li>你應該幫助我</li><li>你應該護持道場</li></ul>\n<p>當「應該」出現時。</p>\n<p>貪心已經冒頭。</p>\n<p>佛陀的原則是：</p>\n<blockquote><p><span style=\"color: #E00;\">供養是施主的福德。</span>  <span style=\"color: #E00;\">不是修行人的特權。</span></p></blockquote>\n<hr>\n<h2>第二部分：第七條捨墮</h2>\n<h3>失衣後接受供養必須知足</h3>\n<p>有比丘被盜賊搶光衣服。</p>\n<p>居士發心送衣。</p>\n<p>結果一些比丘自己三衣齊全。</p>\n<p>還替六群比丘收衣服。</p>\n<p>佛陀制戒：</p>\n<h4>可以接受供養</h4>\n<p>但只能補足所缺。</p>\n<p>不能趁機多拿。</p>\n<hr>\n<h3>佛陀在教什麼？</h3>\n<p>佛教不是反對財物。</p>\n<p>佛教反對：</p>\n<h4>借理由滿足貪欲</h4>\n<p>缺一件拿十件。</p>\n<p>缺一套拿十套。</p>\n<p>這叫：</p>\n<blockquote><p>假借因緣，增長欲望。</p></blockquote>\n<p>現代人尤其容易如此。</p>\n<p>例如：</p>\n<ul><li>為工作買設備</li></ul>\n<p>結果買成購物狂。</p>\n<ul><li>為學習買書</li></ul>\n<p>結果家裡三千本沒翻過。</p>\n<ul><li>為修行買法寶</li></ul>\n<p>結果收藏超過使用。</p>\n<p>這都屬於同一類心態。</p>\n<hr>\n<h2>第三部分：第八條捨墮</h2>\n<h3>不得指定施主買更好的衣服</h3>\n<p>居士夫妻商量：</p>\n<blockquote><p>「給跋難陀做件衣服。」</p></blockquote>\n<p>被跋難陀知道。</p>\n<p>立刻上門：</p>\n<blockquote><p>「既然做，  就做大一點、  好一點、  堅固一點。」</p></blockquote>\n<p>佛陀因此制戒。</p>\n<hr>\n<h3>為什麼？</h3>\n<p>因為供養變質了。</p>\n<p>本來是：</p>\n<blockquote><p>施主發心。</p></blockquote>\n<p>變成：</p>\n<blockquote><p>受供者指揮。</p></blockquote>\n<p>佛陀很清楚：</p>\n<p>當接受者開始主導供養。</p>\n<p>供養就開始不清淨。</p>\n<hr>\n<h2>第四部分：第九條捨墮</h2>\n<h3>不得串聯多人合資給自己做高級衣服</h3>\n<p>兩家居士都準備供養跋難陀。</p>\n<p>跋難陀說：</p>\n<blockquote><p>「你們乾脆把錢湊一起，  給我做件最好的。」</p></blockquote>\n<p>佛陀立刻禁止。</p>\n<hr>\n<h3>這條戒很有現代意義</h3>\n<p>很多人學佛後開始經營人脈。</p>\n<p>利用關係。</p>\n<p>利用名聲。</p>\n<p>利用影響力。</p>\n<p>最後變成：</p>\n<blockquote><p>用佛法積累資源。</p></blockquote>\n<p>而不是：</p>\n<blockquote><p>用資源弘揚佛法。</p></blockquote>\n<p>方向完全倒過來。</p>\n<hr>\n<h2>第五部分：第十條捨墮</h2>\n<h3>不得反覆催促供養</h3>\n<p>這條極有意思。</p>\n<p>佛陀甚至規定：</p>\n<h4>可以提醒三次</h4>\n<p>超過三次不行。</p>\n<h4>可以默站六次</h4>\n<p>超過六次不行。</p>\n<p>再要就是犯戒。</p>\n<hr>\n<h3>為什麼佛陀連次數都規定？</h3>\n<p>因為：</p>\n<blockquote><p>貪心最會偽裝。</p></blockquote>\n<p>嘴上說：</p>\n<blockquote><p>我不是要。</p></blockquote>\n<p>實際上天天提醒。</p>\n<p>天天暗示。</p>\n<p>天天施壓。</p>\n<p>佛陀直接把漏洞堵死。</p>\n<hr>\n<h4>今天尤其值得反省</h4>\n<p>很多事情不是強迫。</p>\n<p>而是：</p>\n<ul><li>情緒施壓</li><li>道德綁架</li><li>反覆提醒</li></ul>\n<p>本質仍是索取。</p>\n<p>佛陀早已看透人性。</p>\n<hr>\n<h2>第六部分：第十一條捨墮</h2>\n<h3>不得以活蠶絲製作新臥具</h3>\n<p>六群比丘跑到養蠶人家。</p>\n<p>守著蠶繭。</p>\n<p>等著做臥具。</p>\n<p>居士看見後說：</p>\n<blockquote><p>「這不是殺生嗎？」</p></blockquote>\n<p>佛陀制戒。</p>\n<hr>\n<h3>戒律背後的慈悲</h3>\n<p>這裡重點不是絲綢。</p>\n<p>而是：</p>\n<blockquote><p>不以眾生死亡換取自己的享受。</p></blockquote>\n<p>哪怕只是睡覺用的臥具。</p>\n<p>佛陀也要求：</p>\n<h4>慈悲優先</h4>\n<p>舒適其次。</p>\n<hr>\n<h2>第七部分：第十二條捨墮</h2>\n<h3>不得全部用純黑羊毛做臥具</h3>\n<p>當時毘舍離貴族喜歡夜間行淫。</p>\n<p>穿黑色羊毛毯。</p>\n<p>不容易被人發現。</p>\n<p>六群比丘竟然模仿。</p>\n<p>佛陀呵責：</p>\n<blockquote><p>你們學這些幹什麼？</p></blockquote>\n<p>於是制戒。</p>\n<hr>\n<h3>深層含義</h3>\n<p>佛陀反對的不是顏色。</p>\n<p>而是：</p>\n<h4>模仿世俗享樂文化</h4>\n<p>出家人的生活。</p>\n<p>應當與欲望文化保持距離。</p>\n<p>否則慢慢會：</p>\n<ul><li>貪舒服</li><li>貪好看</li><li>貪高級</li><li>貪品味</li></ul>\n<p>最後忘記出家的初心。</p>\n<hr>\n<h2>這七條戒共同指向什麼？</h2>\n<p>如果把卷七濃縮成一句話：</p>\n<blockquote><p><strong>少欲知足，是出家人的命根子。</strong></p></blockquote>\n<p>佛陀不是怕比丘有衣服。</p>\n<p>佛陀不是怕比丘睡得舒服。</p>\n<p>佛陀怕的是：</p>\n<blockquote><p>欲望穿上合理化的外衣。</p></blockquote>\n<p>所以本卷反覆出現一句話：</p>\n<blockquote><p>「少欲知足者，嫌責。」</p></blockquote>\n<p>因為真正的修行人一眼就能看出：</p>\n<p>問題從來不是衣服。</p>\n<p>問題是心。</p>\n<hr>\n<h2>本卷最重要的一句話</h2>\n<blockquote><p><strong>施者雖無厭，受者應知足。</strong></p></blockquote>\n<p>這句話不只是給出家人。</p>\n<p>也是給所有現代人。</p>\n<p>今天的痛苦很多不是因為沒有。</p>\n<p>而是因為：</p>\n<ul><li>已有還想更多；</li><li>夠用還想更好；</li><li>滿足還想升級。</li></ul>\n<p>於是永遠不得安樂。</p>\n<p>《四分律》卷七其實是在告訴我們：</p>\n<blockquote><p>人真正的富有，  不是擁有很多。  而是需要很少。</p></blockquote>\n<p>這正是佛法所說的：</p>\n<blockquote><p><strong><span style=\"color: #E00;\">知足第一富。</span></strong></p></blockquote>\n<p>​</p>\n<p>​</p>"},{"id":"section-008","kind":"volume","number":8,"title":"第8卷｜《四分律》卷八到底说了什么？","html":"<p>这是《四分律》卷八中<strong>尼萨耆波逸提（捨堕）第13至20条</strong>，内容看似琐碎，实际上是在解决一个核心问题：</p>\n<blockquote><p><strong>出家人如何避免被物质、财富、享受和交易重新绑架。</strong></p></blockquote>\n<p>如果说前面的波罗夷戒是在堵住大漏洞，那么这一部分捨堕戒，就是在堵住人性中那些细小却危险的缺口。</p>\n<p>按照你的拆经模板，来做一次整体拆解。</p>\n<h2>《四分律》卷八到底说了什么？</h2>\n<h3>开篇：佛为什么连羊毛、坐具、旧毯子都要管？</h3>\n<p>很多现代人读戒律会觉得：</p>\n<blockquote><p>不就是一条毯子吗？  不就是换个坐垫吗？  不就是拿一点钱吗？</p></blockquote>\n<p>但佛陀看到的不是毯子。</p>\n<p>而是：</p>\n<p><strong>贪心的增长轨迹。</strong></p>\n<p>因为人的欲望从来不是突然爆发的。</p>\n<p>而是：</p>\n<ul><li>今天嫌旧</li><li>明天嫌丑</li><li>后天嫌薄</li><li>再后来嫌别人比我好</li></ul>\n<p>最后就变成：</p>\n<ul><li>积蓄财物</li><li>追求享受</li><li>经营买卖</li><li>贪著财富</li></ul>\n<p>于是修道人重新变回世俗人。</p>\n<p>所以这一卷看似讲羊毛。</p>\n<p>其实讲的是：</p>\n<blockquote><p><strong>如何截断欲望升级链条。</strong></p></blockquote>\n<hr>\n<h2>第一部分：为什么新卧具必须掺杂黑毛、杂色毛？</h2>\n<p>第十三捨堕。</p>\n<p>佛规定：</p>\n<p>新卧具必须：</p>\n<ul><li>二分黑毛</li><li>三分白毛</li><li>四分杂色毛</li></ul>\n<p>不能全部纯白。</p>\n<p>为什么？</p>\n<p>因为纯白羊毛极其华贵。</p>\n<p>当时贵族和王臣喜欢使用。</p>\n<p>六群比丘故意制作纯白卧具。</p>\n<p>居士一看：</p>\n<blockquote><p>这哪里像修道人？  分明像王公贵族。</p></blockquote>\n<p>于是佛制戒。</p>\n<p>核心不是颜色。</p>\n<p>而是：</p>\n<blockquote><p><strong>不要把修行用品变成身份象征。</strong></p></blockquote>\n<hr>\n<p>现代版是什么？</p>\n<p>不是羊毛。</p>\n<p>而是：</p>\n<ul><li>名牌袈裟</li><li>顶级佛珠</li><li>收藏级法器</li><li>豪华禅房</li></ul>\n<p>甚至：</p>\n<ul><li>名师身份</li><li>修行人设</li></ul>\n<p>很多时候：</p>\n<p><span style=\"color: #E00;\">已经不是在修道。</span></p>\n<p><span style=\"color: #E00;\">而是在经营一种高级身份。</span></p>\n<p><span style=\"color: #E00;\">这就是戒律要防的东西。</span></p>\n<hr>\n<h2>第二部分：为什么卧具必须用满六年？</h2>\n<p>第十四捨堕。</p>\n<p>六群比丘出现新问题。</p>\n<p>他们天天嫌弃：</p>\n<ul><li>太重</li><li>太轻</li><li>太厚</li><li>太薄</li></ul>\n<p>于是不断换新的。</p>\n<p>结果：</p>\n<p>卧具堆积如山。</p>\n<p>佛陀于是规定：</p>\n<blockquote><p>新卧具至少使用六年。</p></blockquote>\n<p>不到六年不能换。</p>\n<hr>\n<p>这里极有意思。</p>\n<p>佛陀不是反对舒服。</p>\n<p>佛陀反对：</p>\n<p><strong>永远不满足。</strong></p>\n<p>因为欲望有一个特点：</p>\n<p>得到以后立即失效。</p>\n<p>今天：</p>\n<p>终于买到理想手机。</p>\n<p>三个月后：</p>\n<p>开始看下一代。</p>\n<p>今天：</p>\n<p>终于买到理想汽车。</p>\n<p>半年后：</p>\n<p>开始看更好的。</p>\n<p>这叫：</p>\n<blockquote><p>贪欲递增机制。</p></blockquote>\n<p>佛陀直接一刀砍断。</p>\n<hr>\n<h2>第三部分：为什么新坐具必须补上一块旧布？</h2>\n<p>第十五捨堕。</p>\n<p>佛发现旧坐具到处乱丢。</p>\n<p>于是规定：</p>\n<p>制作新坐具时，</p>\n<p>必须从旧坐具上剪下一块布。</p>\n<p>缝到新坐具上。</p>\n<p>故意让它不好看。</p>\n<p>称为：</p>\n<blockquote><p>坏色。</p></blockquote>\n<hr>\n<p>为什么？</p>\n<p>因为人会爱新厌旧。</p>\n<p>佛要反过来训练。</p>\n<p>让你时时记得：</p>\n<blockquote><p>新的里面有旧的。</p></blockquote>\n<p>这样就不容易生起：</p>\n<ul><li>炫耀心</li><li>珍爱心</li><li>执著心</li></ul>\n<hr>\n<p>今天最值得反思的是：</p>\n<p>我们是不是一直在追求：</p>\n<ul><li>最新手机</li><li>最新汽车</li><li>最新装修</li><li>最新潮流</li></ul>\n<p>而从来没有学习：</p>\n<blockquote><p>惜福。</p></blockquote>\n<p><span style=\"color: #E00;\">戒律真正培养的是：</span></p>\n<p><span style=\"color: #E00;\">惜福文化。</span></p>\n<hr>\n<h2>第四部分：羊毛为什么不能背着走超过三由旬？</h2>\n<p>第十六捨堕。</p>\n<p>比丘捡到羊毛。</p>\n<p>可以拿。</p>\n<p>但不能长距离运输。</p>\n<p>超过三由旬（约40公里左右）即犯。</p>\n<p>为什么？</p>\n<p>因为容易被人误认为：</p>\n<blockquote><p>商人。</p></blockquote>\n<p>佛教最重视什么？</p>\n<p>社会信任。</p>\n<p>居士看到：</p>\n<p>一个出家人扛着大量羊毛赶路。</p>\n<p>自然会想：</p>\n<p>是不是做买卖？</p>\n<p>于是佛禁止。</p>\n<hr>\n<p>这里的精神是：</p>\n<blockquote><p><span style=\"color: #E00;\">不做容易引起误解的行为。</span></p></blockquote>\n<p><span style=\"color: #E00;\">很多事情未必真的错。</span></p>\n<p><span style=\"color: #E00;\">但容易破坏僧团形象。</span></p>\n<p><span style=\"color: #E00;\">也不应做。</span></p>\n<hr>\n<h2>第五部分：为什么不能让非亲属比丘尼洗羊毛？</h2>\n<p>第十七捨堕。</p>\n<p>六群比丘把羊毛交给比丘尼：</p>\n<ul><li>洗</li><li>染</li><li>拍松</li></ul>\n<p>结果比丘尼双手染黑。</p>\n<p>十分劳累。</p>\n<p>佛因此制戒。</p>\n<hr>\n<p>这里有两个层面。</p>\n<p>第一层：</p>\n<p>不滥用别人劳动。</p>\n<p>第二层：</p>\n<p>避免男女众过多接触。</p>\n<hr>\n<p>佛教僧团管理非常现实。</p>\n<p>因为很多问题：</p>\n<p>不是犯戒以后才处理。</p>\n<p>而是在风险出现前就切断。</p>\n<p>这就是律宗精神。</p>\n<hr>\n<h2>第六部分：这一卷最重要的戒——不捉金银戒</h2>\n<p>第十八捨堕。</p>\n<p>跋难陀比丘直接拿钱。</p>\n<p>放到商店。</p>\n<p>被居士看到。</p>\n<p>社会舆论瞬间爆炸。</p>\n<hr>\n<p>于是佛说出极重的话：</p>\n<blockquote><p>若沙门持金银钱财，  即非沙门法。</p></blockquote>\n<p>然后举了著名譬喻：</p>\n<p>日月有四种污染：</p>\n<ul><li>阿修罗</li><li>烟</li><li>云</li><li>尘雾</li></ul>\n<p>沙门也有四种污染：</p>\n<ul><li>饮酒</li><li>淫欲</li><li>持金银</li><li>邪命</li></ul>\n<hr>\n<p>这是整卷最震撼的地方。</p>\n<p>佛把：</p>\n<p>持金银</p>\n<p>和</p>\n<p>饮酒、淫欲、邪命</p>\n<p>放在同一级别。</p>\n<hr>\n<p>为什么？</p>\n<p><span style=\"color: #E00;\">因为钱代表什么？</span></p>\n<p><span style=\"color: #E00;\">代表：</span></p>\n<p><span style=\"color: #E00;\">欲望的无限兑换权。</span></p>\n<p><span style=\"color: #E00;\">有钱以后：</span></p>\n<p><span style=\"color: #E00;\">衣食住行色名利。</span></p>\n<p><span style=\"color: #E00;\">全部都能买。</span></p>\n<p><span style=\"color: #E00;\">所以佛陀知道：</span></p>\n<p><span style=\"color: #E00;\">若不断钱根。</span></p>\n<p><span style=\"color: #E00;\">贪欲永远断不了。</span></p>\n<hr>\n<h2>第七部分：禁止买卖和经商</h2>\n<p>第十九、第二十捨堕。</p>\n<p>佛进一步规定：</p>\n<p>不得：</p>\n<ul><li>以钱换钱</li><li>买卖宝物</li><li>经营贸易</li><li>低买高卖</li></ul>\n<p>甚至：</p>\n<p>赚差价</p>\n<p>都属于犯戒范围。</p>\n<hr>\n<p>为什么这么严格？</p>\n<p>因为：</p>\n<p>商人的目标是利润。</p>\n<p>修行人的目标是解脱。</p>\n<p>二者方向完全相反。</p>\n<hr>\n<p>利润思维会不断强化：</p>\n<ul><li>计算</li><li>得失</li><li>占便宜</li><li>竞争</li></ul>\n<p>而修行要培养：</p>\n<ul><li>知足</li><li>布施</li><li>放下</li><li>无我</li></ul>\n<p>两套系统互相冲突。</p>\n<hr>\n<h2>本卷最重要的一句话</h2>\n<p>整卷读下来。</p>\n<p>核心其实浓缩成一句：</p>\n<blockquote><p><strong>少欲知足。</strong></p></blockquote>\n<p>你会发现：</p>\n<p>所有犯戒的人。</p>\n<p>最后都不是因为贫穷。</p>\n<p>而是因为：</p>\n<p>不满足。</p>\n<p>嫌卧具不好。</p>\n<p>嫌坐具不好。</p>\n<p>想换新的。</p>\n<p>想多积蓄。</p>\n<p>想赚钱。</p>\n<p>想占便宜。</p>\n<p>想拥有更多。</p>\n<p>于是一步步远离解脱。</p>\n<hr>\n<h2>给现代修行人的启示</h2>\n<p>很多人觉得：</p>\n<p>《四分律》离现代太远。</p>\n<p>其实恰恰相反。</p>\n<p>现代社会比佛陀时代更需要这些戒律。</p>\n<p>因为今天的诱惑已经不是羊毛。</p>\n<p>而是：</p>\n<ul><li>手机</li><li>汽车</li><li>房子</li><li>股票</li><li>比特币</li><li>流量</li><li>粉丝</li><li>人设</li></ul>\n<p>形式变了。</p>\n<p>贪心没变。</p>\n<hr>\n<p>所以这一卷真正要告诉我们的不是：</p>\n<p>羊毛怎么处理。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: #E00;\">当你不断嫌弃已经拥有的东西时，</span>  <span style=\"color: #E00;\">贪欲已经在增长。</span></p></blockquote>\n<blockquote><p><span style=\"color: #E00;\">当你不断想获得更多时，</span>  <span style=\"color: #E00;\">解脱已经在远离。</span></p></blockquote>\n<p>《四分律》卷八看似全是生活细节。</p>\n<p>实际上佛陀正在用最普通的衣食卧具告诉弟子：</p>\n<p><strong>一个人不是因为拥有太少而痛苦，而是因为欲望永远觉得不够。</strong></p>\n<p>这正是本卷八条捨堕戒共同指向的核心——</p>\n<p><strong><span style=\"color: #E00;\">知足者富，少欲者安；能舍者，方能得解脱。</span></strong></p>\n<p><strong><span style=\"color: #E00;\">​</span></strong></p>"},{"id":"section-009","kind":"volume","number":9,"title":"第9卷｜《四分律》卷九到底讲了什么？","html":"<p>这是《四分律》卷九中“三十舍堕法”的后半部分，主要包括第21至第25条舍堕戒。若把前面繁杂的判例、羯磨程序全部浓缩，其核心其实都在对治一个根本问题：</p>\n<p><strong>贪求资具。</strong></p>\n<p>佛陀发现，许多比丘不是败在淫欲、瞋恨这种粗重烦恼上，而是败在：</p>\n<ul><li>挑好钵</li><li>挑好衣</li><li>多占物品</li><li>不知满足</li><li>贪图精致享受</li><li>赠与之后又反悔</li></ul>\n<p>所以这一卷特别值得现代修行人反复读。</p>\n<hr>\n<h2>《四分律》卷九到底讲了什么？</h2>\n<h3>第一部分：不要囤积钵（第二十一舍堕）</h3>\n<p>故事起因很有意思。</p>\n<p>六群比丘喜欢收藏钵：</p>\n<ul><li>好钵留着</li><li>差钵放着</li><li>到处找更好的钵</li></ul>\n<p>结果房间里堆满钵。</p>\n<p>居士来看后讥嫌：</p>\n<blockquote><p>简直像卖瓦器的店铺一样。</p></blockquote>\n<p>于是佛制定：</p>\n<blockquote><p>比丘除正在使用的钵外，新得之钵只能保留十天。</p></blockquote>\n<p>超过十天：</p>\n<p><strong>舍堕罪。</strong></p>\n<hr>\n<h4>佛为什么制这一条？</h4>\n<p>因为钵不是收藏品。</p>\n<p>它只是：</p>\n<blockquote><p>维持生命的工具。</p></blockquote>\n<p>一旦开始比较：</p>\n<ul><li>这个更漂亮</li><li>这个更名贵</li><li>这个更稀有</li></ul>\n<p>心已经从：</p>\n<blockquote><p>用钵吃饭</p></blockquote>\n<p>变成：</p>\n<blockquote><p>用钵满足我执。</p></blockquote>\n<hr>\n<h4>对现代人的启示</h4>\n<p>很多人的钵已经变成：</p>\n<ul><li>手机</li><li>相机</li><li>手表</li><li>球鞋</li><li>茶具</li><li>文玩</li></ul>\n<p>明明一个够用。</p>\n<p>却总觉得：</p>\n<blockquote><p>下一款更好。</p></blockquote>\n<p>于是不断买。</p>\n<p>佛陀不是反对拥有。</p>\n<p>佛陀反对：</p>\n<blockquote><p>无止境升级欲望。</p></blockquote>\n<hr>\n<h2>第二部分：钵还能用，就不准换新的（第二十二舍堕）</h2>\n<p>跋难陀钵破了。</p>\n<p>于是到处向居士说：</p>\n<blockquote><p>我钵坏了。</p></blockquote>\n<p>结果很多居士都送他新钵。</p>\n<p>一只破钵换来一堆新钵。</p>\n<p>佛陀因此制戒：</p>\n<blockquote><p>钵不到五处补缀漏损，不得求新钵。</p></blockquote>\n<p>否则：</p>\n<p>舍堕罪。</p>\n<hr>\n<h3>佛为什么连换钵都管？</h3>\n<p>因为人心有一个特点：</p>\n<blockquote><p>不是东西坏了才换。  而是喜欢了新的就嫌弃旧的。</p></blockquote>\n<p>所以佛故意要求：</p>\n<blockquote><p>修到不能再修。</p></blockquote>\n<blockquote><p>补到不能再补。</p></blockquote>\n<p>再换。</p>\n<hr>\n<h4>今天尤其值得警惕</h4>\n<p>现代消费社会完全相反：</p>\n<p>东西刚旧一点就换。</p>\n<p>手机：</p>\n<ul><li>能用</li><li>很流畅</li></ul>\n<p>却因为发布会开了：</p>\n<p>马上换。</p>\n<p>其实换的不是手机。</p>\n<p>是欲望。</p>\n<hr>\n<h2>第三部分：不准到处募资做高级衣服（第二十三舍堕）</h2>\n<p>跋难陀想做僧衣。</p>\n<p>于是：</p>\n<ul><li>这里讨一点线</li><li>那里讨一点线</li></ul>\n<p>最后收集大量材料。</p>\n<p>甚至亲自监督织工。</p>\n<p>自己纺线。</p>\n<p>自己监工。</p>\n<p>最后织出高级衣服。</p>\n<p>佛因此制定：</p>\n<blockquote><p>比丘不得自行四处乞线，再让非亲属织工为自己做衣。</p></blockquote>\n<p>否则：</p>\n<p>舍堕罪。</p>\n<hr>\n<h3>这里最重要的是什么？</h3>\n<p>佛不是反对做衣。</p>\n<p>而是反对：</p>\n<blockquote><p>为了满足自己而经营奔走。</p></blockquote>\n<p>因为修行人的时间应该用来：</p>\n<ul><li>修戒</li><li>修定</li><li>修慧</li></ul>\n<p>而不是：</p>\n<ul><li>谈价格</li><li>挑材料</li><li>管生产</li><li>监督工艺</li></ul>\n<p>否则越来越像商人。</p>\n<p>越来越不像沙门。</p>\n<hr>\n<h4>现代版跋难陀</h4>\n<p>其实并不少见。</p>\n<p>有的人天天研究：</p>\n<ul><li>茶叶</li><li>音响</li><li>佛珠</li><li>沉香</li><li>紫砂</li><li>收藏品</li></ul>\n<p>每天研究配置。</p>\n<p>研究升级。</p>\n<p>研究版本。</p>\n<p>研究工艺。</p>\n<p><span style=\"color: #E00;\">看起来是爱好。</span></p>\n<p><span style=\"color: #E00;\">实际上：</span></p>\n<p><span style=\"color: #E00;\">很多时候已经变成执著。</span></p>\n<hr>\n<h2>第四部分：别人供养你，你不能再加码（第二十四舍堕）</h2>\n<p>居士本来已经安排织工：</p>\n<p>给跋难陀做衣服。</p>\n<p>结果跋难陀自己跑过去说：</p>\n<blockquote><p>给我织大一点。  做好一点。  结实一点。  我给你加工钱。</p></blockquote>\n<p>然后又去找居士老婆拿更多线。</p>\n<p>最后做成豪华版。</p>\n<p>居士回来一看：</p>\n<p>傻眼了。</p>\n<hr>\n<p>于是佛制定：</p>\n<p>如果施主没有主动征求意见。</p>\n<p>比丘不得自行追加要求。</p>\n<p>否则：</p>\n<p>舍堕罪。</p>\n<hr>\n<h3>佛为什么管这么细？</h3>\n<p>因为：</p>\n<p>受供养最容易长贪心。</p>\n<p>开始是：</p>\n<blockquote><p>有就好。</p></blockquote>\n<p>后来变成：</p>\n<blockquote><p>再好一点。</p></blockquote>\n<p>然后：</p>\n<blockquote><p>再高级一点。</p></blockquote>\n<p>最后：</p>\n<blockquote><p>顶配版。</p></blockquote>\n<p><span style=\"color: #E00;\">人的贪欲没有终点。</span></p>\n<hr>\n<h4>这条戒特别适合今天</h4>\n<p>很多人学佛后：</p>\n<p>表面不贪钱。</p>\n<p>却开始贪：</p>\n<ul><li>好寺院</li><li>好法器</li><li>好袈裟</li><li>好茶</li><li>好环境</li></ul>\n<p>欲望换了个名字。</p>\n<p>本质没变。</p>\n<hr>\n<h2>第五部分：送出去的东西不准抢回来（第二十五舍堕）</h2>\n<p>跋难陀答应：</p>\n<p>给一位比丘衣服。</p>\n<p>条件是陪他出去游行。</p>\n<p>后来那位比丘不愿去了。</p>\n<p>跋难陀生气：</p>\n<blockquote><p>把衣服还我！</p></blockquote>\n<p>对方不还。</p>\n<p>于是直接抢回来。</p>\n<p>佛因此制定：</p>\n<blockquote><p>已经布施给人的东西，不能因瞋恨再夺回来。</p></blockquote>\n<p>否则：</p>\n<p>舍堕罪。</p>\n<hr>\n<h3>这一条直指人性</h3>\n<p>很多布施都有条件。</p>\n<p>例如：</p>\n<ul><li>我对你好，你要听我的</li><li>我帮助你，你要感恩</li><li>我给你资源，你要支持我</li></ul>\n<p>一旦不满足：</p>\n<p>立刻翻脸。</p>\n<p>要求收回。</p>\n<hr>\n<p>佛告诉我们：</p>\n<p>真正布施是：</p>\n<blockquote><p>给了就给了。</p></blockquote>\n<p>不是投资。</p>\n<p>不是交易。</p>\n<p>更不是控制别人。</p>\n<hr>\n<h2>本卷五条戒的共同主题</h2>\n<p>表面看：</p>\n<ul><li>钵</li><li>衣</li><li>线</li><li>织工</li><li>布施</li></ul>\n<p>毫不相关。</p>\n<p>其实佛陀一直在处理同一个问题：</p>\n<h3>贪</h3>\n<p>第一条：</p>\n<p>贪收藏。</p>\n<p>第二条：</p>\n<p>贪新品。</p>\n<p>第三条：</p>\n<p>贪精工。</p>\n<p>第四条：</p>\n<p>贪高级。</p>\n<p>第五条：</p>\n<p>贪控制。</p>\n<hr>\n<h2>本卷最重要的一句话</h2>\n<p>如果用一句话总结卷九：</p>\n<blockquote><p><span style=\"color: #E00;\">资具本为助道，莫令资具反成障道。</span></p></blockquote>\n<p>钵本来是吃饭的。</p>\n<p>衣本来是遮体的。</p>\n<p>布施本来是结缘的。</p>\n<p>结果众生往往：</p>\n<ul><li>因钵起贪</li><li>因衣起慢</li><li>因布施起瞋</li></ul>\n<p>最后被资具绑架。</p>\n<hr>\n<h2>给现代修行人的落地指南</h2>\n<p>每天观察自己：</p>\n<h4>第一问</h4>\n<p>我是在使用物品？</p>\n<p>还是在收藏物品？</p>\n<hr>\n<h4>第二问</h4>\n<p>我是真的需要升级？</p>\n<p>还是欲望需要升级？</p>\n<hr>\n<h4>第三问</h4>\n<p>我是在修行？</p>\n<p>还是在经营享受？</p>\n<hr>\n<h4>第四问</h4>\n<p>我的布施有没有附带条件？</p>\n<hr>\n<h4>第五问</h4>\n<p>如果今天失去这些东西，</p>\n<p>我的心还能安住吗？</p>\n<p>若不能安住。</p>\n<p>说明执著已经产生。</p>\n<hr>\n<p>读完卷九会发现，佛陀的戒律并不是在限制生活，而是在保护修行人不被欲望牵着走。</p>\n<p>因为真正毁掉一个修行人的，往往不是惊天动地的大恶。</p>\n<p>而是：</p>\n<blockquote><p>多一个钵也没关系，  好一点衣服也没关系，  再舒服一点也没关系。</p></blockquote>\n<p>就在这一个个“没关系”里，</p>\n<p>道心慢慢变成了世俗心。</p>\n<p>​</p>"},{"id":"section-010","kind":"volume","number":10,"title":"第10卷｜《四分律》卷第十核心拆解","html":"<h4>——从“五种药七日戒”到“僧物不得私取”，佛陀如何防止修行人堕入贪欲？</h4>\n<p>这一卷内容很长，但主题其实非常集中：</p>\n<p><strong>佛陀一方面不断开许（慈悲），另一方面不断设限（戒律）。</strong></p>\n<p>开许，是为了让修行人能够活下来、修得下去。</p>\n<p>设限，是为了防止修行人在享受开许时重新落入贪欲。</p>\n<p>整卷看下来，几乎都围绕一个主题：</p>\n<blockquote><p><strong>修行不是苦行主义，也不是享乐主义，而是知足与节制。</strong></p></blockquote>\n<hr>\n<h2>一、本卷重点：五种药的开缘与限制</h2>\n<p>佛看到比丘们：</p>\n<ul><li>秋天风病发作</li><li>身体枯瘦</li><li>生恶疮</li></ul>\n<p>于是开许：</p>\n<p>五种药可以服用：</p>\n<ol><li>酥</li><li>油</li><li>生酥</li><li>蜜</li><li>石蜜（糖）</li></ol>\n<p>后来又开许：</p>\n<ul><li>熊脂</li><li>鱼脂</li><li>驴脂</li><li>猪脂</li><li>摩竭鱼脂</li></ul>\n<p>用于治病。</p>\n<p>这里可以看到佛教一个很重要原则：</p>\n<h3>佛法不是虐待身体</h3>\n<p>很多人误会：</p>\n<p>修行就是硬扛。</p>\n<p>病了不看。</p>\n<p>累了不休息。</p>\n<p>饿了不吃。</p>\n<p>实际上佛陀从来没有这样教。</p>\n<p>《四分律》里经常看到：</p>\n<ul><li>生病允许吃药</li><li>生病允许特别饮食</li><li>生病允许特殊照顾</li></ul>\n<p>因为：</p>\n<blockquote><p>身体不是敌人。  身体是修道工具。</p></blockquote>\n<p>工具坏了，道也修不成。</p>\n<hr>\n<h2>二、为什么又立“七日药戒”？</h2>\n<p>问题来了。</p>\n<p>药越来越多。</p>\n<p>结果比丘们开始：</p>\n<ul><li>大量储存</li><li>到处悬挂</li><li>房间堆满</li></ul>\n<p>甚至：</p>\n<ul><li>溢出流满</li><li>发臭腐坏</li></ul>\n<p>长者进来一看：</p>\n<p>“这哪里像出家人？”</p>\n<p>“简直像国王仓库。”</p>\n<p>于是佛陀制定：</p>\n<h3>第二十六条捨堕</h3>\n<blockquote><p>五种药最多储存七天。</p></blockquote>\n<p>超过：</p>\n<ul><li>必须舍出</li><li>犯尼萨耆波逸提</li></ul>\n<hr>\n<h3>为什么这么严格？</h3>\n<p>因为佛陀看到一个规律：</p>\n<h4>人的欲望没有上限</h4>\n<p>最开始：</p>\n<p>为了治病。</p>\n<p>后来：</p>\n<p>为了备用。</p>\n<p>再后来：</p>\n<p>为了安心。</p>\n<p>最后：</p>\n<p>为了占有。</p>\n<p>药没有变。</p>\n<p>心变了。</p>\n<p>所以佛陀防的从来不是药。</p>\n<p>而是：</p>\n<blockquote><p>储蓄背后的贪心。</p></blockquote>\n<hr>\n<h2>三、一个惊人的现代对应</h2>\n<p>今天很多学佛人：</p>\n<p>保健品堆满柜子。</p>\n<p>中药堆满抽屉。</p>\n<p>营养品买一箱又一箱。</p>\n<p>其实病没多少。</p>\n<p>焦虑很多。</p>\n<p>本质和当年比丘储药一样。</p>\n<p>都是：</p>\n<blockquote><p>想通过拥有东西获得安全感。</p></blockquote>\n<p>佛陀告诉我们：</p>\n<p><span style=\"color: #E00;\">安全感不是来自储存。</span></p>\n<p><span style=\"color: #E00;\">而是来自放下。</span></p>\n<hr>\n<h2>四、毘舍佉母的八大愿</h2>\n<p>这是整卷最精彩的部分之一。</p>\n<h4>毘舍佉母提出八项长期供养：</h4>\n<ol><li>客比丘食</li><li>远行比丘食</li><li>病比丘食</li><li>病比丘药</li><li>看病人食</li><li>粥</li><li>比丘雨浴衣</li><li>比丘尼浴衣</li></ol>\n<p>很多人以为：</p>\n<p>她是在求福报。</p>\n<p>其实她后面解释得非常深。</p>\n<p>她说：</p>\n<p>以后若听佛说：</p>\n<p>某位比丘证果了。</p>\n<p>我会想：</p>\n<p>这位比丘是不是曾受过我的供养？</p>\n<p>想到这里：</p>\n<p>我就会欢喜。</p>\n<p>欢喜之后：</p>\n<p>恶法减少。</p>\n<p>善法增长。</p>\n<p>心得定。</p>\n<p>继续修行。</p>\n<hr>\n<h3>这是大乘布施的核心</h3>\n<p>不是：</p>\n<p>我给你钱。</p>\n<p>你给我福报。</p>\n<p>而是：</p>\n<blockquote><p>我借布施增长善心。</p></blockquote>\n<p>真正受益的人：</p>\n<p>其实是布施者自己。</p>\n<hr>\n<h2>五、佛陀为什么赞叹毘舍佉母？</h2>\n<p>因为她已经理解：</p>\n<h3>布施真正的价值</h3>\n<p>不在钱。</p>\n<p>在心。</p>\n<p>很多人捐款：</p>\n<p>想发财。</p>\n<p>想升官。</p>\n<p>想中彩票。</p>\n<p>毘舍佉母不是。</p>\n<p>她要的是：</p>\n<blockquote><p>欢喜心。</p></blockquote>\n<p>因为：</p>\n<p>欢喜生定。</p>\n<p>定生慧。</p>\n<p>慧断烦恼。</p>\n<p>这是圣道的路径。</p>\n<hr>\n<h2>六、第二十七条：雨浴衣戒</h2>\n<p>事情起因很有趣。</p>\n<p>有一天暴雨。</p>\n<p>佛让比丘出去洗澡。</p>\n<p>大家脱光在雨里洗。</p>\n<p>结果毘舍佉母派来的婢女一看：</p>\n<p>“这里全是裸体外道。”</p>\n<p>误会大了。</p>\n<p>于是毘舍佉母请求：</p>\n<p>给比丘们浴衣。</p>\n<p>佛同意。</p>\n<hr>\n<p>后来六群比丘开始钻空子：</p>\n<p>一年四季都要浴衣。</p>\n<p>拿了新的不用。</p>\n<p>旧的也不舍。</p>\n<p>甚至有衣还裸体洗澡。</p>\n<p>于是佛立戒：</p>\n<h4>雨浴衣只能在规定时间准备</h4>\n<p>不能提前太久索取。</p>\n<p>核心仍然是：</p>\n<blockquote><p>不许借因缘满足贪欲。</p></blockquote>\n<hr>\n<h2>七、第二十八条：急施衣戒</h2>\n<p>这条戒特别现实。</p>\n<p>两个将军即将出征。</p>\n<p>不知道还能不能活着回来。</p>\n<p>于是提前把安居衣供养给僧团。</p>\n<p>佛说：</p>\n<p>可以接受。</p>\n<p>因为：</p>\n<p>这是特殊情况。</p>\n<p>叫：</p>\n<h4>急施衣</h4>\n<p>但同时规定：</p>\n<p>只能在规定期间保存。</p>\n<p>超过期限犯戒。</p>\n<hr>\n<p>这里体现佛法一个特点：</p>\n<h3>有弹性，但不放纵</h3>\n<p>佛法不是死板规则。</p>\n<p>遇到特殊情况：</p>\n<p>可以开缘。</p>\n<p>但开缘不是取消原则。</p>\n<hr>\n<h2>八、第二十九条：离衣宿戒</h2>\n<p>阿兰若比丘住山林。</p>\n<p>盗贼很多。</p>\n<p>佛允许：</p>\n<p>暂时把一件衣放在村里。</p>\n<p>但：</p>\n<p>最多六夜。</p>\n<p>超过第七夜：</p>\n<p>犯捨堕。</p>\n<hr>\n<p>为什么？</p>\n<p>因为六群比丘开始：</p>\n<p>把衣服长期寄存在朋友那里。</p>\n<p>自己到处旅行。</p>\n<p>佛陀发现：</p>\n<p>开缘又被利用了。</p>\n<p>于是再立限制。</p>\n<hr>\n<p>这里非常值得现代人反思。</p>\n<p>很多时候：</p>\n<p>我们不是需要。</p>\n<p>而是在找理由。</p>\n<hr>\n<h2>九、第三十条：断僧物入己戒</h2>\n<p>这是整卷最重的一条。</p>\n<p>也是现实意义最大的一条。</p>\n<p>事情很简单：</p>\n<p>一个居士原本要供养僧团衣服。</p>\n<p>跋难陀跑去说：</p>\n<blockquote><p>饭给僧团吃。  衣服给我一个人。</p></blockquote>\n<p>结果：</p>\n<p>僧团利益被截流。</p>\n<p>归到个人。</p>\n<p>佛陀震怒。</p>\n<p>直接立戒：</p>\n<h3>若知是僧物而转归自己</h3>\n<p>犯捨堕。</p>\n<hr>\n<h2>为什么佛陀如此重视？</h2>\n<p>因为：</p>\n<p>这是僧团腐败的起点。</p>\n<p>个人贪欲不可怕。</p>\n<p>最可怕的是：</p>\n<h4>用集体资源满足个人利益</h4>\n<p>这会直接毁掉僧团公信力。</p>\n<hr>\n<h2>对现代众生的警示</h2>\n<p>这一条不仅适用于出家人。</p>\n<p>更适用于：</p>\n<ul><li>公司</li><li>团队</li><li>道场</li><li>慈善组织</li><li>家庭</li></ul>\n<p>凡是：</p>\n<p>属于大家的资源。</p>\n<p>却想办法变成自己的。</p>\n<p>本质都属于：</p>\n<blockquote><p>断众利而自入己。</p></blockquote>\n<hr>\n<h2>本卷最重要的一句话</h2>\n<p>如果让我从整卷提炼一句核心思想：</p>\n<blockquote><p>佛陀允许你使用资源，但不允许你执著资源。</p></blockquote>\n<p>药可以用。</p>\n<p>衣可以穿。</p>\n<p>食物可以吃。</p>\n<p>供养可以接受。</p>\n<p>但：</p>\n<p>不能积聚。</p>\n<p>不能占有。</p>\n<p>不能据为己有。</p>\n<p>不能借佛法满足贪欲。</p>\n<hr>\n<h2>给现代修行人的落地指南</h2>\n<h4>第一层：身体</h4>\n<p>病了治疗。</p>\n<p>不要硬撑。</p>\n<p>身体是修道工具。</p>\n<hr>\n<h4>第二层：物质</h4>\n<p>够用即可。</p>\n<p>不要不断囤积。</p>\n<hr>\n<h4>第三层：财富</h4>\n<p>属于自己的合理使用。</p>\n<p>属于大众的不私占。</p>\n<hr>\n<h4>第四层：布施</h4>\n<p>不要计算回报。</p>\n<p>培养欢喜心。</p>\n<hr>\n<h4>第五层：修行</h4>\n<p>永远观察一个问题：</p>\n<blockquote><p>我是在使用这个东西，  还是已经被这个东西占有？</p></blockquote>\n<p>当你拥有很多东西时未必危险。</p>\n<p>当你离不开它时，</p>\n<p>危险已经开始。</p>\n<hr>\n<h3>总结</h3>\n<p>《四分律》卷第十看似全在讲：</p>\n<ul><li>药</li><li>衣</li><li>食物</li><li>供养</li></ul>\n<p>实际上讲的是一个更深的问题：</p>\n<blockquote><p>人为什么会堕落？</p></blockquote>\n<p>答案不是因为贫穷。</p>\n<p>也不是因为缺少资源。</p>\n<p>而是因为：</p>\n<blockquote><p>贪心总会借着合理的理由不断扩张。</p></blockquote>\n<p>所以佛陀一边慈悲开缘，</p>\n<p>一边不断设立界限。</p>\n<p><span style=\"color: #E00;\">因为真正毁掉修行人的，</span></p>\n<p><span style=\"color: #E00;\">从来不是物质本身。</span></p>\n<p><span style=\"color: #E00;\">而是那颗永远觉得“还不够”的心。</span></p>"}];
const home=document.querySelector('#home'),readerWrap=document.querySelector('#readerWrap'),sideToc=document.querySelector('#sideToc'),search=document.querySelector('#search');let current=-1,baseFont=17,touchX=0,touchY=0;
const label=c=>c.kind==='volume'?`第${c.number}卷`:c.kind==='summary'?'总结':`第${c.number}章`;
function save(){try{localStorage.setItem('ebook-f6e171467a-progress',JSON.stringify({id:current,scroll:window.scrollY}))}catch(e){}}
function setProgress(){let max=document.documentElement.scrollHeight-innerHeight;document.querySelector('#progressBar').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}
function go(i,saveScroll=false){if(i<0){current=-1;readerWrap.classList.add('hidden');home.classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0);save();return}i=Math.max(0,Math.min(CHAPTERS.length-1,i));current=i;const c=CHAPTERS[i];home.classList.add('hidden');readerWrap.classList.remove('hidden');document.querySelector('#chapterKicker').textContent=c.kind==='volume'?`${document.title.replace(' · 电子书','')} · ${label(c)}`:c.kind==='summary'?`${document.title.replace(' · 电子书','')} · 全书回顾`:`${document.title.replace(' · 电子书','')} · ${label(c)}`;document.querySelector('#chapterTitle').textContent=c.title;document.querySelector('#prose').innerHTML=c.html;document.querySelector('#prevBtn').disabled=i===0;document.querySelector('#nextBtn').disabled=i===CHAPTERS.length-1;document.querySelectorAll('[data-chapter]').forEach(x=>x.classList.toggle('active',Number(x.dataset.chapter)===i));history.replaceState(null,'',`#${c.id}`);document.querySelector('#sidebar').classList.remove('open');window.scrollTo(0,0);if(saveScroll){const y=saveScroll;window.scrollTo(0,y)}save();setProgress()}
function item(c,i,cls=''){return `<button class="${cls}" data-chapter="${i}"><b>${c.kind==='summary'?'末':String(c.number).padStart(2,'0')}</b><span>${c.title}</span></button>`}
function build(){sideToc.innerHTML=CHAPTERS.map((c,i)=>item(c,i)).join('');home.innerHTML=`<div class="hero"><div class="seal">阅</div><h1>四分律</h1><div class="sub">10 篇 · 网页电子书</div><div class="hero-rule"></div><p>从目录选择篇目开始阅读。阅读进度会保存在当前设备的浏览器中，方便下次接续。</p><div class="home-actions"><button class="primary" id="continueBtn">继续上次阅读</button><button class="action" id="startBtn">从第一卷开始</button></div></div><section class="contents"><h2>卷目目录</h2><div class="toc-grid">${CHAPTERS.map((c,i)=>item(c,i,'toc-card')).join('')}</div></section>`;document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.chapter))));document.querySelector('#startBtn').onclick=()=>go(0);document.querySelector('#continueBtn').onclick=resume}
function resume(){try{const p=JSON.parse(localStorage.getItem('ebook-f6e171467a-progress'));if(p&&p.id>=0){go(p.id);setTimeout(()=>window.scrollTo(0,p.scroll||0),80);return}}catch(e){}go(0)}
document.querySelector('#prevBtn').onclick=()=>go(current-1);document.querySelector('#nextBtn').onclick=()=>go(current+1);document.querySelector('#homeBtn').onclick=()=>go(-1);
document.querySelector('#fullBtn').onclick=async()=>{document.body.classList.add('reading');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('已切换阅读布局')}document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('reading');document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.querySelector('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('ebook-f6e171467a-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('ebook-f6e171467a-dark')==='1'||(localStorage.getItem('ebook-f6e171467a-dark')===null&&document.body.dataset.template==='5'))document.body.classList.add('dark');
document.querySelector('#fontUp').onclick=()=>{baseFont=Math.min(24,baseFont+1);document.querySelector('#prose').style.fontSize=baseFont+'px'};document.querySelector('#fontDown').onclick=()=>{baseFont=Math.max(14,baseFont-1);document.querySelector('#prose').style.fontSize=baseFont+'px'};
document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');search.addEventListener('input',()=>{let q=search.value.trim().toLowerCase();sideToc.querySelectorAll('button').forEach((b,i)=>b.style.display=(CHAPTERS[i].title.toLowerCase().includes(q)||label(CHAPTERS[i]).includes(q))?'':'none')});
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('reading');document.querySelector('#sidebar').classList.remove('open');if(document.fullscreenElement)document.exitFullscreen();return}if(current<0||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
const reader=document.querySelector('#readerWrap');reader.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});reader.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)go(current+(dx<0?1:-1))},{passive:true});
window.addEventListener('scroll',()=>{setProgress();if(current>=0){clearTimeout(window._saveTimer);window._saveTimer=setTimeout(save,180)}},{passive:true});window.addEventListener('resize',setProgress);
build();let hash=location.hash.slice(1),fromHash=CHAPTERS.findIndex(c=>c.id===hash);if(fromHash>=0)go(fromHash);else{try{const p=JSON.parse(localStorage.getItem('ebook-f6e171467a-progress'));if(p&&p.id>=0){document.querySelector('#continueBtn').textContent=`继续阅读：${label(CHAPTERS[p.id])}`}}catch(e){}}
</script></body></html>
