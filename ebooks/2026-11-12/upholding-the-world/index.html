const CHAPTERS=[{"id":"section-001","kind":"volume","number":1,"title":"第1卷｜《持世经》卷第一拆解","html":"<h3>看见一切法的操作系统：菩萨如何建立不退转的觉醒引擎</h3>\n<p><strong>副标题：本卷核心命题——不是学更多佛法，而是建立一套能持续通向觉悟的内在运行系统。</strong></p>\n<hr>\n<h2>开篇三段逻辑对位</h2>\n<p>《持世经》一开篇，并没有直接谈空性，也没有直接谈成佛，而是从一个更基础却更关键的问题切入：<span style=\"color: #E00;\">一个人如何在漫长修行中不迷失方向、不失去初心、不断增长智慧。</span></p>\n<p>问题在于，大多数人即使知道道理，也很难真正转化生命。知道无常，仍然执着；知道因果，仍然放逸；知道空性，仍然被情绪和欲望牵引。知识很多，力量很少。</p>\n<p>因此本卷提出的解法不是增加理论，而是建立一套完整的“念力—智慧—精进”运作系统。让觉悟不再依赖偶然状态，而成为可持续运行的生命结构。</p>\n<hr>\n<h2>一、整卷大义</h2>\n<h3>1. 建立“觉悟引擎”：念力是整个系统的核心驱动器</h3>\n<p>本卷反复谈：</p>\n<ul><li>念力</li><li>不断念</li><li>念根</li><li>四念处</li></ul>\n<p>其本质不是记忆力。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: #E00;\">“让生命始终不偏离真相的能力。”</span></p></blockquote>\n<h4>心理层</h4>\n<ul><li><span style=\"color: #E00;\">不被情绪带走</span></li></ul>\n<h4><span style=\"color: #E00;\">结构层</span></h4>\n<ul><li><span style=\"color: #E00;\">保持觉察在线</span></li></ul>\n<h4><span style=\"color: #E00;\">能量层</span></h4>\n<ul><li><span style=\"color: #E00;\">不断向菩提心聚焦</span></li></ul>\n<p>失去念力的人：</p>\n<p>今天想修行，</p>\n<p>明天想赚钱，</p>\n<p>后天想享乐。</p>\n<p>生命没有中心。</p>\n<p>念力成熟的人：</p>\n<p>一切经历都会回归觉悟方向。</p>\n<hr>\n<h3>2. 建立“法性认知系统”：从现象思维升级到实相思维</h3>\n<p>佛反复讲：</p>\n<ul><li><span style=\"color: #E00;\">因缘</span></li><li><span style=\"color: #E00;\">生灭</span></li><li><span style=\"color: #E00;\">无相</span></li><li><span style=\"color: #E00;\">无生</span></li></ul>\n<p>其核心不是哲学。</p>\n<p>而是在训练一种认知模式：</p>\n<blockquote><p>不看表面，看生成机制。</p></blockquote>\n<p>凡夫看：</p>\n<ul><li>他伤害我</li></ul>\n<p>菩萨看：</p>\n<ul><li>因缘条件成熟而显现</li></ul>\n<p>凡夫看：</p>\n<ul><li>我失败了</li></ul>\n<p>菩萨看：</p>\n<ul><li>因果链条正在展现</li></ul>\n<p>因此：</p>\n<p>真正的智慧不是知道答案。</p>\n<p>而是能看见答案背后的生成结构。</p>\n<hr>\n<h3>3. 建立“成佛操作系统”：欲、精进、不放逸是三大底层引擎</h3>\n<p>本卷最反复强调的一组词：</p>\n<ul><li>欲</li><li>精进</li><li>不放逸</li></ul>\n<p>佛甚至直接说：</p>\n<blockquote><p><span style=\"color: #E00;\">“欲精进不放逸，皆是一切法根本。”</span></p></blockquote>\n<p>这是全卷最重要的结论之一。</p>\n<p>很多人以为：</p>\n<p>修行是放下欲望。</p>\n<p>本卷指出：</p>\n<p>错。</p>\n<p>应放下的是贪欲。</p>\n<p>而不是愿力。</p>\n<p><span style=\"color: #E00;\">成佛本身需要极强烈的善欲。</span></p>\n<h4><span style=\"color: #E00;\">心理层</span></h4>\n<ul><li><span style=\"color: #E00;\">愿意成长</span></li></ul>\n<h4><span style=\"color: #E00;\">结构层</span></h4>\n<ul><li><span style=\"color: #E00;\">持续行动</span></li></ul>\n<h4><span style=\"color: #E00;\">能量层</span></h4>\n<ul><li><span style=\"color: #E00;\">长期不退</span></li></ul>\n<p><span style=\"color: #E00;\">这三者缺一不可。</span></p>\n<hr>\n<h2>二、重点金句</h2>\n<h4>【原句】</h4>\n<p><span style=\"color: #E00;\">欲精进不放逸，皆是一切法根本。</span></p>\n<h4><span style=\"color: #E00;\">【白话解释】</span></h4>\n<p><span style=\"color: #E00;\">没有追求进步的愿望，没有持续行动的力量，没有稳定专注的能力，一切修行都无法成就。</span></p>\n<h4><span style=\"color: #E00;\">【深层含义】</span></h4>\n<p><span style=\"color: #E00;\">决定人生高度的，不是天赋。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<blockquote><p><span style=\"color: #E00;\">愿力 × 行动力 × 稳定性</span></p></blockquote>\n<p><span style=\"color: #E00;\">这是所有成长系统的共同底层公式。</span></p>\n<hr>\n<h4>【原句】</h4>\n<p>法尚应舍，何况非法。</p>\n<h4>【白话解释】</h4>\n<p>连佛法都不能执着，更不要执着错误观念。</p>\n<h4>【深层含义】</h4>\n<p>最大的障碍往往不是无知。</p>\n<p>而是：</p>\n<blockquote><p>把工具当成真理。</p></blockquote>\n<p>一旦执着任何观念，</p>\n<p>智慧立刻停止流动。</p>\n<hr>\n<h4>【原句】</h4>\n<p><span style=\"color: #E00;\">若于一切法中无所见者，是名见佛。</span></p>\n<h4><span style=\"color: #E00;\">【白话解释】</span></h4>\n<p><span style=\"color: #E00;\">当不再被概念束缚时，才真正接近如来智慧。</span></p>\n<h4><span style=\"color: #E00;\">【深层含义】</span></h4>\n<p><span style=\"color: #E00;\">真正的觉醒，</span></p>\n<p><span style=\"color: #E00;\">不是建立新的信念。</span></p>\n<p><span style=\"color: #E00;\">而是超越所有信念。</span></p>\n<hr>\n<h4>【原句】</h4>\n<p><span style=\"color: #E00;\">一切法行处即是无行处。</span></p>\n<h4><span style=\"color: #E00;\">【白话解释】</span></h4>\n<p><span style=\"color: #E00;\">真正的道，不是一条固定道路。</span></p>\n<h4><span style=\"color: #E00;\">【深层含义】</span></h4>\n<p><span style=\"color: #E00;\">最高智慧不是遵循某个模式。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<blockquote><p><span style=\"color: #E00;\">在任何情境中都能如实回应。</span></p></blockquote>\n<hr>\n<h4>【原句】</h4>\n<p>以见法故则为见佛。</p>\n<h4>【白话解释】</h4>\n<p>不是看到佛像叫见佛。</p>\n<p>看见真理才叫见佛。</p>\n<h4>【深层含义】</h4>\n<p>佛不是一个人物。</p>\n<p>而是一种真相。</p>\n<hr>\n<h2>三、落地指南</h2>\n<h3>（1）修什么</h3>\n<p>本卷真正修的不是：</p>\n<ul><li>打坐技巧</li><li>经文知识</li><li>宗教形式</li></ul>\n<p>而是：</p>\n<blockquote><p>“持续回到真相的能力”</p></blockquote>\n<p>也就是：</p>\n<p><strong>念力系统。</strong></p>\n<hr>\n<h3>（2）5条具体修行指引</h3>\n<h4>① <span style=\"color: #E00;\">每天训练一次“回神能力”</span></h4>\n<p><span style=\"color: #E00;\">发现：</span></p>\n<ul><li><span style=\"color: #E00;\">分心</span></li><li><span style=\"color: #E00;\">妄想</span></li><li><span style=\"color: #E00;\">情绪</span></li></ul>\n<p><span style=\"color: #E00;\">不要批判。</span></p>\n<p><span style=\"color: #E00;\">只做一件事：</span></p>\n<p><span style=\"color: #E00;\">拉回来。</span></p>\n<p><span style=\"color: #E00;\">念力就是这样建立的。</span></p>\n<hr>\n<h4>② 遇到问题先问因缘</h4>\n<p>不要立刻问：</p>\n<ul><li>谁对谁错</li></ul>\n<p>改问：</p>\n<ul><li>这件事如何形成？</li></ul>\n<p>训练因缘视角。</p>\n<hr>\n<h4>③ 每天做一件不想做但该做的事</h4>\n<p>例如：</p>\n<ul><li>运动</li><li>读书</li><li>禅修</li></ul>\n<p>目的不是完成事情。</p>\n<p>而是锻炼精进力。</p>\n<hr>\n<h4>④ 情绪来时观受阴</h4>\n<p>问自己：</p>\n<ul><li>这是乐受？</li><li>苦受？</li><li>不苦不乐受？</li></ul>\n<p>不要跟情绪跑。</p>\n<p>只观察。</p>\n<hr>\n<h4>⑤ 每天检查一次执着</h4>\n<p>今天最放不下的是什么？</p>\n<ul><li>面子？</li><li>金钱？</li><li>关系？</li><li>评价？</li></ul>\n<p>找到执着点。</p>\n<p>就是找到修行入口。</p>\n<hr>\n<h3>（3）自检问题</h3>\n<h4>1</h4>\n<p>我现在的努力，</p>\n<p>是来自愿力，</p>\n<p>还是来自焦虑？</p>\n<hr>\n<h4>2</h4>\n<p>我是在追求真相，</p>\n<p>还是在维护自己的观点？</p>\n<hr>\n<h4>3</h4>\n<p>当情绪升起时，</p>\n<p>我是被情绪控制，</p>\n<p>还是能看见情绪？</p>\n<hr>\n<h4>4</h4>\n<p>我每天最消耗生命能量的是什么执着？</p>\n<hr>\n<h4>5</h4>\n<p>如果失去现在最在意的东西，</p>\n<p>我还能保持内心稳定吗？</p>\n<hr>\n<h2>结语（系统定位）</h2>\n<p>《持世经》卷第一，是整部经的总纲。</p>\n<p>它回答的不是：</p>\n<blockquote><p>“什么是佛法？”</p></blockquote>\n<p>而是：</p>\n<blockquote><p>“一个人如何建立通往佛智慧的运行系统？”</p></blockquote>\n<p>前半卷建立：</p>\n<ul><li>念力系统</li><li>智慧系统</li><li>精进系统</li></ul>\n<p>后半卷则直接进入五阴观：</p>\n<ul><li>色</li><li>受</li><li>想</li><li>行</li></ul>\n<p>开始拆解众生最深层的认知幻觉。</p>\n<p>因此本卷在整部《持世经》中的位置，相当于：</p>\n<blockquote><p><strong>觉醒操作系统的启动程序。</strong></p></blockquote>\n<p>它要解决的根本问题只有一个：</p>\n<blockquote><p><strong>众生为什么明明追求解脱，却总被自己的认知、感受、想法与习惯反复束缚。</strong></p></blockquote>\n<p>而佛给出的答案是：</p>\n<p><strong><span style=\"color: #E00;\">建立念力，洞察实相，精进不退。</span></strong></p>\n<p>当这三个系统开始稳定运行，菩提之路便不再是理想，而会成为生命自然展开的方向。</p>\n<p>​</p>"},{"id":"section-002","kind":"volume","number":2,"title":"第2卷｜看见“识”的真相，才是真正修行的开始","html":"<h2>标题</h2>\n<h3>看见“识”的真相，才是真正修行的开始</h3>\n<h4>——《持世经》卷二：破除心识幻觉，走出五阴牢笼的方法论</h4>\n<hr>\n<h2>开篇三段逻辑对位</h2>\n<p>前一阶段，经文已经开始拆解五阴的结构，让修行者明白：众生所执著的“我”，并非真实存在，而是由色、受、想、行、识五种条件暂时组合而成。</p>\n<p>但即使理解了色身无常，许多人依然无法解脱。因为最深的执著并不在身体，而在“心”。身体容易看见，心却极难察觉。众生真正被束缚的地方，不是色身，而是心识活动本身。</p>\n<p>因此，本卷开始直指最核心的问题：我们为何会不断轮回、生起烦恼、制造业力？根本原因不在外境，而在于误把虚妄识流当成真实的自己。本卷的方向，就是彻底拆解“识”的运作机制，进而破除五阴执著，进入无生法门。</p>\n<hr>\n<h2>一、整卷大义</h2>\n<h3>1. <span style=\"color: #E00;\">识并非主体，而是一套因缘运作系统</span></h3>\n<p><span style=\"color: #E00;\">凡夫认为：</span></p>\n<blockquote><p><span style=\"color: #E00;\">我在看、我在想、我在感受、我在决定。</span></p></blockquote>\n<p><span style=\"color: #E00;\">但本卷指出：</span></p>\n<p><span style=\"color: #E00;\">识并非一个真实主体。</span></p>\n<p><span style=\"color: #E00;\">识只是：</span></p>\n<ul><li><span style=\"color: #E00;\">见闻觉知的反应系统</span></li><li><span style=\"color: #E00;\">业力与因缘的显现系统</span></li><li><span style=\"color: #E00;\">忆想分别的加工系统</span></li></ul>\n<p><span style=\"color: #E00;\">所谓识：</span></p>\n<p><span style=\"color: #E00;\">本质是：</span></p>\n<blockquote><p><span style=\"color: #E00;\">因缘输入 → 分别加工 → 形成认知 → 执著结果</span></p></blockquote>\n<p><span style=\"color: #E00;\">整个过程。</span></p>\n<p><span style=\"color: #E00;\">因此识不是“我”。</span></p>\n<p><span style=\"color: #E00;\">识只是系统运作现象。</span></p>\n<hr>\n<h3>2. 五阴不是实体，而是动态生成机制</h3>\n<p>本卷不断强调：</p>\n<ul><li>非阴是阴</li><li>幻阴是阴</li><li>像阴是阴</li></ul>\n<p>核心在说明：</p>\n<p><span style=\"color: #E00;\">五阴从来不是固定存在。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<blockquote><p><span style=\"color: #E00;\">生灭流</span></p></blockquote>\n<p><span style=\"color: #E00;\">类似：</span></p>\n<ul><li><span style=\"color: #E00;\">火焰不断变化</span></li><li><span style=\"color: #E00;\">河流不断流动</span></li><li><span style=\"color: #E00;\">电影不断换帧</span></li></ul>\n<p><span style=\"color: #E00;\">凡夫看到连续性。</span></p>\n<p><span style=\"color: #E00;\">圣者看到生灭性。</span></p>\n<p><span style=\"color: #E00;\">众生执著的是“持续存在”。</span></p>\n<p><span style=\"color: #E00;\">菩萨观察的是“刹那更新”。</span></p>\n<p>因此：</p>\n<p>五阴不是东西。</p>\n<p>五阴是过程。</p>\n<hr>\n<h3>3. 解脱不是消灭五阴，而是看破五阴</h3>\n<p>很多人误以为：</p>\n<p>修行就是消灭思想。</p>\n<p>消灭感觉。</p>\n<p>消灭意识。</p>\n<p>本卷彻底否定这种理解。</p>\n<p>菩萨观五阴时：</p>\n<ul><li>不生五阴</li><li>不灭五阴</li></ul>\n<p>因为：</p>\n<p><span style=\"color: #E00;\">五阴本来无生。</span></p>\n<p><span style=\"color: #E00;\">既然本来无生。</span></p>\n<p><span style=\"color: #E00;\">又何须消灭？</span></p>\n<p>因此真正的解脱模型是：</p>\n<blockquote><p>执著 ↓  分别 ↓  认同 ↓  解脱 ↑</p></blockquote>\n<p>问题从来不在五阴。</p>\n<p>问题在认错五阴。</p>\n<hr>\n<h2>二、重点金句</h2>\n<hr>\n<h4>【原句】</h4>\n<p>非阴是识阴。顛倒陰是識陰。虛妄陰是識陰。</p>\n<h4>【白话解释】</h4>\n<p>所谓识，不过是颠倒认知和虚妄分别形成的结果。</p>\n<h4>【深层含义】</h4>\n<p>众生最大的错误：</p>\n<p>不是想错了。</p>\n<p>而是把“想法”当成自己。</p>\n<p>识不是主人。</p>\n<p>只是程序。</p>\n<p>认程序为自己。</p>\n<p>就是轮回开始的地方。</p>\n<hr>\n<h4>【原句】</h4>\n<p>從憶想分別起。</p>\n<h4>【白话解释】</h4>\n<p><span style=\"color: #E00;\">识的一切活动，都建立在记忆与分别之上。</span></p>\n<h4>【深层含义】</h4>\n<p>大多数烦恼并非来自现实。</p>\n<p>而来自：</p>\n<ul><li>对过去的记忆</li><li>对未来的想象</li></ul>\n<p>因此：</p>\n<p>痛苦不是事实。</p>\n<p>而是解释系统。</p>\n<hr>\n<h4>【原句】</h4>\n<p><span style=\"color: #E00;\">三界但皆是識。</span></p>\n<h4><span style=\"color: #E00;\">【白话解释】</span></h4>\n<p><span style=\"color: #E00;\">欲界、色界、无色界，都离不开识的作用。</span></p>\n<h4><span style=\"color: #E00;\">【深层含义】</span></h4>\n<p><span style=\"color: #E00;\">世界并非先存在然后被看见。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<p><span style=\"color: #E00;\">识参与构建了你所经验的世界。</span></p>\n<p><span style=\"color: #E00;\">你的认知结构。</span></p>\n<p><span style=\"color: #E00;\">决定你的世界结构。</span></p>\n<hr>\n<h4>【原句】</h4>\n<p>五受陰中。所有欲染則能除斷。</p>\n<h4>【白话解释】</h4>\n<p>真正断除的不是五阴，而是对五阴的染著。</p>\n<h4>【深层含义】</h4>\n<p><span style=\"color: #E00;\">人生问题：</span></p>\n<p><span style=\"color: #E00;\">从来不是拥有什么。</span></p>\n<p><span style=\"color: #E00;\">而是执著什么。</span></p>\n<p>财富不是问题。</p>\n<p>身份不是问题。</p>\n<p>思想也不是问题。</p>\n<p>执著才是问题。</p>\n<hr>\n<h4>【原句】</h4>\n<p>世間性如幻。</p>\n<h4>【白话解释】</h4>\n<p>整个世间如同幻术。</p>\n<h4>【深层含义】</h4>\n<p>如幻不是不存在。</p>\n<p>而是：</p>\n<p>显现而无实体。</p>\n<p>如电影。</p>\n<p>如梦境。</p>\n<p>如镜像。</p>\n<p>能经验。</p>\n<p>不可执著。</p>\n<hr>\n<h2>三、落地指南</h2>\n<h3>（1）修什么</h3>\n<p>本卷真正修的不是：</p>\n<ul><li>思想</li><li>情绪</li><li>行为</li></ul>\n<p>而是：</p>\n<blockquote><p>对“心识”的认同机制</p></blockquote>\n<p>也就是：</p>\n<p><strong>把念头当成自己的习惯。</strong></p>\n<hr>\n<h3>（2）5条具体修行指引</h3>\n<h4>① 观察念头，而不是跟随念头</h4>\n<p>每天出现焦虑时：</p>\n<p>不要问：</p>\n<blockquote><p>为什么焦虑？</p></blockquote>\n<p>而要问：</p>\n<blockquote><p>是谁看见焦虑？</p></blockquote>\n<p>从内容回到观察者。</p>\n<hr>\n<h4>② 给每个情绪加上“正在生起”</h4>\n<p>例如：</p>\n<p>不是：</p>\n<blockquote><p>我愤怒。</p></blockquote>\n<p>而是：</p>\n<blockquote><p>愤怒正在生起。</p></blockquote>\n<p>不是：</p>\n<blockquote><p>我害怕。</p></blockquote>\n<p>而是：</p>\n<blockquote><p>害怕正在生起。</p></blockquote>\n<p>训练自己脱离认同。</p>\n<hr>\n<h4>③ 记录执著来源</h4>\n<p>每次痛苦出现时记录：</p>\n<ul><li>我执著什么？</li><li>我害怕失去什么？</li><li>我认为必须得到什么？</li></ul>\n<p>连续记录30天。</p>\n<p>会发现：</p>\n<p>烦恼背后永远是执著。</p>\n<hr>\n<h4>④ 练习观察生灭</h4>\n<p>散步时观察：</p>\n<ul><li>呼吸生灭</li><li>声音生灭</li><li>念头生灭</li><li>情绪生灭</li></ul>\n<p>训练自己看见：</p>\n<p>变化才是真相。</p>\n<hr>\n<h4>⑤ 做决定前先看识</h4>\n<p>每当出现强烈冲动：</p>\n<p>先暂停观察：</p>\n<p>这是：</p>\n<ul><li>贪？</li><li>嗔？</li><li>恐惧？</li><li>习惯？</li></ul>\n<p>还是智慧？</p>\n<p>识清楚了。</p>\n<p>决策自然清楚。</p>\n<hr>\n<h3>（3）自检问题</h3>\n<h4>1</h4>\n<p>我是否把自己的念头当成真实的自己？</p>\n<hr>\n<h4>2</h4>\n<p>当情绪出现时，我是在观察它，还是成为它？</p>\n<hr>\n<h4>3</h4>\n<p>我最大的执著是什么？</p>\n<p>财富？</p>\n<p>身份？</p>\n<p>关系？</p>\n<p>认知正确感？</p>\n<hr>\n<h4>4</h4>\n<p>如果今天失去最在意的东西，我的“我”还存在吗？</p>\n<hr>\n<h4>5</h4>\n<p>我是在活在现实中，还是活在自己的解释系统中？</p>\n<hr>\n<h2>结语（系统定位）</h2>\n<p>《持世经》卷二的重要性极高。</p>\n<p>前面讲五阴。</p>\n<p>这一卷开始深入：</p>\n<blockquote><p><span style=\"color: #E00;\">五阴为什么会持续运转。</span></p></blockquote>\n<p><span style=\"color: #E00;\">答案就是：</span></p>\n<p><span style=\"color: #E00;\">识。</span></p>\n<p><span style=\"color: #E00;\">识像整个轮回系统的中央处理器。</span></p>\n<p><span style=\"color: #E00;\">色受想行都围绕识运作。</span></p>\n<p>因此本卷解决的根本问题是：</p>\n<blockquote><p>众生为什么会把虚妄经验误认为真实自我？</p></blockquote>\n<p>当识被看成真实。</p>\n<p>轮回成立。</p>\n<p>当识被看成因缘。</p>\n<p>智慧生起。</p>\n<p>所以这一卷真正开启的，不是五阴分析。</p>\n<p>而是整个觉醒系统最关键的一步：</p>\n<p><strong><span style=\"color: #E00;\">从“我是念头”走向“我看见念头”。</span></strong></p>\n<p><span style=\"color: #E00;\">当这一转变发生。</span></p>\n<p><span style=\"color: #E00;\">解脱之门便开始打开。</span></p>\n<p><span style=\"color: #E00;\">​</span></p>"},{"id":"section-003","kind":"volume","number":3,"title":"第3卷｜《持世经》卷第三核心拆解（一）","html":"<hr>\n<h2>《持世经》卷第三核心拆解（一）</h2>\n<h2>十二入品第四</h2>\n<p>这一品实际上是在破除众生对于：</p>\n<p><strong>六根 + 六尘</strong></p>\n<p>的真实执著。</p>\n<p>即：</p>\n<ul><li>眼 色</li><li>耳 声</li><li>鼻 香</li><li>舌 味</li><li>身 触</li><li>意 法</li></ul>\n<p>合称：</p>\n<p><strong>十二入（十二处）</strong></p>\n<hr>\n<h3>第一层：眼不是眼，色不是色</h3>\n<p>佛说：</p>\n<blockquote><p>眼入不可得。  色入不可得。</p></blockquote>\n<p>什么意思？</p>\n<p>凡夫认为：</p>\n<p>我有一个真实眼睛。</p>\n<p>外面有一个真实世界。</p>\n<p>眼睛看到世界。</p>\n<p>这是事实。</p>\n<p>佛说：</p>\n<p>不是。</p>\n<p>所谓眼：</p>\n<p>只是众缘和合。</p>\n<p>所谓色：</p>\n<p>也是众缘和合。</p>\n<p>所谓见：</p>\n<p>更是缘起和合。</p>\n<p>离开因缘，</p>\n<p>根本找不到一个固定存在的：</p>\n<ul><li>眼</li><li>色</li><li>见</li></ul>\n<hr>\n<h4>举例</h4>\n<p>你看一朵花。</p>\n<p>凡夫认为：</p>\n<p>我 → 看见 → 花</p>\n<p>佛说：</p>\n<p>其实同时具足：</p>\n<ul><li>眼根</li><li>光线</li><li>距离</li><li>神经系统</li><li>意识分别</li></ul>\n<p>无数条件。</p>\n<p>缺一个都看不到。</p>\n<p>因此：</p>\n<p>花不是独立存在。</p>\n<p>眼不是独立存在。</p>\n<p>见也不是独立存在。</p>\n<hr>\n<h3>修行重点</h3>\n<p>当你看见东西时：</p>\n<p>不要执著：</p>\n<blockquote><p>我在看。</p></blockquote>\n<p>而观察：</p>\n<p>只是因缘显现。</p>\n<p>这样我执开始松动。</p>\n<hr>\n<h2>第二层：十二入都是虚妄建立</h2>\n<p>经文说：</p>\n<blockquote><p>从忆想分别起。</p></blockquote>\n<p>这是大乘佛法非常重要一句。</p>\n<hr>\n<p><span style=\"color: #E00;\">凡夫看到世界：</span></p>\n<p><span style=\"color: #E00;\">其实不是看到世界。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<p><span style=\"color: #E00;\">看到自己头脑的解释。</span></p>\n<p><span style=\"color: #E00;\">例如：</span></p>\n<p><span style=\"color: #E00;\">同一件事。</span></p>\n<p><span style=\"color: #E00;\">有人觉得幸福。</span></p>\n<p><span style=\"color: #E00;\">有人觉得痛苦。</span></p>\n<p><span style=\"color: #E00;\">事情没变。</span></p>\n<p><span style=\"color: #E00;\">分别变了。</span></p>\n<hr>\n<p>佛说：</p>\n<p>十二入本身没有固定意义。</p>\n<p>意义来自：</p>\n<ul><li>记忆</li><li>经验</li><li>习气</li><li>分别</li></ul>\n<p>所以：</p>\n<p>十二入是虚妄建立。</p>\n<hr>\n<h3>现代启示</h3>\n<p>很多烦恼不是来自现实。</p>\n<p>而来自：</p>\n<p>自己对现实的解释。</p>\n<p>例如：</p>\n<p>别人没回复消息。</p>\n<p>事实：</p>\n<p>只是没回复。</p>\n<p>分别：</p>\n<ul><li>他讨厌我</li><li>他看不起我</li><li>他故意冷落我</li></ul>\n<p>于是烦恼生起。</p>\n<p>其实：</p>\n<p>烦恼来自分别。</p>\n<p>不是来自事实。</p>\n<hr>\n<h2>第三层：十二入无作者</h2>\n<p>佛说：</p>\n<blockquote><p>诸入无有作者。</p></blockquote>\n<p>这是极深般若。</p>\n<hr>\n<p>眼不会说：</p>\n<p>我是眼。</p>\n<p>色不会说：</p>\n<p>我是色。</p>\n<p>意识不会说：</p>\n<p>我是意识。</p>\n<p>一切法都只是因缘流动。</p>\n<p>没有一个主宰者。</p>\n<hr>\n<h3>修行重点</h3>\n<p>当愤怒生起：</p>\n<p>不要说：</p>\n<blockquote><p>我愤怒。</p></blockquote>\n<p>改成：</p>\n<blockquote><p>愤怒正在生起。</p></blockquote>\n<p>当贪欲生起：</p>\n<p>不要说：</p>\n<blockquote><p>我贪心。</p></blockquote>\n<p>改成：</p>\n<blockquote><p>贪欲正在生起。</p></blockquote>\n<p>这是从：</p>\n<p>人相</p>\n<p>进入</p>\n<p>法相观察。</p>\n<hr>\n<h2>第四层：十二入如幻</h2>\n<p>佛说：</p>\n<blockquote><p>眼色性如幻性。</p></blockquote>\n<p><span style=\"color: #E00;\">如幻是什么意思？</span></p>\n<p><span style=\"color: #E00;\">不是不存在。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<p><span style=\"color: #E00;\">存在方式像幻术。</span></p>\n<hr>\n<p>例如电影。</p>\n<p>画面有。</p>\n<p>故事有。</p>\n<p>人物有。</p>\n<p>但实际上：</p>\n<p>只是不断变化的光影。</p>\n<hr>\n<p>众生的人生也是如此。</p>\n<p>有：</p>\n<ul><li>身体</li><li>家庭</li><li>财富</li><li>成败</li></ul>\n<p>但都在不断变化。</p>\n<p>没有固定实体。</p>\n<hr>\n<h3>修行重点</h3>\n<p><span style=\"color: #E00;\">若知一切如幻：</span></p>\n<p><span style=\"color: #E00;\">得失心减少。</span></p>\n<p><span style=\"color: #E00;\">执著减轻。</span></p>\n<p><span style=\"color: #E00;\">烦恼减少。</span></p>\n<p><span style=\"color: #E00;\">慈悲反而增长。</span></p>\n<hr>\n<h2>第五层：十二入束缚众生</h2>\n<p>佛说：</p>\n<blockquote><p>眼是色门。  色是眼门。</p></blockquote>\n<p>什么意思？</p>\n<p>众生通过六根六尘：</p>\n<p>不断产生：</p>\n<ul><li>爱</li><li>恨</li><li>贪</li><li>嗔</li></ul>\n<p>于是轮回。</p>\n<hr>\n<p>整个轮回过程：</p>\n<p>看到 → 喜欢 → 执著</p>\n<p>听到 → 生气 → 造业</p>\n<p>想到 → 分别 → 烦恼</p>\n<p>不断循环。</p>\n<hr>\n<h3>修行重点</h3>\n<p>不要急着处理外境。</p>\n<p>先观察：</p>\n<p>是谁被境界牵动？</p>\n<p>是眼吗？</p>\n<p>不是。</p>\n<p>是色吗？</p>\n<p>不是。</p>\n<p>是执著。</p>\n<hr>\n<h2>十二入品总结</h2>\n<p>这一品核心只有一句：</p>\n<blockquote><p>六根六尘皆因缘生，毕竟空寂，如幻无实。</p></blockquote>\n<p><span style=\"color: #E00;\">修到深处会发现：</span></p>\n<p><span style=\"color: #E00;\">不是我要放下世界。</span></p>\n<p><span style=\"color: #E00;\">而是发现：</span></p>\n<p><span style=\"color: #E00;\">本来就没有一个真实可执著的世界。</span></p>\n<p><span style=\"color: #E00;\">于是自然自在。</span></p>\n<hr>\n<h2>十二因缘品第五（总纲）</h2>\n<p>这一品极其重要。</p>\n<p>几乎是《中论》《般若经》《维摩经》的思想源头之一。</p>\n<p>佛在这里讲的不是：</p>\n<p>普通十二因缘。</p>\n<p>而是：</p>\n<p><strong>十二因缘空。</strong></p>\n<hr>\n<p>普通人理解：</p>\n<p>无明 → 行 → 识 → 名色 → 六入 → 触 → 受 → 爱 → 取 → 有 → 生 → 老死</p>\n<p>这是轮回链条。</p>\n<hr>\n<p>《持世经》进一步说：</p>\n<p>不仅老死空。</p>\n<p>生空。</p>\n<p>有空。</p>\n<p>取空。</p>\n<p>爱空。</p>\n<p>受空。</p>\n<p>触空。</p>\n<p>六入空。</p>\n<p>名色空。</p>\n<p>识空。</p>\n<p>行空。</p>\n<p>无明也空。</p>\n<hr>\n<p>最终得到：</p>\n<blockquote><p>因缘亦空。</p></blockquote>\n<p>这已经进入龙树菩萨《中观》的核心思想。</p>\n<hr>\n<h2>本卷最重要的一句话</h2>\n<p>经中说：</p>\n<blockquote><p><span style=\"color: #E00;\">无明实相即是明。</span></p></blockquote>\n<p><span style=\"color: #E00;\">这是全卷最高峰。</span></p>\n<p><span style=\"color: #E00;\">意思是：</span></p>\n<p><span style=\"color: #E00;\">当你真正看见无明没有自性。</span></p>\n<p><span style=\"color: #E00;\">无明当下就是智慧。</span></p>\n<p><span style=\"color: #E00;\">正如：</span></p>\n<p><span style=\"color: #E00;\">看见波浪是水。</span></p>\n<p><span style=\"color: #E00;\">波浪当下就是水。</span></p>\n<p><span style=\"color: #E00;\">看见烦恼空性。</span></p>\n<p><span style=\"color: #E00;\">烦恼当下就是菩提。</span></p>\n<p>这与《大般涅槃经》讲的：</p>\n<blockquote><p>烦恼即菩提</p></blockquote>\n<p>完全一致。</p>\n<hr>\n<h2>本卷修行总纲</h2>\n<p>卷第三实际上讲了四个层次：</p>\n<h4>第一层</h4>\n<p>十二入空</p>\n<p>破六根六尘执著。</p>\n<hr>\n<h4>第二层</h4>\n<p>十二因缘空</p>\n<p>破轮回执著。</p>\n<hr>\n<h4>第三层</h4>\n<p>四念处空</p>\n<p>破身心执著。</p>\n<hr>\n<h4>第四层</h4>\n<p>五根增长</p>\n<p>建立：</p>\n<ul><li>信</li><li>精进</li><li>念</li><li>定</li><li>慧</li></ul>\n<p>走向菩萨道。</p>\n<hr>\n<p>一句话总结卷第三：</p>\n<blockquote><p><span style=\"color: #E00;\">先观六根六尘如幻，再观十二因缘无生，继而观身心诸法皆空，最后建立信进念定慧五根，成就无生法忍，趋向佛果。</span></p></blockquote>\n<p>​</p>\n<p>​</p>"},{"id":"section-004","kind":"volume","number":4,"title":"第4卷｜《真正的八圣道，不是修正自己，而是超越一切“正确”》","html":"<h4>——《持世经》第四卷：从道相中解脱，进入诸法实相</h4>\n<hr>\n<h3>开篇三段逻辑对位</h3>\n<p>在前面诸卷中，佛陀已经依次拆解了五阴、十八界、十二入、十二因缘、四念处、五根等体系，把众生对于“自我”“世界”“修行”的执着根基层层瓦解。</p>\n<p>但问题来了：</p>\n<p>当众生放下世俗执着之后，往往又会执着于佛法本身。执着正见、执着禅定、执着涅槃、执着佛果，甚至执着“我正在修行”。世俗之绳断了，法执之绳却生起了。</p>\n<p>因此本卷要解决的核心问题是：</p>\n<p><strong>当连佛法都变成执着对象时，如何真正进入无碍解脱？</strong></p>\n<p>佛陀给出的方向不是否定修行，而是让<span style=\"color: #E00;\">修行最终超越一切名相、概念、对立与分别，进入诸法平等、无取无舍的实相智慧。</span></p>\n<hr>\n<h2>一、整卷大义</h2>\n<h3>① <span style=\"color: #E00;\">八圣道的终极意义：不是建立正确，而是破除一切执着</span></h3>\n<p>本卷最大的颠覆在于：</p>\n<p>佛陀并没有把八圣道理解为一套固定标准。</p>\n<p>而是指出：</p>\n<ul><li>执着邪见是束缚</li><li>执着正见也是束缚</li><li>执着世间是束缚</li><li>执着出世间也是束缚</li><li>执着生死是束缚</li><li>执着涅槃也是束缚</li></ul>\n<p>真正的八圣道，不是创造新的认知体系。</p>\n<p>而是：</p>\n<p><strong><span style=\"color: #E00;\">帮助众生超越所有认知体系。</span></strong></p>\n<p><span style=\"color: #E00;\">这是认知层的彻底解放。</span></p>\n<hr>\n<h3>② 一切二元对立，本质都是意识制造的幻象</h3>\n<p>本卷不断反复强调：</p>\n<ul><li><span style=\"color: #E00;\">世间 vs 出世间</span></li><li><span style=\"color: #E00;\">有为 vs 无为</span></li><li><span style=\"color: #E00;\">正 vs 邪</span></li><li><span style=\"color: #E00;\">生死 vs 涅槃</span></li></ul>\n<p><span style=\"color: #E00;\">这些看似真实的差别。</span></p>\n<p><span style=\"color: #E00;\">其实都是分别心建立的概念边界。</span></p>\n<p><span style=\"color: #E00;\">当众生执着边界时：</span></p>\n<p><span style=\"color: #E00;\">就会产生取舍。</span></p>\n<p><span style=\"color: #E00;\">有取舍：</span></p>\n<p><span style=\"color: #E00;\">就有烦恼。</span></p>\n<p><span style=\"color: #E00;\">有烦恼：</span></p>\n<p><span style=\"color: #E00;\">就有轮回。</span></p>\n<p><span style=\"color: #E00;\">因此本卷揭示的核心机制是：</span></p>\n<blockquote><p><span style=\"color: #E00;\">分别 → 对立 → 取舍 → 执着 → 轮回</span></p></blockquote>\n<p><span style=\"color: #E00;\">这是一切痛苦的生成链条。</span></p>\n<hr>\n<h3>③ <span style=\"color: #E00;\">真正的修行，是训练“不住”的能力</span></h3>\n<p><span style=\"color: #E00;\">佛陀不断强调：</span></p>\n<ul><li><span style=\"color: #E00;\">不住正见</span></li><li><span style=\"color: #E00;\">不住正念</span></li><li><span style=\"color: #E00;\">不住正定</span></li><li><span style=\"color: #E00;\">不住无为</span></li><li><span style=\"color: #E00;\">不住出世间</span></li></ul>\n<p><span style=\"color: #E00;\">这并不是否定这些法门。</span></p>\n<p><span style=\"color: #E00;\">而是告诉我们：</span></p>\n<p><span style=\"color: #E00;\">任何法门都只是船。</span></p>\n<p><span style=\"color: #E00;\">不是彼岸。</span></p>\n<p><span style=\"color: #E00;\">真正的觉悟能力叫：</span></p>\n<p><strong><span style=\"color: #E00;\">无所住而生其心。</span></strong></p>\n<p><span style=\"color: #E00;\">这是整部《持世经》反复指向的终极操作系统。</span></p>\n<hr>\n<h2>二、重点金句</h2>\n<hr>\n<h4>【原句】</h4>\n<p><span style=\"color: #E00;\">“一切诸见皆名为邪，乃至涅槃见、佛见。”</span></p>\n<h4><span style=\"color: #E00;\">【白话解释】</span></h4>\n<p><span style=\"color: #E00;\">只要成为执着对象。</span></p>\n<p><span style=\"color: #E00;\">哪怕是佛法。</span></p>\n<p><span style=\"color: #E00;\">也会变成障碍。</span></p>\n<h4>【深层含义】</h4>\n<p>问题从来不在内容。</p>\n<p>而在执着。</p>\n<p>心理层：</p>\n<p>执念制造束缚。</p>\n<p>结构层：</p>\n<p>认知固化产生盲区。</p>\n<p>能量层：</p>\n<p>自我认同附着其上。</p>\n<p>真正束缚人的。</p>\n<p>不是错误观念。</p>\n<p>而是“非要正确”。</p>\n<hr>\n<h4>【原句】</h4>\n<p><span style=\"color: #E00;\">“断诸分别名为正思惟。”</span></p>\n<h4><span style=\"color: #E00;\">【白话解释】</span></h4>\n<p><span style=\"color: #E00;\">最高层次的思维。</span></p>\n<p><span style=\"color: #E00;\">不是想得更多。</span></p>\n<p><span style=\"color: #E00;\">而是不再被概念束缚。</span></p>\n<h4>【深层含义】</h4>\n<p>现代人大多数问题：</p>\n<p>不是不会思考。</p>\n<p>而是思考过度。</p>\n<p>不停分析。</p>\n<p>不停判断。</p>\n<p>不停定义。</p>\n<p>最后把自己困死在头脑里。</p>\n<p><span style=\"color: #E00;\">真正智慧：</span></p>\n<p><span style=\"color: #E00;\">来自超越分别。</span></p>\n<p><span style=\"color: #E00;\">而不是强化分别。</span></p>\n<hr>\n<h4>【原句】</h4>\n<p>“世间实相即是出世间。”</p>\n<h4>【白话解释】</h4>\n<p>离开现实寻找解脱。</p>\n<p>永远找不到。</p>\n<h4>【深层含义】</h4>\n<p>很多人认为：</p>\n<p>修行要逃离社会。</p>\n<p>逃离工作。</p>\n<p>逃离家庭。</p>\n<p>佛陀这里彻底否定了这种理解。</p>\n<p><span style=\"color: #E00;\">真正觉悟：</span></p>\n<p><span style=\"color: #E00;\">不是离开世界。</span></p>\n<p><span style=\"color: #E00;\">而是在世界中看透世界。</span></p>\n<hr>\n<h4>【原句】</h4>\n<p>“有为如实相，即名无为。”</p>\n<h4>【白话解释】</h4>\n<p>不是离开现象才见真相。</p>\n<p>而是在现象中见真相。</p>\n<h4>【深层含义】</h4>\n<p><span style=\"color: #E00;\">浪花就是海水。</span></p>\n<p><span style=\"color: #E00;\">烦恼就是菩提。</span></p>\n<p><span style=\"color: #E00;\">生死就是涅槃。</span></p>\n<p><span style=\"color: #E00;\">不是两个东西。</span></p>\n<p><span style=\"color: #E00;\">只是认知角度不同。</span></p>\n<hr>\n<h4>【原句】</h4>\n<p>“正定者，即是诸法平等义。”</p>\n<h4>【白话解释】</h4>\n<p><span style=\"color: #E00;\">最高禅定。</span></p>\n<p><span style=\"color: #E00;\">不是进入特殊状态。</span></p>\n<p><span style=\"color: #E00;\">而是不再制造差别。</span></p>\n<h4>【深层含义】</h4>\n<p>很多人追求神秘体验。</p>\n<p>追求境界。</p>\n<p>追求感应。</p>\n<p><span style=\"color: #E00;\">但真正的大定。</span></p>\n<p><span style=\"color: #E00;\">不是获得什么。</span></p>\n<p><span style=\"color: #E00;\">而是不再执着什么。</span></p>\n<hr>\n<h2>三、落地指南</h2>\n<h3>（1）修什么？</h3>\n<p>本卷真正修的不是：</p>\n<p>行为。</p>\n<p>而是：</p>\n<blockquote><p><strong>分别心系统。</strong></p></blockquote>\n<p>所有烦恼。</p>\n<p>最终都来自：</p>\n<p>“我把事物分成了喜欢和讨厌。”</p>\n<p>修行到最后。</p>\n<p>修的是：</p>\n<p>停止制造对立。</p>\n<hr>\n<h3>（2）5条具体修行指引</h3>\n<h4>① 每次情绪起来时，先找出背后的“分别”</h4>\n<p>例如：</p>\n<ul><li>为什么生气？</li><li>为什么焦虑？</li><li>为什么嫉妒？</li></ul>\n<p>继续追问。</p>\n<p>最后一定会发现：</p>\n<p>因为心里有一个“应该”。</p>\n<p>找到这个分别。</p>\n<p>烦恼立即减弱。</p>\n<hr>\n<h4>② 不急于给人贴标签</h4>\n<p>练习观察：</p>\n<ul><li>好人</li><li>坏人</li><li>聪明人</li><li>愚蠢人</li></ul>\n<p>这些标签是不是绝对真实？</p>\n<p>很多冲突。</p>\n<p>来自标签。</p>\n<p>不是事实。</p>\n<hr>\n<h4>③ 修行时警惕“修行优越感”</h4>\n<p>发现自己出现：</p>\n<ul><li>我懂得更多</li><li>我境界更高</li><li>我更接近真理</li></ul>\n<p>立即观照。</p>\n<p>因为法执已经出现。</p>\n<hr>\n<h4>④ 学会在现实中修行</h4>\n<p>工作时工作。</p>\n<p>打牌时打牌。</p>\n<p>吃饭时吃饭。</p>\n<p>不要把修行和生活切开。</p>\n<p>世间实相即出世间。</p>\n<p>就在当下。</p>\n<hr>\n<h4>⑤ 每天练习一次“不判断”</h4>\n<p>选一个小时。</p>\n<p>观察一切。</p>\n<p>不评价。</p>\n<p>不分析。</p>\n<p>不定义。</p>\n<p>只看见。</p>\n<p>这是训练正念最直接的方法。</p>\n<hr>\n<h3>（3）自检问题</h3>\n<h4>① 我最大的执着是什么？</h4>\n<p>是财富？</p>\n<p>名声？</p>\n<p>关系？</p>\n<p>还是某种佛法观念？</p>\n<hr>\n<h4>② 我是否把“正确”看得比真相更重要？</h4>\n<p>很多冲突。</p>\n<p>来自维护立场。</p>\n<p>不是寻找真相。</p>\n<hr>\n<h4>③ 我是否正在执着某种修行身份？</h4>\n<p>“修行人”</p>\n<p>“学佛人”</p>\n<p>“觉悟者”</p>\n<p>这些身份是否已经成为新的我执？</p>\n<hr>\n<h4>④ 我是否总在分别喜欢与讨厌？</h4>\n<p>分别越强。</p>\n<p>痛苦越深。</p>\n<hr>\n<h4>⑤ 如果失去所有概念标签，我是谁？</h4>\n<p>这是本卷最深的一问。</p>\n<hr>\n<h2>结语（系统定位）</h2>\n<p>《持世经》第四卷，是整部经的重要转折点。</p>\n<p>前面几卷：</p>\n<p>在拆解世界。</p>\n<p>这一卷：</p>\n<p>开始拆解修行本身。</p>\n<p>它解决的根本问题是：</p>\n<blockquote><p><strong>当众生连佛法都开始执着时，如何从法执中获得真正自由？</strong></p></blockquote>\n<p>因此这一卷实际上是在告诉我们：</p>\n<p>真正的八圣道，</p>\n<p>不是让你成为一个更正确的人。</p>\n<p>而是让你成为一个不再被“正确与错误”束缚的人。</p>\n<p>真正的出世间，</p>\n<p>不是离开世间。</p>\n<p>而是看透世间。</p>\n<p><span style=\"color: #E00;\">真正的无为，</span></p>\n<p><span style=\"color: #E00;\">不是什么都不做。</span></p>\n<p><span style=\"color: #E00;\">而是不再被分别心驱动。</span></p>\n<p><span style=\"color: #E00;\">当世间与出世间不二，</span></p>\n<p><span style=\"color: #E00;\">有为与无为不二，</span></p>\n<p><span style=\"color: #E00;\">生死与涅槃不二，</span></p>\n<p><span style=\"color: #E00;\">佛与众生不二，</span></p>\n<p>便开始触及《持世经》反复指向的核心：</p>\n<p><strong><span style=\"color: #E00;\">诸法实相，平等无二。</span></strong></p>\n<p><strong>​</strong></p>\n<hr>\n<h2>持世经到底说了什么？</h2>\n<h3>一部被严重低估的“大乘觉醒操作系统”</h3>\n<p>很多人读《持世经》。</p>\n<p>会觉得很奇怪。</p>\n<p>因为它不像《心经》那么简短。</p>\n<p>不像《金刚经》那么锋利。</p>\n<p>也不像《法华经》那么宏伟。</p>\n<p>甚至很多人第一次读的时候，会有一种感觉：</p>\n<p><strong>佛为什么一直在否定？</strong></p>\n<p>否定五阴。</p>\n<p>否定十二入。</p>\n<p>否定十八界。</p>\n<p>否定十二因缘。</p>\n<p>否定四念处。</p>\n<p>否定五根。</p>\n<p>否定八圣道。</p>\n<p>否定世间。</p>\n<p>否定出世间。</p>\n<p>否定有为。</p>\n<p>否定无为。</p>\n<p>最后连佛、涅槃、菩萨道都被否定。</p>\n<p>如果只看文字。</p>\n<p>你甚至会觉得：</p>\n<p>佛是不是把一切都推翻了？</p>\n<p>事实上。</p>\n<p>恰恰相反。</p>\n<p>《持世经》不是在破坏佛法。</p>\n<p>而是在帮助众生穿透佛法。</p>\n<p>这是整部《持世经》的核心。</p>\n<hr>\n<h2>一、众生最大的痛苦，不是无知，而是执着</h2>\n<p>大多数人认为：</p>\n<p>痛苦来自贫穷。</p>\n<p>来自失败。</p>\n<p>来自疾病。</p>\n<p>来自失恋。</p>\n<p>来自死亡。</p>\n<p>但《持世经》说：</p>\n<p>这些都只是表象。</p>\n<p><span style=\"color: #E00;\">真正的问题是：</span></p>\n<p><span style=\"color: #E00;\">我们把本来流动变化的东西，当成了真实不变的存在。</span></p>\n<p>于是开始抓取。</p>\n<p>开始占有。</p>\n<p>开始保护。</p>\n<p>开始恐惧失去。</p>\n<p>然后轮回开始。</p>\n<p>例如：</p>\n<p>身体会老。</p>\n<p>你却希望永远年轻。</p>\n<p>关系会变。</p>\n<p>你却希望永远不变。</p>\n<p>财富会流动。</p>\n<p>你却希望永远拥有。</p>\n<p>情绪会升起消失。</p>\n<p>你却把它定义成自己。</p>\n<p>于是痛苦产生。</p>\n<p>佛把这种机制称为：</p>\n<p><strong>颠倒。</strong></p>\n<p>而整部《持世经》。</p>\n<p>就是在拆除颠倒。</p>\n<hr>\n<h2>二、《持世经》最伟大的地方：连佛法也不让你执着</h2>\n<p>很多人学佛。</p>\n<p>学到后来出现一个现象：</p>\n<p>世俗执着减少了。</p>\n<p>法执出现了。</p>\n<p>开始执着：</p>\n<p>我是修行人。</p>\n<p>我是学佛人。</p>\n<p>我是大乘。</p>\n<p>我是禅宗。</p>\n<p>我是净土宗。</p>\n<p>我是懂空性的人。</p>\n<p>我是觉悟的人。</p>\n<p>结果：</p>\n<p>世俗身份没了。</p>\n<p>修行身份来了。</p>\n<p>旧枷锁断了。</p>\n<p>新枷锁出现了。</p>\n<p>所以《持世经》说：</p>\n<p>连正见都不能执着。</p>\n<p>连正念都不能执着。</p>\n<p>连正定都不能执着。</p>\n<p>甚至：</p>\n<p>连佛见、涅槃见都不能执着。</p>\n<p>这句话震撼无数人。</p>\n<p>为什么？</p>\n<p>因为<span style=\"color: #E00;\">佛发现：</span></p>\n<p><span style=\"color: #E00;\">众生最大的能力是创造牢笼。</span></p>\n<p><span style=\"color: #E00;\">他会把任何东西都变成牢笼。</span></p>\n<p>包括佛法。</p>\n<p>所以《持世经》真正要做的事情是：</p>\n<p><strong>不是给你新的观念。</strong></p>\n<p>而是让你从一切观念中解脱出来。</p>\n<hr>\n<h2>三、八圣道真正修的是什么？</h2>\n<p>很多人理解八圣道：</p>\n<p>正见。</p>\n<p>正思维。</p>\n<p>正语。</p>\n<p>正业。</p>\n<p>正命。</p>\n<p>正精进。</p>\n<p>正念。</p>\n<p>正定。</p>\n<p>似乎是在建立一个“正确的人”。</p>\n<p>但《持世经》告诉我们：</p>\n<p>不是。</p>\n<p><span style=\"color: #E00;\">八圣道最终修的是：</span></p>\n<p><strong><span style=\"color: #E00;\">停止制造分别。</span></strong></p>\n<p>为什么？</p>\n<p>因为一切烦恼都来自分别。</p>\n<p><span style=\"color: #E00;\">分别产生比较。</span></p>\n<p><span style=\"color: #E00;\">比较产生取舍。</span></p>\n<p><span style=\"color: #E00;\">取舍产生执着。</span></p>\n<p><span style=\"color: #E00;\">执着产生轮回。</span></p>\n<p>整个轮回系统其实非常简单：</p>\n<p><span style=\"color: #E00;\">分别 → 取舍 → 执着 → 业力 → 轮回</span></p>\n<p>所以佛说：</p>\n<p>真正的正见。</p>\n<p>不是坚持某种观点。</p>\n<p>而是看见所有观点都只是观点。</p>\n<p><span style=\"color: #E00;\">真正的正念。</span></p>\n<p><span style=\"color: #E00;\">不是专注某个对象。</span></p>\n<p><span style=\"color: #E00;\">而是不被任何对象束缚。</span></p>\n<p><span style=\"color: #E00;\">真正的正定。</span></p>\n<p><span style=\"color: #E00;\">不是进入特殊状态。</span></p>\n<p><span style=\"color: #E00;\">而是不再依赖任何状态。</span></p>\n<p>这是《持世经》对于八圣道最深层的重新定义。</p>\n<hr>\n<h2>四、世间与出世间，其实从来不是两个世界</h2>\n<p>很多修行人都有一个误区。</p>\n<p>认为：</p>\n<p>上班是世间。</p>\n<p>修行是出世间。</p>\n<p>赚钱是世间。</p>\n<p>打坐是出世间。</p>\n<p>家庭是世间。</p>\n<p>寺院是出世间。</p>\n<p>《持世经》直接把这种观念打碎。</p>\n<p>佛说：</p>\n<p>世间实相即是出世间。</p>\n<p>什么意思？</p>\n<p>如果你离开世间才能找到真理。</p>\n<p>那真理一定不究竟。</p>\n<p>因为它需要条件。</p>\n<p><span style=\"color: #E00;\">真正的智慧是什么？</span></p>\n<p><span style=\"color: #E00;\">是在世间中看透世间。</span></p>\n<p>不是逃离世界。</p>\n<p>而是觉醒于世界。</p>\n<p><span style=\"color: #E00;\">所以佛法从来不是逃避现实。</span></p>\n<p><span style=\"color: #E00;\">而是穿透现实。</span></p>\n<p>工作可以修行。</p>\n<p>打牌可以修行。</p>\n<p>创业可以修行。</p>\n<p>婚姻可以修行。</p>\n<p>养孩子可以修行。</p>\n<p>关键不在形式。</p>\n<p>而在是否执着。</p>\n<hr>\n<h2>五、有为与无为，是《持世经》最深的一层</h2>\n<p>很多人理解无为。</p>\n<p>就是不做事。</p>\n<p>其实完全错了。</p>\n<p>《持世经》说：</p>\n<p><span style=\"color: #E00;\">有为如实相，即是无为。</span></p>\n<p><span style=\"color: #E00;\">什么意思？</span></p>\n<p><span style=\"color: #E00;\">浪花与海水。</span></p>\n<p><span style=\"color: #E00;\">是两个东西吗？</span></p>\n<p><span style=\"color: #E00;\">不是。</span></p>\n<p><span style=\"color: #E00;\">浪花本身就是海水。</span></p>\n<p><span style=\"color: #E00;\">同样：</span></p>\n<p><span style=\"color: #E00;\">有为本身就是无为。</span></p>\n<p><span style=\"color: #E00;\">生死本身就是涅槃。</span></p>\n<p><span style=\"color: #E00;\">烦恼本身就是菩提。</span></p>\n<p>为什么我们看不到？</p>\n<p>因为分别。</p>\n<p>因为执着。</p>\n<p>因为妄想。</p>\n<p>因此真正的修行。</p>\n<p>不是创造一个新的自己。</p>\n<p>而是看见：</p>\n<p>本来如此。</p>\n<p>这一层。</p>\n<p>已经无限接近《金刚经》的“应无所住而生其心”。</p>\n<p>也无限接近《心经》的“色即是空，空即是色”。</p>\n<hr>\n<h2>六、《持世经》最终要建立什么样的人？</h2>\n<p>整部《持世经》拆到最后。</p>\n<p>其实在塑造一种人。</p>\n<p>这种人：</p>\n<p>知道世界存在。</p>\n<p>但不被世界束缚。</p>\n<p>知道财富有价值。</p>\n<p>但不被财富控制。</p>\n<p>知道情绪会升起。</p>\n<p>但不认同情绪。</p>\n<p>知道修行重要。</p>\n<p>但不执着修行。</p>\n<p>知道佛法珍贵。</p>\n<p>但不执着佛法。</p>\n<p>这样的人。</p>\n<p>不是冷漠。</p>\n<p>不是消极。</p>\n<p>不是躺平。</p>\n<p>恰恰相反。</p>\n<p>这种人拥有最强大的行动力。</p>\n<p><span style=\"color: #E00;\">因为他行动。</span></p>\n<p><span style=\"color: #E00;\">却不被结果绑架。</span></p>\n<p><span style=\"color: #E00;\">努力。</span></p>\n<p><span style=\"color: #E00;\">却不被成败定义。</span></p>\n<p><span style=\"color: #E00;\">付出。</span></p>\n<p><span style=\"color: #E00;\">却不期待回报。</span></p>\n<p><span style=\"color: #E00;\">这就是大乘菩萨。</span></p>\n<hr>\n<h2>七、给现代人的最大启示</h2>\n<p>如果让我用一句话总结《持世经》。</p>\n<p>我会这样说：</p>\n<p><strong><span style=\"color: #E00;\">人类一切痛苦，都来自把本来流动变化的东西，当成固定真实的存在。</span></strong></p>\n<p>于是：</p>\n<p>把身体当成我。</p>\n<p>把情绪当成我。</p>\n<p>把思想当成我。</p>\n<p>把财富当成我。</p>\n<p>把成功当成我。</p>\n<p>把失败当成我。</p>\n<p>甚至：</p>\n<p>把修行当成我。</p>\n<p>然后开始保护。</p>\n<p>开始恐惧。</p>\n<p>开始斗争。</p>\n<p>开始轮回。</p>\n<p>而《持世经》做的事情。</p>\n<p>就是一步一步帮助我们发现：</p>\n<p>这些都不是你。</p>\n<p><span style=\"color: #E00;\">甚至连“你”本身。</span></p>\n<p><span style=\"color: #E00;\">也只是因缘和合的假名。</span></p>\n<p>当这一层真正看见时。</p>\n<p>生命会发生巨大的变化。</p>\n<p>你依然工作。</p>\n<p>依然生活。</p>\n<p>依然爱人。</p>\n<p>依然承担责任。</p>\n<p>但心里开始出现一种前所未有的自由。</p>\n<p><span style=\"color: #E00;\">这种自由不是得到什么。</span></p>\n<p><span style=\"color: #E00;\">而是不再被什么抓住。</span></p>\n<hr>\n<h2>结语：整部《持世经》的终极答案</h2>\n<p>《持世经》从五阴讲到八圣道。</p>\n<p>从世间讲到出世间。</p>\n<p>从有为讲到无为。</p>\n<p>最后又讲护法、弘法、菩萨行。</p>\n<p>看起来内容很多。</p>\n<p>其实始终围绕一个核心：</p>\n<p><strong><span style=\"color: #E00;\">让众生从一切执着中解脱出来。</span></strong></p>\n<p>不仅放下世俗执着。</p>\n<p>还要放下修行执着。</p>\n<p>不仅放下我执。</p>\n<p>还要放下法执。</p>\n<p>不仅超越生死。</p>\n<p>还要超越涅槃。</p>\n<p>最终进入<span style=\"color: #E00;\">诸法平等、无取无舍、无住无碍的真实境界。</span></p>\n<p>这或许就是《持世经》真正想告诉我们的：</p>\n<p>修行的终点，</p>\n<p>不是成为一个更厉害的人。</p>\n<p>不是成为一个更正确的人。</p>\n<p>甚至不是成为一个更有境界的人。</p>\n<p>而是终于发现：</p>\n<p><span style=\"color: #E00;\">从来没有什么需要抓住。</span></p>\n<p><span style=\"color: #E00;\">从来没有什么需要证明。</span></p>\n<p><span style=\"color: #E00;\">从来没有什么需要成为。</span></p>\n<p><span style=\"color: #E00;\">当一切放下时。</span></p>\n<p><span style=\"color: #E00;\">本具的智慧与慈悲。</span></p>\n<p><span style=\"color: #E00;\">自然显现。</span></p>\n<p><span style=\"color: #E00;\">这就是佛陀所说的：</span></p>\n<p><span style=\"color: #E00;\">诸法实相。</span></p>\n<p>​</p>\n<h2>持世经给现代人的7大认知升级</h2>\n<h3>一部两千年前的经典，如何破解现代人的焦虑、内耗与迷茫？</h3>\n<p>这个时代的人，比历史上任何时代都拥有更多知识。</p>\n<p>但也比很多时代的人更焦虑。</p>\n<p>信息越来越多。</p>\n<p>智慧却没有同步增长。</p>\n<p>选择越来越多。</p>\n<p>内心却越来越迷茫。</p>\n<p>工具越来越强大。</p>\n<p>精神却越来越脆弱。</p>\n<p>为什么？</p>\n<p>因为现代人的问题，本质上不是能力问题。</p>\n<p>而是认知系统出了问题。</p>\n<p>而《持世经》最珍贵的地方在于：</p>\n<p>它不是教你获得更多。</p>\n<p>而是教你看清那些让你痛苦的底层运行机制。</p>\n<p>如果真正读懂《持世经》，至少会完成下面7次认知升级。</p>\n<hr>\n<h2>第一层升级：从“改变世界”到“看见世界”</h2>\n<p>普通人认为：</p>\n<p>人生的问题来自外部。</p>\n<p>老板不好。</p>\n<p>市场不好。</p>\n<p>伴侣不好。</p>\n<p>运气不好。</p>\n<p>环境不好。</p>\n<p>所以一生都在努力改变世界。</p>\n<p>结果发现：</p>\n<p>解决一个问题。</p>\n<p>新的问题又来了。</p>\n<p>《持世经》告诉我们：</p>\n<p>问题不一定在世界。</p>\n<p>而在于你怎么看世界。</p>\n<p>佛说：</p>\n<p><span style=\"color: #E00;\">一切世间法，皆因分别而有。</span></p>\n<p>同样一件事情。</p>\n<p>不同认知的人。</p>\n<p>体验完全不同。</p>\n<p>失业。</p>\n<p>有人觉得天塌了。</p>\n<p>有人觉得是转机。</p>\n<p>失败。</p>\n<p>有人觉得人生结束。</p>\n<p>有人觉得成长开始。</p>\n<p>世界没有变。</p>\n<p>认知变了。</p>\n<p>所以真正的成长不是控制外境。</p>\n<p>而是升级认知。</p>\n<p>这是现代人最重要的第一课。</p>\n<hr>\n<h2>第二层升级：从“追求正确”到“追求真实”</h2>\n<p>现代社会最容易出现一种病：</p>\n<p>观点执着。</p>\n<p>网络争论。</p>\n<p>职场冲突。</p>\n<p>家庭矛盾。</p>\n<p>很多时候不是利益问题。</p>\n<p>而是谁都觉得自己是对的。</p>\n<p>《持世经》有一句极其震撼的话：</p>\n<blockquote><p>一切诸见皆名为邪。</p></blockquote>\n<p>甚至：</p>\n<p>佛见。</p>\n<p>涅槃见。</p>\n<p>都不能执着。</p>\n<p>为什么？</p>\n<p>因为任何观点一旦变成身份认同。</p>\n<p>就会遮蔽真相。</p>\n<p>很多人不是在寻找答案。</p>\n<p>而是在捍卫立场。</p>\n<p>所以成长的重要标志不是：</p>\n<p>“我越来越正确。”</p>\n<p>而是：</p>\n<p>“我越来越接近真实。”</p>\n<hr>\n<h2>第三层升级：从“控制人生”到“理解因缘”</h2>\n<p>现代人最痛苦的一件事：</p>\n<p>总想控制一切。</p>\n<p>控制财富。</p>\n<p>控制关系。</p>\n<p>控制未来。</p>\n<p>控制结果。</p>\n<p>最后发现：</p>\n<p>很多事情根本控制不了。</p>\n<p>于是焦虑。</p>\n<p>于是失眠。</p>\n<p>于是内耗。</p>\n<p>《持世经》反复讲十二因缘。</p>\n<p>本质上是在告诉我们：</p>\n<p><span style=\"color: #E00;\">世界是因缘网络。</span></p>\n<p><span style=\"color: #E00;\">不是单点控制系统。</span></p>\n<p><span style=\"color: #E00;\">你的成功。</span></p>\n<p><span style=\"color: #E00;\">来自无数条件共同成就。</span></p>\n<p><span style=\"color: #E00;\">你的失败。</span></p>\n<p><span style=\"color: #E00;\">也是无数条件共同作用。</span></p>\n<p>因此真正成熟的人会逐渐明白：</p>\n<p><span style=\"color: #E00;\">尽人事。</span></p>\n<p><span style=\"color: #E00;\">知因缘。</span></p>\n<p><span style=\"color: #E00;\">顺变化。</span></p>\n<p>这不是消极。</p>\n<p>而是智慧。</p>\n<hr>\n<h2>第四层升级：从“自我中心”到“过程中心”</h2>\n<p>现代人的很多痛苦来自一句话：</p>\n<p>“我怎么样？”</p>\n<p>别人怎么看我？</p>\n<p>我有没有成功？</p>\n<p>我有没有价值？</p>\n<p>我是不是优秀？</p>\n<p>这种持续的自我关注。</p>\n<p>会制造巨大的精神压力。</p>\n<p>《持世经》对五阴的拆解告诉我们：</p>\n<p>所谓“我”。</p>\n<p>其实只是身心暂时组合。</p>\n<p>不断变化。</p>\n<p>从来没有一个固定不变的实体。</p>\n<p>当你开始明白这一点。</p>\n<p>注意力会从“我”转向“过程”。</p>\n<p><span style=\"color: #E00;\">工作变成创造。</span></p>\n<p><span style=\"color: #E00;\">学习变成成长。</span></p>\n<p><span style=\"color: #E00;\">修行变成觉察。</span></p>\n<p><span style=\"color: #E00;\">人生开始轻松很多。</span></p>\n<hr>\n<h2>第五层升级：从“追求结果”到“专注行动”</h2>\n<p>现代社会高度结果导向。</p>\n<p>考试看分数。</p>\n<p>工作看业绩。</p>\n<p>创业看收入。</p>\n<p>打牌看奖金。</p>\n<p>结果：</p>\n<p>越来越多人失去了行动本身的快乐。</p>\n<p>《持世经》讲：</p>\n<p><span style=\"color: #E00;\">正精进不是执着结果的努力。</span></p>\n<p><span style=\"color: #E00;\">而是不被结果绑架的努力。</span></p>\n<p><span style=\"color: #E00;\">这是一种极高阶状态。</span></p>\n<p><span style=\"color: #E00;\">努力。</span></p>\n<p><span style=\"color: #E00;\">但不焦虑。</span></p>\n<p><span style=\"color: #E00;\">投入。</span></p>\n<p><span style=\"color: #E00;\">但不执着。</span></p>\n<p><span style=\"color: #E00;\">行动。</span></p>\n<p><span style=\"color: #E00;\">但不恐惧失败。</span></p>\n<p>很多顶级运动员。</p>\n<p>顶级企业家。</p>\n<p>顶级扑克职业选手。</p>\n<p>其实都进入过这种状态。</p>\n<p><span style=\"color: #E00;\">他们专注于当下决策。</span></p>\n<p><span style=\"color: #E00;\">而不是未来结果。</span></p>\n<p><span style=\"color: #E00;\">这反而让他们发挥最佳水平。</span></p>\n<hr>\n<h2>第六层升级：从“逃离现实”到“觉醒于现实”</h2>\n<p>很多人以为：</p>\n<p>修行就是远离社会。</p>\n<p>远离竞争。</p>\n<p>远离家庭。</p>\n<p>远离工作。</p>\n<p>《持世经》直接打破这种误解：</p>\n<p>世间实相即是出世间。</p>\n<p>什么意思？</p>\n<p>不是离开生活才能觉悟。</p>\n<p><span style=\"color: #E00;\">而是在生活中觉悟。</span></p>\n<p><span style=\"color: #E00;\">工作时觉察自己。</span></p>\n<p><span style=\"color: #E00;\">输钱时觉察自己。</span></p>\n<p><span style=\"color: #E00;\">争吵时觉察自己。</span></p>\n<p><span style=\"color: #E00;\">成功时觉察自己。</span></p>\n<p><span style=\"color: #E00;\">失败时觉察自己。</span></p>\n<p>真正的道场不在深山。</p>\n<p>而在每天面对的人和事中。</p>\n<p>现实不是修行的障碍。</p>\n<p>现实本身就是修行。</p>\n<hr>\n<h2>第七层升级：从“抓住一切”到“无所住”</h2>\n<p>这是《持世经》最高的一层智慧。</p>\n<p>人生绝大部分痛苦来自抓取。</p>\n<p>抓住财富。</p>\n<p>抓住关系。</p>\n<p>抓住身份。</p>\n<p>抓住成功。</p>\n<p>抓住修行。</p>\n<p>抓住佛法。</p>\n<p>佛发现：</p>\n<p>众生最大的能力就是制造新的执着。</p>\n<p>放下世俗执着。</p>\n<p>抓住佛法。</p>\n<p>放下财富执着。</p>\n<p>抓住名声。</p>\n<p>放下名声执着。</p>\n<p>抓住修行身份。</p>\n<p>所以佛最后连法都要破。</p>\n<p>因为任何抓取都会变成束缚。</p>\n<p>真正的自由是什么？</p>\n<p>《金刚经》后来用一句话总结：</p>\n<p>应无所住而生其心。</p>\n<p>这其实也是《持世经》不断指向的终极方向。</p>\n<p>行动。</p>\n<p>但不执着行动。</p>\n<p>修行。</p>\n<p>但不执着修行。</p>\n<p>爱人。</p>\n<p>但不占有爱人。</p>\n<p>拥有。</p>\n<p>但不被拥有。</p>\n<p>这才是真正的大自在。</p>\n<hr>\n<h2>最后的总结：现代人最缺的不是知识，而是觉察</h2>\n<p>今天的人很聪明。</p>\n<p>懂商业。</p>\n<p>懂投资。</p>\n<p>懂科技。</p>\n<p>懂AI。</p>\n<p>懂流量。</p>\n<p>但很多人依然不快乐。</p>\n<p>因为知识解决的是外部问题。</p>\n<p>觉察解决的是内部问题。</p>\n<p>《持世经》从五阴讲到八圣道。</p>\n<p>从世间讲到出世间。</p>\n<p>从有为讲到无为。</p>\n<p>最终都在做同一件事：</p>\n<p>帮助众生看见自己的执着。</p>\n<p>因为佛发现：</p>\n<p>真正束缚我们的。</p>\n<p>从来不是世界。</p>\n<p>而是我们对世界的执着。</p>\n<p>真正伤害我们的。</p>\n<p>从来不是事情本身。</p>\n<p>而是我们对事情的解释。</p>\n<p>真正困住我们的。</p>\n<p>从来不是现实。</p>\n<p>而是我们头脑创造出来的牢笼。</p>\n<p>所以《持世经》最终给现代人的答案只有一句：</p>\n<p><strong><span style=\"color: #E00;\">人生最大的升级，不是获得更多，而是看得更透。</span></strong></p>\n<p><span style=\"color: #E00;\">当你看透五阴。</span></p>\n<p><span style=\"color: #E00;\">看透分别。</span></p>\n<p><span style=\"color: #E00;\">看透执着。</span></p>\n<p><span style=\"color: #E00;\">看透得失。</span></p>\n<p><span style=\"color: #E00;\">看透成败。</span></p>\n<p><span style=\"color: #E00;\">你不会离开这个世界。</span></p>\n<p><span style=\"color: #E00;\">但你会第一次真正自由地活在这个世界。</span></p>"}];
const home=document.querySelector('#home'),readerWrap=document.querySelector('#readerWrap'),sideToc=document.querySelector('#sideToc'),search=document.querySelector('#search');let current=-1,baseFont=17,touchX=0,touchY=0;
const label=c=>c.kind==='volume'?`第${c.number}卷`:c.kind==='summary'?'总结':`第${c.number}章`;
function save(){try{localStorage.setItem('ebook-7880e1671f-progress',JSON.stringify({id:current,scroll:window.scrollY}))}catch(e){}}
function setProgress(){let max=document.documentElement.scrollHeight-innerHeight;document.querySelector('#progressBar').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}
function go(i,saveScroll=false){if(i<0){current=-1;readerWrap.classList.add('hidden');home.classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0);save();return}i=Math.max(0,Math.min(CHAPTERS.length-1,i));current=i;const c=CHAPTERS[i];home.classList.add('hidden');readerWrap.classList.remove('hidden');document.querySelector('#chapterKicker').textContent=c.kind==='volume'?`${document.title.replace(' · 电子书','')} · ${label(c)}`:c.kind==='summary'?`${document.title.replace(' · 电子书','')} · 全书回顾`:`${document.title.replace(' · 电子书','')} · ${label(c)}`;document.querySelector('#chapterTitle').textContent=c.title;document.querySelector('#prose').innerHTML=c.html;document.querySelector('#prevBtn').disabled=i===0;document.querySelector('#nextBtn').disabled=i===CHAPTERS.length-1;document.querySelectorAll('[data-chapter]').forEach(x=>x.classList.toggle('active',Number(x.dataset.chapter)===i));history.replaceState(null,'',`#${c.id}`);document.querySelector('#sidebar').classList.remove('open');window.scrollTo(0,0);if(saveScroll){const y=saveScroll;window.scrollTo(0,y)}save();setProgress()}
function item(c,i,cls=''){return `<button class="${cls}" data-chapter="${i}"><b>${c.kind==='summary'?'末':String(c.number).padStart(2,'0')}</b><span>${c.title}</span></button>`}
function build(){sideToc.innerHTML=CHAPTERS.map((c,i)=>item(c,i)).join('');home.innerHTML=`<div class="hero"><div class="seal">阅</div><h1>持世经</h1><div class="sub">4 篇 · 网页电子书</div><div class="hero-rule"></div><p>从目录选择篇目开始阅读。阅读进度会保存在当前设备的浏览器中，方便下次接续。</p><div class="home-actions"><button class="primary" id="continueBtn">继续上次阅读</button><button class="action" id="startBtn">从第一卷开始</button></div></div><section class="contents"><h2>卷目目录</h2><div class="toc-grid">${CHAPTERS.map((c,i)=>item(c,i,'toc-card')).join('')}</div></section>`;document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.chapter))));document.querySelector('#startBtn').onclick=()=>go(0);document.querySelector('#continueBtn').onclick=resume}
function resume(){try{const p=JSON.parse(localStorage.getItem('ebook-7880e1671f-progress'));if(p&&p.id>=0){go(p.id);setTimeout(()=>window.scrollTo(0,p.scroll||0),80);return}}catch(e){}go(0)}
document.querySelector('#prevBtn').onclick=()=>go(current-1);document.querySelector('#nextBtn').onclick=()=>go(current+1);document.querySelector('#homeBtn').onclick=()=>go(-1);
document.querySelector('#fullBtn').onclick=async()=>{document.body.classList.add('reading');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('已切换阅读布局')}document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('reading');document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.querySelector('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('ebook-7880e1671f-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('ebook-7880e1671f-dark')==='1'||(localStorage.getItem('ebook-7880e1671f-dark')===null&&document.body.dataset.template==='5'))document.body.classList.add('dark');
document.querySelector('#fontUp').onclick=()=>{baseFont=Math.min(24,baseFont+1);document.querySelector('#prose').style.fontSize=baseFont+'px'};document.querySelector('#fontDown').onclick=()=>{baseFont=Math.max(14,baseFont-1);document.querySelector('#prose').style.fontSize=baseFont+'px'};
document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');search.addEventListener('input',()=>{let q=search.value.trim().toLowerCase();sideToc.querySelectorAll('button').forEach((b,i)=>b.style.display=(CHAPTERS[i].title.toLowerCase().includes(q)||label(CHAPTERS[i]).includes(q))?'':'none')});
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('reading');document.querySelector('#sidebar').classList.remove('open');if(document.fullscreenElement)document.exitFullscreen();return}if(current<0||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
const reader=document.querySelector('#readerWrap');reader.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});reader.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)go(current+(dx<0?1:-1))},{passive:true});
window.addEventListener('scroll',()=>{setProgress();if(current>=0){clearTimeout(window._saveTimer);window._saveTimer=setTimeout(save,180)}},{passive:true});window.addEventListener('resize',setProgress);
build();let hash=location.hash.slice(1),fromHash=CHAPTERS.findIndex(c=>c.id===hash);if(fromHash>=0)go(fromHash);else{try{const p=JSON.parse(localStorage.getItem('ebook-7880e1671f-progress'));if(p&&p.id>=0){document.querySelector('#continueBtn').textContent=`继续阅读：${label(CHAPTERS[p.id])}`}}catch(e){}}
</script></body></html>
