本心越来越远。</p>\n<hr>\n<h3>5️⃣</h3>\n<h4>【原句】</h4>\n<p>“汝妄自造，非菩提咎。”</p>\n<h4>【白话解释】</h4>\n<p>问题不是大道有错。</p>\n<p>而是你自己的妄想在制造偏差。</p>\n<h4>【深层含义】</h4>\n<p>佛陀把责任重新交回修行者：</p>\n<h2>👉 解脱失败，不是世界的问题。</h2>\n<p>而是：</p>\n<ul><li>贪未断</li><li>慢未断</li><li>欲未断</li><li>我执未断</li></ul>\n<p>却提前“认定自己已经觉悟”。</p>\n<hr>\n<h2>三、落地指南（最关键模块）</h2>\n<hr>\n<h3>（1）修什么（本卷修行核心）</h3>\n<p>这一卷真正修的：</p>\n<h2>👉 不是境界。</h2>\n<p>而是：</p>\n<h2>👉 “不被境界劫持的觉察系统”。</h2>\n<p>真正的修行能力：</p>\n<p>不是看到什么。</p>\n<p>而是：</p>\n<h2>👉 看见之后，仍不执着。</h2>\n<hr>\n<h3>（2）5条具体修行指引</h3>\n<hr>\n<h4>① 出现任何“特殊体验”，先降级解释</h4>\n<p>比如：</p>\n<ul><li>梦境异常</li><li>能量感</li><li>同步事件</li><li>强烈感应</li><li>情绪爆发</li><li>光感声音</li></ul>\n<p>第一反应不要是：</p>\n<p>“我开悟了。”</p>\n<p>而是：</p>\n<h2>👉 “这是心识现象。”</h2>\n<p>先去魅。</p>\n<p>再观察。</p>\n<hr>\n<h4>② 一旦开始觉得“自己特殊”，立刻警觉</h4>\n<p>当你出现：</p>\n<ul><li>“别人不懂我”</li><li>“我层次更高”</li><li>“我已经超越众生”</li><li>“我是真修行人”</li></ul>\n<p>说明：</p>\n<h2>👉 我执正在借修行重生。</h2>\n<p>这是极危险信号。</p>\n<hr>\n<h4>③ 不要把“情绪强烈”误认为“慈悲”</h4>\n<p>很多人：</p>\n<ul><li>哭泣</li><li>激动</li><li>悲悯泛滥</li></ul>\n<p>就以为自己“大悲心开启”。</p>\n<p>佛陀直接指出：</p>\n<p>这可能只是：</p>\n<h2>👉 受阴失衡。</h2>\n<p><span style=\"color: #E00;\">真正慈悲：</span></p>\n<p><span style=\"color: #E00;\">稳定、清明、持续。</span></p>\n<p>不是情绪洪水。</p>\n<hr>\n<h4>④ <span style=\"color: #E00;\">永远保留“自我校验机制”</span></h4>\n<p><span style=\"color: #E00;\">定期问自己：</span></p>\n<ul><li><span style=\"color: #E00;\">我是不是越来越真实？</span></li><li><span style=\"color: #E00;\">我是不是越来越谦卑？</span></li><li><span style=\"color: #E00;\">我是不是越来越稳定？</span></li><li><span style=\"color: #E00;\">我是不是越来越少执着？</span></li><li><span style=\"color: #E00;\">我是不是越来越不需要证明？</span></li></ul>\n<p>如果相反：</p>\n<p>说明：</p>\n<h2>👉 修行正在反向强化人格。</h2>\n<hr>\n<h4>⑤ <span style=\"color: #E00;\">不追求“成为谁”，只回到觉知本身</span></h4>\n<p>修行最危险的一步：</p>\n<p>就是：</p>\n<h2>👉 把“觉醒”变成身份。</h2>\n<p>一旦你开始：</p>\n<ul><li>扮演觉者</li><li>扮演导师</li><li>扮演高人</li></ul>\n<p>系统已经偏了。</p>\n<p>真正的三摩地：</p>\n<p>不是“变成特殊的人”。</p>\n<p>而是：</p>\n<h2>👉 不再制造“我是谁”的幻觉。</h2>\n<hr>\n<h3>（3）自检问题（极关键）</h3>\n<hr>\n<h4>1. 我修行，是为了真解脱，还是为了获得“高级身份”？</h4>\n<hr>\n<h4>2. 我是否越来越需要别人认可我的“觉悟”？</h4>\n<hr>\n<h4>3. 我是否把某些体验，过度神圣化？</h4>\n<hr>\n<h4>4. 我是否正在用“空性”“自由”“觉醒”合理化欲望？</h4>\n<hr>\n<h4>5. 我修行之后，是更稳定了，还是更极端了？</h4>\n<hr>\n<h2>结语（系统定位）</h2>\n<p>《楞严经》第九卷，</p>\n<p>本质上是：</p>\n<h2>👉 整部《楞严经》的“修行安全系统”。</h2>\n<p>前面几卷，</p>\n<p>在建立：</p>\n<ul><li>世界观</li><li>心识观</li><li>轮回机制</li><li>修行路径</li></ul>\n<p>而这一卷开始处理：</p>\n<h2>👉 修行中的“系统污染”。</h2>\n<p>佛陀真正揭示的是：</p>\n<blockquote><p>修行最大的危险，  从来不是烦恼。</p></blockquote>\n<p>而是：</p>\n<h2>👉 “带着我执进入修行。”</h2>\n<p>因为普通欲望，</p>\n<p>只能让你做凡夫。</p>\n<p>但“修行化的我执”，</p>\n<p>会让人：</p>\n<ul><li>自封圣者</li><li>误导众生</li><li>反噬自身</li><li>堕入深层幻觉</li></ul>\n<p>所以这一卷解决的根本问题是：</p>\n<h2>👉 <span style=\"color: #E00;\">人如何在觉醒过程中，不被“觉醒幻觉”吞噬。</span></h2>\n<p>这也是为什么：</p>\n<p>第九卷，</p>\n<p>是整个《楞严经》中，</p>\n<p>最像“修行操作系统防火墙”的一卷。</p>\n<p>​</p>"},{"id":"section-010","kind":"volume","number":10,"title":"第10卷｜一、整卷大义（3个核心系统）","html":"<p>##</p>\n<p><strong>《楞严经》卷十：真正可怕的，不是魔，而是“你以为自己已经觉悟了”</strong></p>\n<h3>副标题</h3>\n<p><strong>这一卷真正揭开的，是修行后期最隐蔽的“认知系统污染”</strong></p>\n<hr>\n<h2>开篇三段逻辑对位</h2>\n<p>前九卷，《楞严经》一直在做一件事：不断拆掉众生对“世界”“身体”“心念”“认知”的错误认同。从色阴、受阴、想到行阴，再到识阴，佛陀不是在讲玄学，而是在逐层拆除“意识系统”的伪装层。</p>\n<p>但问题在于：越往深处修，危险越大。因为低层欲望容易识别，高层执着却会伪装成“真理”。一个人最容易迷失的时候，不是贪欲炽盛时，而是开始接触“清净感”“空性”“觉知”“灵性体验”之后。</p>\n<p>所以卷十真正解决的问题是：</p>\n<blockquote><p><strong>为什么很多修行人越修越偏？</strong>  为什么有人明明已经进入高阶定境，却最终落入外道、狂解、自我神化、断灭空亡，甚至“自认成佛”？</p></blockquote>\n<p>这一卷给出的答案是：</p>\n<blockquote><p><strong>因为“识心”极其善于伪装。</strong>  它会把“局部体验”伪装成“终极真理”，把“阶段性感应”伪装成“圆满觉悟”。</p></blockquote>\n<p>因此这一卷，本质是在建立：</p>\n<blockquote><p><strong>一套“觉醒过程中的防错系统”。</strong></p></blockquote>\n<hr>\n<h2>一、整卷大义（3个核心系统）</h2>\n<hr>\n<h3>1️⃣ 修行最大的危险，不是烦恼，而是“把阶段误认为终点”</h3>\n<p>卷十反复揭示：</p>\n<p>很多人不是败给欲望。</p>\n<p>而是败给：</p>\n<ul><li>一点清净</li><li>一点空感</li><li>一点神通</li><li>一点觉知</li><li>一点能量体验</li><li>一点“宇宙合一感”</li></ul>\n<p>于是：</p>\n<ul><li>把“过程”当结果</li><li>把“体验”当真理</li><li>把“境界”当觉悟</li><li>把“自我扩大”当成佛性</li></ul>\n<p>这就是：</p>\n<blockquote><p><strong>识阴最深层的骗局。</strong></p></blockquote>\n<p>因为<span style=\"color: #E00;\">识阴最大的能力，就是：</span></p>\n<blockquote><p><strong><span style=\"color: #E00;\">“解释一切”。</span></strong></p></blockquote>\n<p>它甚至可以利用“佛法语言”继续强化自我。</p>\n<hr>\n<h3>2️⃣ 一切外道，本质都是“意识系统卡死”</h3>\n<p>佛陀在这一卷中列出大量外道：</p>\n<ul><li>无因论</li><li>常见</li><li>断见</li><li>有边无边</li><li>空亡论</li><li>长生论</li><li>五现涅槃</li><li>死后有无</li><li>万物有情</li><li>自我遍满宇宙……</li></ul>\n<p>这些看似复杂。</p>\n<p>但底层只有一种东西：</p>\n<blockquote><p><strong>意识在某一个认知节点“冻结”了。</strong></p></blockquote>\n<p>即：</p>\n<ul><li>看见局部规律</li><li>获得局部体验</li><li>然后停止继续穿透</li></ul>\n<p>于是：</p>\n<p>系统从“流动觉察”</p>\n<p>变成“固定信念”。</p>\n<p>所以佛陀真正反对的，不是某个观点。</p>\n<p>而是：</p>\n<blockquote><p><strong>“把任何观点绝对化”。</strong></p></blockquote>\n<p>因为一旦绝对化：</p>\n<p>识心立刻重新生成“我执”。</p>\n<hr>\n<h3>3️⃣ 五阴不是五种东西，而是“五层妄想算法”</h3>\n<p>卷末佛陀第一次系统解释：</p>\n<p>五阴本质是什么。</p>\n<p>答案极其震撼：</p>\n<blockquote><p><span style=\"color: #E00;\">五阴，本质都是“妄想”。</span></p></blockquote>\n<p>而且是五层越来越细的妄想结构：</p>\n<hr>\n<h4><span style=\"color: #E00;\">色阴</span></h4>\n<p><span style=\"color: #E00;\">“坚固第一妄想”</span></p>\n<p><span style=\"color: #E00;\">你以为身体真实存在。</span></p>\n<hr>\n<h4><span style=\"color: #E00;\">受阴</span></h4>\n<p><span style=\"color: #E00;\">“虚明第二妄想”</span></p>\n<p><span style=\"color: #E00;\">你以为苦乐感受是真实自我。</span></p>\n<hr>\n<h4><span style=\"color: #E00;\">想阴</span></h4>\n<p><span style=\"color: #E00;\">“融通第三妄想”</span></p>\n<p><span style=\"color: #E00;\">你以为念头、记忆、梦境是真实意识。</span></p>\n<hr>\n<h4><span style=\"color: #E00;\">行阴</span></h4>\n<p><span style=\"color: #E00;\">“幽隐第四妄想”</span></p>\n<p><span style=\"color: #E00;\">你以为生命流动、人格延续是真实存在。</span></p>\n<hr>\n<h4><span style=\"color: #E00;\">识阴</span></h4>\n<p><span style=\"color: #E00;\">“第五颠倒细微精想”</span></p>\n<p><span style=\"color: #E00;\">你甚至把“觉知本身”执成真实主体。</span></p>\n<hr>\n<p>这意味着：</p>\n<blockquote><p>众生并不是“看见世界”。</p></blockquote>\n<p>而是在：</p>\n<blockquote><p><strong>五层妄想过滤器里解释世界。</strong></p></blockquote>\n<p>这就是整部《楞严经》最核心的系统论。</p>\n<hr>\n<h2>二、重点金句（结构化拆解）</h2>\n<hr>\n<h3>金句一</h3>\n<h4>【原句】</h4>\n<p>“逢此现前，以迷为解，自言登圣，大妄语成。”</p>\n<hr>\n<h4>【白话解释】</h4>\n<p>很多人只是出现一点特殊体验，</p>\n<p>就以为自己开悟、证道、成佛。</p>\n<p>其实只是“误把幻觉当觉悟”。</p>\n<hr>\n<h4>【深层含义】</h4>\n<p>真正危险的：</p>\n<p>不是无知。</p>\n<p>而是：</p>\n<blockquote><p><strong>“错误地确信自己已经知道。”</strong></p></blockquote>\n<p>现代社会大量问题都来自这里：</p>\n<ul><li>情绪即真理</li><li>感觉即事实</li><li>自我认知即宇宙真相</li></ul>\n<p>于是：</p>\n<p>人会把局部经验神圣化。</p>\n<p>最终彻底失去校正能力。</p>\n<hr>\n<h3>金句二</h3>\n<h4>【原句】</h4>\n<p>“迷有漏天，作无为解。”</p>\n<hr>\n<h4>【白话解释】</h4>\n<p>把暂时舒服、清净、安稳的状态，</p>\n<p>误认为究竟解脱。</p>\n<hr>\n<h4>【深层含义】</h4>\n<p>现代人最容易掉进的陷阱：</p>\n<blockquote><p>把“舒服”误认为“自由”。</p></blockquote>\n<p>比如：</p>\n<ul><li>不焦虑了 → 以为觉悟</li><li>情绪稳定 → 以为解脱</li><li>有能量感 → 以为开悟</li><li>能独处 → 以为空性</li></ul>\n<p>但佛陀指出：</p>\n<blockquote><p><span style=\"color: #E00;\">一切“依赖条件存在”的安稳，</span>  <span style=\"color: #E00;\">都不是究竟。</span></p></blockquote>\n<p>因为：</p>\n<p><span style=\"color: #E00;\">只要条件变化，</span></p>\n<p><span style=\"color: #E00;\">系统仍会崩塌。</span></p>\n<hr>\n<h3>金句三</h3>\n<h4>【原句】</h4>\n<p>“于未足中生满足证。”</p>\n<hr>\n<h4>【白话解释】</h4>\n<p>还没真正走到终点，</p>\n<p>却提前宣布自己圆满。</p>\n<hr>\n<h4>【深层含义】</h4>\n<p>这是人类成长最大的系统漏洞。</p>\n<p>无论：</p>\n<ul><li>修行</li><li>财富</li><li>学习</li><li>创业</li><li>关系</li></ul>\n<p>最危险阶段：</p>\n<p>都不是低谷。</p>\n<p>而是：</p>\n<blockquote><p>“半懂不懂时的自我高潮。”</p></blockquote>\n<p>因为：</p>\n<p>此时系统停止迭代。</p>\n<hr>\n<h3>金句四</h3>\n<h4>【原句】</h4>\n<p>“五阴本因，同是妄想。”</p>\n<hr>\n<h4>【白话解释】</h4>\n<p>你的身体、感受、念头、人格、意识，</p>\n<p>本质都不是最终真实。</p>\n<hr>\n<h4>【深层含义】</h4>\n<p>佛陀不是否定世界。</p>\n<p>而是在说：</p>\n<blockquote><p>你现在“理解世界的方式”，本身就是错的。</p></blockquote>\n<p>众生的问题不是：</p>\n<p>“看不见真相”。</p>\n<p>而是：</p>\n<blockquote><p>“被自己的认知结构困住了。”</p></blockquote>\n<hr>\n<h2>三、落地指南（核心模块）</h2>\n<hr>\n<h3>（1）修什么？</h3>\n<p>这一卷真正修的：</p>\n<blockquote><p>不是“境界”。</p></blockquote>\n<p>而是：</p>\n<blockquote><p><strong>“对任何境界都不执著的能力。”</strong></p></blockquote>\n<p>换句话说：</p>\n<p>修的是：</p>\n<blockquote><p><strong>认知系统的“反固化能力”。</strong></p></blockquote>\n<hr>\n<h3>（2）5条具体修行指引</h3>\n<hr>\n<h4>① 出现任何“特殊体验”，先延迟定义</h4>\n<p>比如：</p>\n<ul><li>极度清净</li><li>强烈能量</li><li>梦境感应</li><li>灵感爆发</li><li>巨大空性体验</li></ul>\n<p>不要立刻解释。</p>\n<p>先观察。</p>\n<p>因为：</p>\n<blockquote><p>识阴最喜欢“抢答”。</p></blockquote>\n<hr>\n<h4>② 一旦开始“自认高人”，立刻反观</h4>\n<p>只要出现：</p>\n<ul><li>“别人不懂我”</li><li>“我已经看透”</li><li>“我比普通人高”</li><li>“我快开悟了”</li></ul>\n<p>说明：</p>\n<blockquote><p>“我执”已经换了更高级外衣。</p></blockquote>\n<hr>\n<h4>③ 不迷恋状态，而观察“依赖”</h4>\n<p>真正重点不是：</p>\n<p>“有没有清净感”。</p>\n<p>而是：</p>\n<blockquote><p>“你是否开始依赖某种状态？”</p></blockquote>\n<p>因为：</p>\n<p>凡依赖，</p>\n<p>必束缚。</p>\n<hr>\n<h4>④ 不把任何观点绝对化</h4>\n<p>包括：</p>\n<ul><li>佛法理解</li><li>空性理解</li><li>灵性体验</li><li>修行模型</li></ul>\n<p>都只能：</p>\n<blockquote><p>暂时使用。</p></blockquote>\n<p>不能：</p>\n<blockquote><p>永久执取。</p></blockquote>\n<p>否则：</p>\n<p>“法”也会变成执念。</p>\n<hr>\n<h4>⑤ 观察“谁在解释一切”</h4>\n<p>修行后期最关键的问题：</p>\n<p>不是：</p>\n<p>“你看见了什么”。</p>\n<p>而是：</p>\n<blockquote><p>“是谁在解释这些体验？”</p></blockquote>\n<p>因为：</p>\n<p>识阴最深层的问题，</p>\n<p>是：</p>\n<blockquote><p>“解释者本身”。</p></blockquote>\n<hr>\n<h3>（3）自检问题</h3>\n<hr>\n<h4>1. 我是否开始把自己的体验神圣化？</h4>\n<hr>\n<h4>2. 我是否越来越无法接受别人质疑？</h4>\n<hr>\n<h4>3. 我是否已经把某种状态，当成最终答案？</h4>\n<hr>\n<h4>4. 我是否把“舒服”“安静”“能量感”误认为觉悟？</h4>\n<hr>\n<h4>5. 我是否正在用“修行身份”强化新的自我？</h4>\n<hr>\n<h2>结语（系统定位）</h2>\n<p>卷十，是整部《楞严经》最锋利的一卷。</p>\n<p>因为前面都在破：</p>\n<ul><li>世界</li><li>身体</li><li>感受</li><li>妄念</li></ul>\n<p>而这一卷开始破：</p>\n<blockquote><p>“觉悟本身的幻觉。”</p></blockquote>\n<p>它真正解决的问题是：</p>\n<blockquote><p>为什么人越接近真相，  越容易制造“更高级的假我”。</p></blockquote>\n<p>所以这一卷本质上是：</p>\n<blockquote><p>整个觉醒系统里的“防伪模块”。</p></blockquote>\n<p>它告诉修行者：</p>\n<ul><li>不要执著低级欲望</li><li>更不要执著高级境界</li><li>不要执著凡夫身份</li><li>更不要执著“圣者身份”</li></ul>\n<p>因为：</p>\n<blockquote><p><span style=\"color: #E00;\">连“我在修行”这个念头，</span>  <span style=\"color: #E00;\">最后也必须被穿透。</span></p></blockquote>\n<p>这才是《楞严经》卷十真正恐怖、也真正伟大的地方。</p>"}];
const home=document.querySelector('#home'),readerWrap=document.querySelector('#readerWrap'),sideToc=document.querySelector('#sideToc'),search=document.querySelector('#search');let current=-1,baseFont=17,touchX=0,touchY=0;
const label=c=>c.kind==='volume'?`第${c.number}卷`:c.kind==='summary'?'总结':`第${c.number}章`;
function save(){try{localStorage.setItem('ebook-cf2babe60f-progress',JSON.stringify({id:current,scroll:window.scrollY}))}catch(e){}}
function setProgress(){let max=document.documentElement.scrollHeight-innerHeight;document.querySelector('#progressBar').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}
function go(i,saveScroll=false){if(i<0){current=-1;readerWrap.classList.add('hidden');home.classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0);save();return}i=Math.max(0,Math.min(CHAPTERS.length-1,i));current=i;const c=CHAPTERS[i];home.classList.add('hidden');readerWrap.classList.remove('hidden');document.querySelector('#chapterKicker').textContent=c.kind==='volume'?`${document.title.replace(' · 电子书','')} · ${label(c)}`:c.kind==='summary'?`${document.title.replace(' · 电子书','')} · 全书回顾`:`${document.title.replace(' · 电子书','')} · ${label(c)}`;document.querySelector('#chapterTitle').textContent=c.title;document.querySelector('#prose').innerHTML=c.html;document.querySelector('#prevBtn').disabled=i===0;document.querySelector('#nextBtn').disabled=i===CHAPTERS.length-1;document.querySelectorAll('[data-chapter]').forEach(x=>x.classList.toggle('active',Number(x.dataset.chapter)===i));history.replaceState(null,'',`#${c.id}`);document.querySelector('#sidebar').classList.remove('open');window.scrollTo(0,0);if(saveScroll){const y=saveScroll;window.scrollTo(0,y)}save();setProgress()}
function item(c,i,cls=''){return `<button class="${cls}" data-chapter="${i}"><b>${c.kind==='summary'?'末':String(c.number).padStart(2,'0')}</b><span>${c.title}</span></button>`}
function build(){sideToc.innerHTML=CHAPTERS.map((c,i)=>item(c,i)).join('');home.innerHTML=`<div class="hero"><div class="seal">阅</div><h1>楞严经</h1><div class="sub">10 篇 · 网页电子书</div><div class="hero-rule"></div><p>从目录选择篇目开始阅读。阅读进度会保存在当前设备的浏览器中，方便下次接续。</p><div class="home-actions"><button class="primary" id="continueBtn">继续上次阅读</button><button class="action" id="startBtn">从第一卷开始</button></div></div><section class="contents"><h2>卷目目录</h2><div class="toc-grid">${CHAPTERS.map((c,i)=>item(c,i,'toc-card')).join('')}</div></section>`;document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.chapter))));document.querySelector('#startBtn').onclick=()=>go(0);document.querySelector('#continueBtn').onclick=resume}
function resume(){try{const p=JSON.parse(localStorage.getItem('ebook-cf2babe60f-progress'));if(p&&p.id>=0){go(p.id);setTimeout(()=>window.scrollTo(0,p.scroll||0),80);return}}catch(e){}go(0)}
document.querySelector('#prevBtn').onclick=()=>go(current-1);document.querySelector('#nextBtn').onclick=()=>go(current+1);document.querySelector('#homeBtn').onclick=()=>go(-1);
document.querySelector('#fullBtn').onclick=async()=>{document.body.classList.add('reading');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('已切换阅读布局')}document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('reading');document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.querySelector('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('ebook-cf2babe60f-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('ebook-cf2babe60f-dark')==='1'||(localStorage.getItem('ebook-cf2babe60f-dark')===null&&document.body.dataset.template==='5'))document.body.classList.add('dark');
document.querySelector('#fontUp').onclick=()=>{baseFont=Math.min(24,baseFont+1);document.querySelector('#prose').style.fontSize=baseFont+'px'};document.querySelector('#fontDown').onclick=()=>{baseFont=Math.max(14,baseFont-1);document.querySelector('#prose').style.fontSize=baseFont+'px'};
document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');search.addEventListener('input',()=>{let q=search.value.trim().toLowerCase();sideToc.querySelectorAll('button').forEach((b,i)=>b.style.display=(CHAPTERS[i].title.toLowerCase().includes(q)||label(CHAPTERS[i]).includes(q))?'':'none')});
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('reading');document.querySelector('#sidebar').classList.remove('open');if(document.fullscreenElement)document.exitFullscreen();return}if(current<0||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
const reader=document.querySelector('#readerWrap');reader.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});reader.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)go(current+(dx<0?1:-1))},{passive:true});
window.addEventListener('scroll',()=>{setProgress();if(current>=0){clearTimeout(window._saveTimer);window._saveTimer=setTimeout(save,180)}},{passive:true});window.addEventListener('resize',setProgress);
build();let hash=location.hash.slice(1),fromHash=CHAPTERS.findIndex(c=>c.id===hash);if(fromHash>=0)go(fromHash);else{try{const p=JSON.parse(localStorage.getItem('ebook-cf2babe60f-progress'));if(p&&p.id>=0){document.querySelector('#continueBtn').textContent=`继续阅读：${label(CHAPTERS[p.id])}`}}catch(e){}}
</script></body></html>
