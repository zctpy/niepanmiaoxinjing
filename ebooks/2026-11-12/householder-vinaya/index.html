\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">解脱</span></p>\n<p>你最近十八天守色戒，虽然欲念翻腾，但实际上已经进入了这个阶段。</p>\n<p>因为：</p>\n<p>行为已经开始收摄。</p>\n<p>习气开始反扑。</p>\n<p>这正是戒力开始发挥作用的表现。</p>\n<p>很多人以为：</p>\n<p>欲望变大了。</p>\n<p>修坏了。</p>\n<p>实际上恰恰相反。</p>\n<p>以前欲望一直存在，只是随顺它而已。</p>\n<p>现在开始持戒。</p>\n<p>第一次看见它。</p>\n<p>所以感觉特别强烈。</p>\n<p>这正是《梵网经》说的：</p>\n<blockquote><p>戒光从口出。</p></blockquote>\n<p>戒开始照见心里的黑暗。</p>\n<p>不是黑暗变多了。</p>\n<p>而是灯亮了。</p>\n<hr>"},{"id":"section-078","kind":"summary","number":78,"title":"这一卷的核心总结","html":"<p>整卷《梵网经心地品》序分，其实就在讲六句话：</p>\n<p>① <span style=\"color: var(--brand<em>color</em>green_primary);\">戒是成佛的起点。</span></p>\n<p>② 戒不是管行为，而是治理心地。</p>\n<p>③ 大乘戒核心是三聚净戒：</p>\n<ul><li>摄律仪戒</li><li>摄善法戒</li><li>摄众生戒</li></ul>\n<p>④ 一切众生皆有佛性，但持戒才能让佛性显现。</p>\n<p>⑤ 一切有心者皆可受菩萨戒，不分贵贱贤愚。</p>\n<p>⑥ <span style=\"color: var(--brand<em>color</em>green_primary);\">孝顺是菩萨戒总纲，戒定慧皆从孝中展开。</span></p>\n<p>所以蕅益大师最后归结为一句：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">「此戒乃复其本净之体，非有加于本性之外也。」</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒不是给你增加一个佛性。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是帮助你恢复本来就有的佛性。</span></p>\n<p>这正是《梵网经》与声闻戒最大的不同：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">声闻戒重“止恶”。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">菩萨戒不仅止恶，更要：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">开显佛性，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">利益众生，</span>  <span style=\"color: var(--brand<em>color</em>green_primary);\">圆成佛道。</span></p></blockquote>\n<p>​</p>\n<p>​</p>"},{"id":"section-079","kind":"chapter","number":79,"title":"《梵网经菩萨戒》十重戒详细拆解","html":"<p>这一段是《梵网经菩萨戒本》的核心部分。</p>\n<p>前面《梵网经》讲菩萨发心、佛性、众生平等。</p>\n<p>到了这里，开始落到实际修行。</p>\n<p>因为：</p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">没有戒，慈悲容易变成情绪；</span></strong></p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">没有戒，智慧容易变成空谈；</span></strong></p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">没有戒，发心容易变成幻想。</span></strong></p>\n<p>所以佛直接建立菩萨修行的根本框架：</p>\n<blockquote><p>十重戒，是菩萨道的地基。</p></blockquote>\n<hr>"},{"id":"section-080","kind":"chapter","number":80,"title":"一、十重戒的总体精神","html":"<p>佛说：</p>\n<blockquote><p>若受菩萨戒不诵此戒者，非菩萨、非佛种子。</p></blockquote>\n<p>意思不是不会背诵经文就不是菩萨。</p>\n<p>而是：</p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">不懂这十条戒的精神，不以此为人生原则，就不是真正在走菩萨道。</span></strong></p>\n<p>因为：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">菩萨戒不是约束行为。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是在保护佛性</span>。</p>\n<p>所以蕅益大师说：</p>\n<blockquote><p>非菩萨者，失现在大乘之名。  非佛种者，失未来成佛之因。</p></blockquote>\n<hr>"},{"id":"section-081","kind":"chapter","number":81,"title":"十戒对应十种根本烦恼","html":"<p>| <strong><span style=\"color: var(--brand<em>color</em>green<em>primary);\">戒</span></strong> | <strong><span style=\"color: var(--brand</em>color<em>green</em>primary);\">对治</span></strong> | | ------------------------------------------------------------------- | -------------------------------------------------------------------- | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">杀</span>     | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">瞋恨</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">盗</span>     | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">贪欲</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">淫</span>     | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">爱染</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">妄语</span>    | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">欺诳</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">酤酒</span>    | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">愚痴</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">说四众过</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">毁坏僧团</span>   | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">自赞毁他</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">我慢</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">悭惜加毁</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">吝啬</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">瞋心不受悔</span> | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">怨结</span>     | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">谤三宝</span>   | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">邪见</span>     |</p>\n<p>你会发现：</p>\n<p>十戒不是外在规范。</p>\n<p>而是直接针对：</p>\n<p><strong>贪、瞋、痴、慢、疑、邪见。</strong></p>\n<hr>"},{"id":"section-082","kind":"chapter","number":82,"title":"第一重戒：杀戒","html":"<p>佛把杀戒放第一。</p>\n<p>因为：</p>\n<p>声闻道重解脱。</p>\n<p>菩萨道重慈悲。</p>\n<p>所以大士以慈悲为命根。</p>\n<p>杀生就是毁坏慈悲心。</p>\n<p>故：</p>\n<blockquote><p>杀者，慈悲之敌。</p></blockquote>\n<hr>\n<h3>杀戒真正保护什么？</h3>\n<p>很多人以为：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">杀戒只是不能杀人。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">其实核心是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">不忍众生苦。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛说：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">应起常住慈悲心、孝顺心。</span></p></blockquote>\n<p>什么叫孝顺心？</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">大乘认为：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">一切众生皆曾为父母。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">故：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">杀众生就是伤害过去父母。</span></p>\n<hr>\n<h3>杀业成立四条件</h3>\n<h4>第一</h4>\n<p>是众生</p>\n<h4>第二</h4>\n<p>知道是众生</p>\n<h4>第三</h4>\n<p>有杀心</p>\n<h4>第四</h4>\n<p>命断</p>\n<p>四缘具足：</p>\n<p>重罪成立。</p>\n<hr>\n<h3>最重要的一点</h3>\n<p>大乘有方便开缘。</p>\n<p>例如：</p>\n<p>一个强盗准备杀一船人。</p>\n<p>菩萨为救众生。</p>\n<p>以大悲心杀一人。</p>\n<p>救千万人。</p>\n<p>此时：</p>\n<p>不是瞋恨。</p>\n<p>不是利益自己。</p>\n<p>而是代众生受苦。</p>\n<p>故不犯。</p>\n<p>但是：</p>\n<p>凡夫千万不能模仿。</p>\n<p>因为：</p>\n<p>99%的人所谓替天行道，</p>\n<p>其实是自己的瞋心。</p>\n<hr>"},{"id":"section-083","kind":"chapter","number":83,"title":"第二重戒：盗戒","html":"<p>盗戒核心不是钱。</p>\n<p>而是：</p>\n<p><strong>尊重众生因缘。</strong></p>\n<p>佛说：</p>\n<blockquote><p>一针一草不得故盗</p></blockquote>\n<p>为什么这么严？</p>\n<p>因为：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">偷盗本质是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">不劳而获。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">其根源是贪。</span></p>\n<hr>\n<h3>盗业五缘</h3>\n<p>①有主物</p>\n<p>②知道有主</p>\n<p>③起盗心</p>\n<p>④价值达到标准</p>\n<p>⑤离开原处</p>\n<p>五缘具足。</p>\n<p>重罪成立。</p>\n<hr>\n<h3>盗戒深层含义</h3>\n<p>蕅益大师说：</p>\n<blockquote><p>菩萨本应与人财物，反而取人财物。</p></blockquote>\n<p>这句话极厉害。</p>\n<p>普通人：</p>\n<p>向外拿。</p>\n<p>菩萨：</p>\n<p>向外给。</p>\n<p>方向完全相反。</p>\n<hr>"},{"id":"section-084","kind":"chapter","number":84,"title":"第三重戒：淫戒","html":"<p>这里最容易被误解。</p>\n<p>佛教并非反对婚姻。</p>\n<p>而是指出：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">淫欲是轮回发动机。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以云：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">婬为生死根本。</span></p></blockquote>\n<hr>\n<h3>为什么排第三？</h3>\n<p>因为：</p>\n<p>杀害众生身体。</p>\n<p>盗害众生财产。</p>\n<p>淫害众生慧命。</p>\n<p>所以列第三。</p>\n<hr>\n<h3>大乘标准</h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">出家：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">完全断淫。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">在家：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">禁止邪淫。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">进一步：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">鼓励减少欲望。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">提升清净心。</span></p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">淫欲的本质</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">并非身体问题。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">执著身体。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">把快乐寄托在感官。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">于是不断轮回。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以佛教真正断的是：</span></p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">贪爱。</span></strong></p>\n<hr>"},{"id":"section-085","kind":"chapter","number":85,"title":"第四重戒：妄语戒","html":"<p>佛为什么把妄语列入重戒？</p>\n<p>因为：</p>\n<p>语言创造世界。</p>\n<p>一句谎言。</p>\n<p>可能毁掉一个人的一生。</p>\n<hr>\n<h3>大妄语最重</h3>\n<p>什么叫大妄语？</p>\n<p>例如：</p>\n<p>未证言证。</p>\n<p>未得言得。</p>\n<p>没有开悟说开悟。</p>\n<p>没有神通说神通。</p>\n<p>没有证果说证果。</p>\n<hr>\n<h3>为什么这么严重？</h3>\n<p>因为：</p>\n<p>欺骗的不只是别人。</p>\n<p>而是众生慧命。</p>\n<p>故名：</p>\n<blockquote><p>欺凡罔圣。</p></blockquote>\n<hr>\n<h3>修行人的危险</h3>\n<p>很多人：</p>\n<p>读几本经。</p>\n<p>有一点感应。</p>\n<p>有几个梦境。</p>\n<p>就认为自己开悟。</p>\n<p>这是佛特别警惕的。</p>\n<hr>"},{"id":"section-086","kind":"chapter","number":86,"title":"第五重戒：酤酒戒","html":"<p>注意：</p>\n<p>这里不是饮酒。</p>\n<p>而是卖酒。</p>\n<hr>\n<h3>为什么卖酒比喝酒重？</h3>\n<p>因为：</p>\n<p>自己喝酒。</p>\n<p>害一个人。</p>\n<p>卖酒。</p>\n<p>害无数人。</p>\n<p>故云：</p>\n<blockquote><p>酒是无明之药。</p></blockquote>\n<hr>\n<h3>酒最大的过失</h3>\n<p>不是伤身体。</p>\n<p>而是：</p>\n<p>毁智慧。</p>\n<p>所以菩萨应给众生智慧。</p>\n<p>而不是制造愚痴。</p>\n<hr>"},{"id":"section-087","kind":"chapter","number":87,"title":"第六重戒：说四众过","html":"<p>这条非常重要。</p>\n<p>尤其现代网络时代。</p>\n<hr>\n<h3>什么叫说四众过？</h3>\n<p>公开传播：</p>\n<p>比丘</p>\n<p>比丘尼</p>\n<p>出家菩萨</p>\n<p>在家菩萨</p>\n<p>的过失。</p>\n<hr>\n<h3>为什么重？</h3>\n<p>因为：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">毁坏僧团信心。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">伤害众生善根。</span></p>\n<hr>\n<h3>是否永远不能说？</h3>\n<p>不是。</p>\n<p>经中明确开缘：</p>\n<h4>僧团处理</h4>\n<h4>教化众生</h4>\n<h4>防止大众受害</h4>\n<h4>维护佛法</h4>\n<p>可以说。</p>\n<p>但不能：</p>\n<p>出于怨恨。</p>\n<p>出于报复。</p>\n<p>出于看热闹。</p>\n<hr>"},{"id":"section-088","kind":"chapter","number":88,"title":"第七重戒：自赞毁他","html":"<p>这条几乎贯穿整个互联网时代。</p>\n<hr>\n<h3>本质是什么？</h3>\n<p>争名夺利。</p>\n<p>通过踩别人抬高自己。</p>\n<p>佛说：</p>\n<blockquote><p>恶事向自己  好事与他人</p></blockquote>\n<p>这才是菩萨心。</p>\n<hr>\n<h3>现代表现</h3>\n<p>流量竞争</p>\n<p>宗派攻击</p>\n<p>同行互踩</p>\n<p>营销包装</p>\n<p>人格神化</p>\n<p>都容易落入此戒。</p>\n<hr>"},{"id":"section-089","kind":"chapter","number":89,"title":"第八重戒：悭惜加毁","html":"<p>两个字：</p>\n<p>不舍。</p>\n<hr>\n<h3>两种悭</h3>\n<h4>悭财</h4>\n<p>有钱不给。</p>\n<h4>悭法</h4>\n<p>知道不教。</p>\n<hr>\n<h3>菩萨最怕什么？</h3>\n<p>不是穷。</p>\n<p>不是苦。</p>\n<p>而是：</p>\n<p>见人求法而拒绝。</p>\n<p>见人求助而冷漠。</p>\n<hr>\n<h3>但有开缘</h3>\n<p>对方不适合听。</p>\n<p>会产生邪见。</p>\n<p>或者自己确实不会。</p>\n<p>都不犯。</p>\n<p>重点是：</p>\n<p>不能恶心拒绝。</p>\n<hr>"},{"id":"section-090","kind":"chapter","number":90,"title":"第九重戒：瞋心不受悔","html":"<p>这是最容易犯的一条。</p>\n<hr>\n<h3>什么叫不受悔？</h3>\n<p>别人认错：</p>\n<p>道歉：</p>\n<p>忏悔：</p>\n<p>你仍然不接受。</p>\n<p>持续怨恨。</p>\n<p>持续报复。</p>\n<p>持续冷战。</p>\n<hr>\n<h3>佛为什么重判？</h3>\n<p>因为：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">瞋恨最伤菩提心。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">一念瞋心起。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">百万障门开。</span></p>\n<hr>\n<h3>菩萨标准</h3>\n<p>不是没有原则。</p>\n<p>而是：</p>\n<p>原则处理完。</p>\n<p>内心放下。</p>\n<hr>"},{"id":"section-091","kind":"chapter","number":91,"title":"第十重戒：谤三宝","html":"<p>这是十戒最后一道防线。</p>\n<p>也是根本防线。</p>\n<hr>\n<h3>为什么最后讲？</h3>\n<p>前九戒坏行为。</p>\n<p>这一戒坏知见。</p>\n<p>行为错。</p>\n<p>还能改。</p>\n<p>知见错。</p>\n<p>整个方向都错。</p>\n<hr>\n<h3>什么叫谤三宝？</h3>\n<p>不仅是骂佛。</p>\n<p>更包括：</p>\n<p>否定因果。</p>\n<p>否定佛法。</p>\n<p>否定修行。</p>\n<p>否定解脱。</p>\n<p>毁坏众生信心。</p>\n<hr>\n<h3>最危险的形式</h3>\n<p>经中说：</p>\n<blockquote><p>相似佛法</p></blockquote>\n<p>最可怕。</p>\n<p>因为：</p>\n<p>外道不像佛法。</p>\n<p>容易识别。</p>\n<p>相似佛法最难识别。</p>\n<hr>"},{"id":"section-092","kind":"chapter","number":92,"title":"十重戒的整体结构","html":"<p>如果浓缩成一句话：</p>\n<p>| <strong>戒</strong> | <strong>保护什么</strong> | | ----- | -------- | | 杀     | 慈悲       | | 盗     | 布施       | | 淫     | 清净       | | 妄语    | 真实       | | 酤酒    | 智慧       | | 说过    | 和合       | | 自赞毁他  | 谦卑       | | 悭惜加毁  | 利他       | | 瞋心不受悔 | 宽恕       | | 谤三宝   | 正见       |</p>\n<p>所以十重戒不是十条规矩。</p>\n<p>而是十个佛性的守护门。</p>\n<hr>"},{"id":"section-093","kind":"chapter","number":93,"title":"对现代修行人的启示","html":"<p>你最近连续深入学习《十诵律》和《梵网经》，其实已经能看到一个非常明显的规律：</p>\n<p>《阿含经》重断恶。</p>\n<p>《十诵律》重规范。</p>\n<p>《梵网经》重发心。</p>\n<p>声闻戒问：</p>\n<blockquote><p>你做了没有？</p></blockquote>\n<p>菩萨戒问：</p>\n<blockquote><p>你为什么做？</p></blockquote>\n<p>同样一句话：</p>\n<p>可能不犯声闻戒。</p>\n<p>却已经犯菩萨戒。</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为菩萨戒真正监察的是：</span></p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">起心动念。</span></strong></p>\n<p>所以《梵网经》十重戒最后归结为一句话：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">慈悲为体，智慧为用，正见为根。</span></p></blockquote>\n<p>杀盗淫妄只是表面。</p>\n<p>真正守护的是这一颗未来成佛的心。</p>\n<p>这也正是蕅益大师反复强调的：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">菩萨戒者，佛性之护城河也。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">护住戒体，</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">其实就是护住自己的菩提心；</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">护住菩提心，</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">其实就是护住未来成佛的种子。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">​</span></p>\n<p>结合你目前的情况来看（长期学习《十诵律》《梵网经》，正在努力持淫戒，之前已经有过连续十几天乃至更长时间的实践，也反复观察过欲念习气），这一条戒对你来说确实是当前修行中的重点关口。</p>"},{"id":"section-094","kind":"chapter","number":94,"title":"《梵网经》淫戒核心拆解","html":"<p>很多人看到淫戒，注意力都放在行为上。</p>\n<p>实际上《梵网经》最重视的是：</p>\n<blockquote><p>婬因、婬緣、婬法、婬業。</p></blockquote>\n<p>这四个层次。</p>\n<hr>"},{"id":"section-095","kind":"chapter","number":95,"title":"第一层：婬因（根）","html":"<p>经文说：</p>\n<blockquote><p>婬因者，染污之心。</p></blockquote>\n<p>什么叫染污心？</p>\n<p>简单说：</p>\n<p><strong>把众生当作满足欲望的对象。</strong></p>\n<p>不是看到美女才叫淫心。</p>\n<p>你最近提到：</p>\n<ul><li>想刷短视频</li><li>想看动漫</li><li>想找刺激</li><li>想逃避现实</li></ul>\n<p>其实这里面已经有淫因。</p>\n<p>因为：</p>\n<p>淫欲本质不是性。</p>\n<p>而是：</p>\n<blockquote><p>贪求感官刺激。</p></blockquote>\n<p>所以《楞严经》说：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">淫心不除，尘不可出。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不是指身体。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">首先指的是：</span></p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">向外抓取快乐的习惯。</span></strong></p>\n<hr>"},{"id":"section-096","kind":"chapter","number":96,"title":"第二层：婬缘（助缘）","html":"<p>经文说：</p>\n<blockquote><p>瞻視隨逐等事。</p></blockquote>\n<p>这句话极厉害。</p>\n<p>很多人以为：</p>\n<p>没犯戒。</p>\n<p>实际上已经在培养犯戒的条件。</p>\n<p>例如：</p>\n<h3>第一类</h3>\n<p>反复看异性</p>\n<p>故意多看几眼</p>\n<p>回头再看</p>\n<p>脑中幻想</p>\n<hr>\n<h3>第二类</h3>\n<p>刷擦边视频</p>\n<p>美女直播</p>\n<p>短剧</p>\n<p>恋爱动漫</p>\n<p>后宫小说</p>\n<p>爽文</p>\n<hr>\n<h3>第三类</h3>\n<p>不断搜索相关内容</p>\n<p>不断点击推荐</p>\n<p>不断停留</p>\n<hr>\n<p>这些都属于：</p>\n<blockquote><p>婬緣</p></blockquote>\n<p>还没犯。</p>\n<p>但已经在浇水。</p>\n<hr>"},{"id":"section-097","kind":"chapter","number":97,"title":"第三层：婬法（具体方法）","html":"<p>经文说：</p>\n<blockquote><p>摩觸稱歎等事。</p></blockquote>\n<p>包括：</p>\n<ul><li>调情</li><li>暧昧</li><li>肢体接触</li><li>言语挑逗</li><li>语言幻想</li></ul>\n<p>很多人行为没犯。</p>\n<p>但已经天天练习婬法。</p>\n<p>这同样增长种子。</p>\n<hr>"},{"id":"section-098","kind":"chapter","number":98,"title":"第四层：婬业（结果）","html":"<p>经文说：</p>\n<blockquote><p>二根交接，入如胡麻許，即成婬罪。</p></blockquote>\n<p>这是最后一步。</p>\n<p>实际上佛教真正防的是前面三层。</p>\n<p>因为：</p>\n<p>走到第四层已经很难刹车。</p>\n<hr>"},{"id":"section-099","kind":"chapter","number":99,"title":"对你来说最危险的不是女人","html":"<p>而是手机</p>\n<p>仔细观察你最近的记录。</p>\n<p>你自己已经发现规律：</p>\n<p>欲念翻腾时：</p>\n<p>不是先找女人。</p>\n<p>而是：</p>\n<p>① 无聊</p>\n<p>↓</p>\n<p>② 刷手机</p>\n<p>↓</p>\n<p>③ 爽文动漫</p>\n<p>↓</p>\n<p>④ 大脑兴奋</p>\n<p>↓</p>\n<p>⑤ 淫念起来</p>\n<p>↓</p>\n<p>⑥ 开始幻想</p>\n<p>↓</p>\n<p>⑦ 失去观照</p>\n<p>这是非常典型的现代淫欲链条。</p>\n<p>所以你真正的敌人不是异性。</p>\n<p>而是：</p>\n<blockquote><p>刺激成瘾。</p></blockquote>\n<hr>"},{"id":"section-100","kind":"chapter","number":100,"title":"《梵网经》最重要的一句话","html":"<p>蕅益大师说：</p>\n<blockquote><p>婬為生死根本。</p></blockquote>\n<p>为什么？</p>\n<p>因为淫欲背后有三重执著：</p>\n<h3>第一</h3>\n<p>执著身体</p>\n<p>认为身体是真我。</p>\n<hr>\n<h3>第二</h3>\n<p>执著快乐</p>\n<p>认为快乐来自外境。</p>\n<hr>\n<h3>第三</h3>\n<p>执著未来</p>\n<p>想不断延续享受。</p>\n<hr>\n<p>这三种执著合起来：</p>\n<p>就是轮回发动机。</p>\n<hr>"},{"id":"section-101","kind":"chapter","number":101,"title":"你目前最该注意什么","html":"<p>根据你最近的状态。</p>\n<p>我认为不是担心犯重戒。</p>\n<p>而是：</p>\n<h3>第一关</h3>\n<p>下午时间段</p>\n<p>你已经多次提到：</p>\n<p>下午容易刷手机。</p>\n<p>这其实是欲念发动时间。</p>\n<p>因为：</p>\n<p>上午精神足。</p>\n<p>晚上准备睡觉。</p>\n<p>下午最容易散乱。</p>\n<p>所以：</p>\n<p>下午必须有替代行为。</p>\n<p>例如：</p>\n<ul><li>散步</li><li>打篮球</li><li>深蹲</li><li>站桩</li><li>抄戒律</li></ul>\n<p>不要空窗。</p>\n<hr>\n<h3>第二关</h3>\n<p>睡前一小时</p>\n<p>这是淫念高发区。</p>\n<p>建议：</p>\n<p>睡前不要看：</p>\n<ul><li>新闻</li><li>短视频</li><li>小说</li><li>动漫</li></ul>\n<p>改成：</p>\n<ul><li>念佛</li><li>读律</li><li>听经</li></ul>\n<p>让最后输入变干净。</p>\n<hr>\n<h3>第三关</h3>\n<p>不要测试自己</p>\n<p>很多人失败在这里。</p>\n<p>例如：</p>\n<p>\"我看看自己能不能不动心。\"</p>\n<p>结果：</p>\n<p>十分钟后就被卷进去。</p>\n<p>《十诵律》的精神是：</p>\n<blockquote><p>远离因缘。</p></blockquote>\n<p>不是考验定力。</p>\n<hr>"},{"id":"section-102","kind":"chapter","number":102,"title":"梦遗和梦中淫欲怎么看","html":"<p>经文这里特别提到：</p>\n<blockquote><p>大乘若夢行婬，寤應生悔。</p></blockquote>\n<p>注意：</p>\n<p>不是有罪。</p>\n<p>而是：</p>\n<p>说明习气还在。</p>\n<p>就像池塘底下还有淤泥。</p>\n<p>梦境只是把它翻上来。</p>\n<p>所以：</p>\n<p>不要恐惧。</p>\n<p>不要自责。</p>\n<p>醒来：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">观照</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">忏悔</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">继续修。</span></p>\n<p>即可。</p>\n<hr>"},{"id":"section-103","kind":"chapter","number":103,"title":"《梵网经》给在家修行人的真正路线","html":"<p>很多人只看到：</p>\n<p>不能邪淫。</p>\n<p>其实蕅益大师已经讲得很清楚：</p>\n<blockquote><p>若欲出離生死，在家亦應竟斷婬欲。</p></blockquote>\n<p>这句话不是要求立刻做到。</p>\n<p>而是指出方向。</p>\n<p>路线是：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">邪淫</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">正淫</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">节制</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">淡化</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">清净</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">梵行</span></p>\n<p>不是一步到位。</p>\n<p>而是逐渐转化。</p>\n<hr>"},{"id":"section-104","kind":"chapter","number":104,"title":"结合你目前阶段的实际建议","html":"<p>你现在最适合的不是拼命压欲。</p>\n<p>而是：</p>\n<h3>一、减少刺激输入</h3>\n<p>这是治本。</p>\n<p>少看：</p>\n<ul><li>短视频</li><li>爽文</li><li>动漫</li><li>美女内容</li></ul>\n<p>效果远大于硬扛。</p>\n<hr>\n<h3>二、增加身体消耗</h3>\n<p>你现在90公斤左右。</p>\n<p>欲火旺盛。</p>\n<p>很多是精力没出口。</p>\n<p>每天：</p>\n<ul><li>快走1小时</li><li>篮球30分钟</li><li>深蹲100个</li></ul>\n<p>比单纯忍耐有效得多。</p>\n<hr>\n<h3>三、继续学律</h3>\n<p>你最近学《十诵律》最大的收获其实已经出现了：</p>\n<p>以前：</p>\n<p>靠意志力。</p>\n<p>现在：</p>\n<p>开始敬畏因果。</p>\n<p>这是根本变化。</p>\n<hr>\n<h3>四、建立临终观</h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">《梵网经》淫戒最后真正要解决的问题是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">临终最后一念是什么？</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">当欲念起来时。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">可以问自己一句：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">假如我今晚就死，这件事值得投入吗？</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">很多妄念当场就会降温。</span></p>\n<hr>"},{"id":"section-105","kind":"summary","number":105,"title":"一句话总结淫戒","html":"<p><span style=\"color: var(--brand<em>color</em>green_primary);\">《梵网经》淫戒并不仅仅是在禁止性行为。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">它真正要断的是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">把快乐建立在感官刺激上的习惯。</span></p></blockquote>\n<p>对于你当前阶段来说，最关键的修法不是盯着“犯没犯”，而是盯着“婬因、婬緣”。</p>\n<p>因为：</p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">犯戒始于一念贪著，而不是始于最后的行为</span>。</strong></p>\n<p>把下午刷手机、睡前看刺激内容、无聊时寻找快感这几个关口守住，你的淫戒已经守住了七八成。剩下的部分，再靠长期持戒、念佛、运动和规律作息慢慢转化习气。这样走，才是《梵网经》和《十诵律》共同强调的“防非止恶于未起之前”。</p>\n<p>​</p>\n<p>​</p>\n<p>你贴出的这一大段，是《梵网经菩萨戒》四十八轻戒中的前二十条。</p>\n<p>如果说前面的十重戒是“保命线”，那么这四十八轻戒就是“修行人的行为规范”。</p>\n<p>对于你目前的情况——</p>\n<ul><li>在家菩萨</li><li>重点修戒律</li><li>希望断淫欲、稳固道心</li><li>未来有出家或长期闭关想法</li><li>经常研究《十诵律》《梵网经》</li></ul>\n<p>我建议不要平均用力。</p>\n<p>四十八轻戒里，有些对你是核心戒，有些只是了解即可。</p>\n<p>我按照你目前修行阶段，给你排一个优先级。</p>\n<hr>"},{"id":"section-106","kind":"chapter","number":106,"title":"第一层：必须重点守的五条","html":"<p>这是直接影响你道业的。</p>\n<h3>第一 不敬师友戒</h3>\n<p>核心：</p>\n<blockquote><p>傲慢障道</p></blockquote>\n<p>很多人学几年佛法以后：</p>\n<ul><li>看不起居士</li><li>看不起法师</li><li>看不起净土</li><li>看不起念佛</li></ul>\n<p>最后把自己修成孤家寡人。</p>\n<p>《华严经》说：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">一切善知识是成佛因缘。</span></p></blockquote>\n<p>所以：</p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">你要特别防</span></h4>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">自以为懂戒律</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">自以为懂空性</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">自以为比别人高</span></li></ul>\n<p>尤其你现在已经拆了很多经典。</p>\n<p>最危险的不是不懂。</p>\n<p>而是：</p>\n<blockquote><p>觉得自己懂了。</p></blockquote>\n<p>这是修行人的大坑。</p>\n<hr>\n<h3>第二 不饮酒戒</h3>\n<p>这个你问题不大。</p>\n<p>但要扩大理解。</p>\n<p>佛法里的酒：</p>\n<p>不仅是酒精。</p>\n<p>凡是让心散乱的东西都类似酒。</p>\n<p>例如：</p>\n<ul><li>短视频</li><li>爽文</li><li>擦边内容</li><li>赌博刺激</li></ul>\n<p>你前段时间说：</p>\n<blockquote><p>下午特别想刷视频。</p></blockquote>\n<p>其实这就是现代版酒戒。</p>\n<p>为什么？</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为放逸。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">酒戒真正防的是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">放逸心。</span></p></blockquote>\n<hr>\n<h3>第五 不教悔罪戒</h3>\n<p>这一条特别重要。</p>\n<p>你和诚慧经常交流。</p>\n<p>如果发现：</p>\n<ul><li>自己犯错</li><li>对方犯错</li></ul>\n<p>不能装看不见。</p>\n<p>但也不能变成挑毛病。</p>\n<p>正确做法：</p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">先检讨自己</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">再柔和提醒别人</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛法叫：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">慈悲劝谏</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒律警察</span></p></blockquote>\n<hr>\n<h3>第七 不往听法戒</h3>\n<p>这一条对你意义极大。</p>\n<p>为什么？</p>\n<p>因为你已经尝到闻法的利益。</p>\n<p>你过去一年：</p>\n<ul><li>经藏</li><li>律藏</li><li>净土</li><li>禅宗</li></ul>\n<p>持续熏习。</p>\n<p>变化非常明显。</p>\n<p>所以：</p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">听法不断</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">道心不断</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">听法停止</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">习气反扑</span></p>\n<p>这几乎是铁律。</p>\n<hr>\n<h3>第九 不看病戒</h3>\n<p>这条实际上是：</p>\n<blockquote><p>培养慈悲心</p></blockquote>\n<p>你以后照顾父母也属于这一戒。</p>\n<p>照顾病人：</p>\n<ul><li>父母</li><li>妻子</li><li>朋友</li></ul>\n<p>都是修行。</p>\n<p>不是耽误修行。</p>\n<hr>"},{"id":"section-107","kind":"chapter","number":107,"title":"第二层：和你最相关的戒","html":"<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">第三 食肉戒</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">你若想深入修定。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">建议逐步趋向素食。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为这条戒核心不是健康。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">长养慈悲。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">《楞严经》说：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">食肉断大慈种。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">你以后如果真准备长期闭关。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">素食几乎是标配。</span></p>\n<hr>\n<h3>第四 食五辛戒</h3>\n<p>五辛：</p>\n<ul><li>葱</li><li>蒜</li><li>韭</li><li>薤</li><li>兴渠</li></ul>\n<p>对于普通人影响不大。</p>\n<p>但对于：</p>\n<ul><li>念佛</li><li>禅修</li><li>持咒</li></ul>\n<p>影响比较明显。</p>\n<p>经典说：</p>\n<blockquote><p>熟食发淫  生食增恚</p></blockquote>\n<p>如果以后进入长期精进阶段。</p>\n<p>可以逐步减少。</p>\n<hr>\n<h3>第六 不供给请法戒</h3>\n<p>本质：</p>\n<blockquote><p>重法</p></blockquote>\n<p>现代对应：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">看到真正有修有证的人。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不要吝啬支持。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">支持：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">请法</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">供养</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">护持</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">都是福田。</span></p>\n<hr>\n<h3>第二十 不行放救戒</h3>\n<p>这条你会特别有感触。</p>\n<p>因为它的核心：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">众生皆父母</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">放生只是一个表现。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">更深的是：</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">不伤害</span></h4>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">能救则救</span></h4>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">培养悲心</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">否则容易修成冷冰冰的自了汉。</span></p>\n<hr>"},{"id":"section-108","kind":"chapter","number":108,"title":"第三层：未来如果出家尤其重要","html":"<h3>第十八 <span style=\"color: var(--brand<em>color</em>green_primary);\">无解作解戒</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">这是法师最容易犯的。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不懂装懂。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">蕅益大师特别重视这条。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">你以后写文章也要注意。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不懂：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">直接说不懂。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不要硬解。</span></p>\n<hr>\n<h3>第十五 僻教戒</h3>\n<p>故意把人往邪路带。</p>\n<p>例如：</p>\n<ul><li>断灭见</li><li>神秘主义</li><li>盲修瞎练</li></ul>\n<p>都属于这一类。</p>\n<hr>\n<h3>第十六 为利倒说戒</h3>\n<p>为了流量。</p>\n<p>为了钱。</p>\n<p>为了名声。</p>\n<p>故意曲解佛法。</p>\n<p>现在网络时代特别常见。</p>\n<p>这是菩萨戒重点警告的。</p>\n<hr>"},{"id":"section-109","kind":"summary","number":109,"title":"对你个人最实用的总结","html":"<p>结合你最近十八天持戒、欲念翻腾的情况。</p>\n<p>我认为你当前最需要抓的其实不是二十条。</p>\n<p>而是四个核心。</p>\n<hr>\n<h3>第一：<span style=\"color: var(--brand<em>color</em>green_primary);\">守淫戒</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">这是根本战场。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">重点：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">不看色情</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">不幻想</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">不主动刺激自己</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">守住这一关。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">其余戒会轻松很多。</span></p>\n<hr>\n<h3>第二：<span style=\"color: var(--brand<em>color</em>green_primary);\">远离放逸</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">对应酒戒。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">少刷：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">短视频</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">爽文</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">动漫</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为这些东西会不断给欲界心加燃料。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">你最近欲念上升。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">和这些输入关系很大。</span></p>\n<hr>\n<h3>第三：<span style=\"color: var(--brand<em>color</em>green_primary);\">持续闻法</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">对应第六、第七戒。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">每天保持：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">戒律学习</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">念佛</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">经典拆解</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">哪怕一天一小时。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">都比断断续续强。</span></p>\n<hr>\n<h3>第四：<span style=\"color: var(--brand<em>color</em>green_primary);\">培养慈悲</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">对应第九、第二十戒。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">多做：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">孝顺父母</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">体谅诚慧</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">帮助病苦的人</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">慈悲心起来以后，</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">淫欲心会明显下降。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为淫欲属于“取”，</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">慈悲属于“给”。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">一个心不断给予的时候，就不会一直想着满足自己。</span></p>\n<hr>\n<p>从修行次第来看，《梵网经》这四十八轻戒最后其实都归到四个字：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">恭敬、慈悲、闻法、持戒。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">十重戒是防止堕落。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">四十八轻戒是培养菩萨人格。</span></p>\n<p>对于你目前阶段，守好淫戒、酒戒（放逸）、闻法戒、不看病戒（培养慈悲），收益会远远超过去纠结一些细枝末节的条文。这样修下去，《梵网经》所说的“<span style=\"color: var(--brand<em>color</em>green_primary);\">孝顺心、恭敬心、慈悲心”会逐渐成为习惯，而不只是戒条。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">​</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">​</span></p>\n<p>这一大段是《梵网经菩萨戒》第21至36轻垢戒，已经进入菩萨戒后半部分，特点非常明显：</p>\n<p><strong>前二十条重在止恶，后二十条重在发心。</strong></p>\n<p>如果说前面的戒是在堵漏洞，那么这一段戒则是在建立一个真正的菩萨人格。</p>\n<p>我按照修行次第，为你提炼核心脉络。</p>\n<hr>"},{"id":"section-110","kind":"chapter","number":110,"title":"一、第二十一戒：瞋打报仇戒","html":"<p>核心：</p>\n<blockquote><p>冤冤相报，无有了期。</p></blockquote>\n<p>世间法讲：</p>\n<ul><li>父仇必报</li><li>血债血偿</li></ul>\n<p>佛法讲：</p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">因果自偿</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">不增新业</span></li></ul>\n<p>所以这里非常特殊。</p>\n<p>佛不是说：</p>\n<blockquote><p>别人打你，你去爱他。</p></blockquote>\n<p>而是说：</p>\n<blockquote><p>不要以瞋报瞋。</p></blockquote>\n<p>重点在：</p>\n<p><strong>不能带着仇恨心去报复。</strong></p>\n<p>因为：</p>\n<p>今天你杀他。</p>\n<p>明天他杀你。</p>\n<p>后天他的子孙杀你的子孙。</p>\n<p>于是轮回继续。</p>\n<hr>\n<p>发隐说得特别透：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">杀一生报一生，于我之生无益，于彼之生有损。</span></p></blockquote>\n<p>所以：</p>\n<p>真正的孝顺，</p>\n<p>不是替父母报仇。</p>\n<p>而是断掉这条仇恨链。</p>\n<p>这也是《地藏经》说：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">解冤释结，更莫相憎。</span></p></blockquote>\n<hr>"},{"id":"section-111","kind":"chapter","number":111,"title":"二、第二十二戒：憍慢不请法戒","html":"<p>核心：</p>\n<blockquote><p>慢如高山，法水不住。</p></blockquote>\n<p>很多人学佛几年后最容易犯。</p>\n<p>觉得：</p>\n<ul><li>我看过很多经</li><li>我懂空性</li><li>我会念佛</li><li>我会禅修</li></ul>\n<p>于是：</p>\n<p>谁都看不上。</p>\n<p>结果停止成长。</p>\n<hr>\n<p>佛特别指出：</p>\n<p>法师可能：</p>\n<ul><li>年轻</li><li>贫穷</li><li>相貌不好</li><li>身体残缺</li></ul>\n<p>但：</p>\n<blockquote><p>一切经律尽解。</p></blockquote>\n<p>你却因为身份背景而轻视。</p>\n<p>这就是失法因缘。</p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">修行最大的障碍：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不是愚痴。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">半桶水的傲慢。</span></p></blockquote>\n<hr>"},{"id":"section-112","kind":"chapter","number":112,"title":"三、第二十三戒：憍慢僻说戒","html":"<p>核心：</p>\n<blockquote><p>懂法却不肯教人。</p></blockquote>\n<p>这比不会更严重。</p>\n<p>因为：</p>\n<p>不会是能力问题。</p>\n<p>不教是发心问题。</p>\n<hr>\n<p>佛要求：</p>\n<p>别人来问法。</p>\n<p>应当：</p>\n<ul><li>慈悲答复</li><li>如实开示</li></ul>\n<p>不能：</p>\n<ul><li>故意隐藏</li><li>故意模糊</li><li>故意炫耀</li></ul>\n<p>否则：</p>\n<p>障他慧命。</p>\n<hr>\n<p>现代对应非常明显：</p>\n<p>有些人：</p>\n<ul><li>卖课不讲核心</li><li>故弄玄虚</li><li>制造神秘感</li></ul>\n<p>都是这一戒所摄。</p>\n<hr>"},{"id":"section-113","kind":"chapter","number":113,"title":"四、第二十四戒：不习学佛戒","html":"<p>这是极重要的一戒。</p>\n<p>佛说：</p>\n<p>有佛经不学。</p>\n<p>有戒律不学。</p>\n<p>却天天研究：</p>\n<ul><li>外道</li><li>世论</li><li>杂学</li></ul>\n<p>叫：</p>\n<blockquote><p>断佛性障道因缘。</p></blockquote>\n<hr>\n<p>不是说：</p>\n<p>不能学世间知识。</p>\n<p>而是：</p>\n<p>主次不能颠倒。</p>\n<p>智旭大师解释得极好：</p>\n<p>每天：</p>\n<ul><li>两分佛法</li><li>一分外学</li></ul>\n<p>可以。</p>\n<p>反过来：</p>\n<ul><li>九分外学</li><li>一分佛法</li></ul>\n<p>危险。</p>\n<hr>\n<p>这条戒与你最近学《十诵律》特别契合。</p>\n<p>因为你已经发现：</p>\n<p>过去天天看空性文章。</p>\n<p>不如认真学律。</p>\n<p>原因就在这里。</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛法真正落地，</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">必须：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒定慧三学并重。</span></p></blockquote>\n<hr>"},{"id":"section-114","kind":"chapter","number":114,"title":"五、第二十五戒：不善知众戒","html":"<p>这是管理者戒。</p>\n<p>比如：</p>\n<ul><li>方丈</li><li>住持</li><li>首座</li><li>知客</li><li>知库</li></ul>\n<p>等等。</p>\n<p>核心：</p>\n<blockquote><p>和合僧团。</p></blockquote>\n<p>两件事：</p>\n<h4>第一 和解诤讼</h4>\n<p>不能挑拨是非。</p>\n<h4>第二 守护常住</h4>\n<p>不能乱花三宝钱。</p>\n<hr>\n<p>这一戒放到今天极具现实意义。</p>\n<p>很多寺院出问题：</p>\n<p>其实不是佛法问题。</p>\n<p>而是：</p>\n<ul><li>财务问题</li><li>权力问题</li><li>人事问题</li></ul>\n<p>所以：</p>\n<p>佛把管理能力直接列入戒法。</p>\n<hr>"},{"id":"section-115","kind":"chapter","number":115,"title":"六、第二十六至二十八戒：利养三戒","html":"<p>这三条可以合看。</p>\n<h3>第二十六 独受利养</h3>\n<p>不能自己吃独食。</p>\n<h3>第二十七 受别请</h3>\n<p>不能私下接受供养。</p>\n<h3>第二十八 别请僧</h3>\n<p>施主不能只挑自己喜欢的和尚。</p>\n<hr>\n<p>本质都在破：</p>\n<blockquote><p>贪名闻利养。</p></blockquote>\n<p>因为僧团一旦开始争供养。</p>\n<p>马上就会：</p>\n<ul><li>拉帮结派</li><li>互相竞争</li><li>破坏和合</li></ul>\n<p>所以佛极重视。</p>\n<hr>"},{"id":"section-116","kind":"chapter","number":116,"title":"七、第二十九戒：邪命自活戒","html":"<p>这一条极重要。</p>\n<p>也是今天最容易犯的。</p>\n<p>佛定义：</p>\n<blockquote><p>为利养而作种种方便。</p></blockquote>\n<p>叫邪命。</p>\n<hr>\n<p>智论说五种邪命：</p>\n<p>①诈现奇特</p>\n<p>装神通</p>\n<p>②自说功德</p>\n<p>吹牛包装</p>\n<p>③占卜算命</p>\n<p>④高声现威</p>\n<p>制造权威感</p>\n<p>⑤炫耀供养</p>\n<p>展示自己多受欢迎</p>\n<hr>\n<p>看到这里，</p>\n<p>你应该马上想到：</p>\n<p>很多网络宗教主播。</p>\n<p>很多都在这里面。</p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛教真正的活命方式：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">乞食</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">随众</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">随缘供养</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而不是经营人设。</span></p>\n<hr>"},{"id":"section-117","kind":"chapter","number":117,"title":"八、第三十至三十三戒","html":"<p>这一组是：</p>\n<p>远离世俗染缘。</p>\n<hr>\n<h3>第三十 不敬好时</h3>\n<p>六斋日要修善。</p>\n<p>不要纵欲造业。</p>\n<hr>\n<h3>第三十一 不行救赎</h3>\n<p>见佛像被卖。</p>\n<p>见经书被毁。</p>\n<p>见修道人受难。</p>\n<p>要尽力救护。</p>\n<hr>\n<h3>第三十二 损害众生</h3>\n<p>不能：</p>\n<ul><li>贩卖兵器</li><li>欺诈秤斗</li><li>倚势欺人</li></ul>\n<p>甚至：</p>\n<p>养猫养狗养猪都提出警策。</p>\n<p>因为：</p>\n<p>间接助长杀业。</p>\n<hr>\n<h3>第三十三 邪业觉观</h3>\n<p>佛特别严厉。</p>\n<p>不要沉迷：</p>\n<ul><li>赌博</li><li>娱乐</li><li>占卜</li><li>战争斗争</li></ul>\n<p>原因很简单：</p>\n<p>这些东西不断训练：</p>\n<ul><li>贪心</li><li>瞋心</li><li>散乱心</li></ul>\n<p>与定慧完全相反。</p>\n<hr>\n<p>你最近提到：</p>\n<p>刷短视频、动漫、爽文。</p>\n<p>严格说，</p>\n<p>虽然不完全等同这一戒。</p>\n<p>但原理是一致的。</p>\n<p>都是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">以外境刺激不断喂养散乱心。</span></p></blockquote>\n<p>所以欲念会越来越重。</p>\n<p>并不是偶然。</p>\n<hr>"},{"id":"section-118","kind":"chapter","number":118,"title":"九、第三十四戒：暂念小乘戒","html":"<p>这是菩萨戒独有精神。</p>\n<p>核心：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">念念不舍菩提心。</span></p></blockquote>\n<p>佛要求：</p>\n<p>不要想着：</p>\n<p>“我先自己解脱再说。”</p>\n<p>而要想着：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">众生未度尽，我誓不成佛。</span></p></blockquote>\n<hr>\n<p>发隐一句话特别精彩：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">带结而利物，大士之宏怀；断结而后化生，小乘之浅计。</span></p></blockquote>\n<p>意思是：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">菩萨哪怕烦恼还没断尽。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">也要利益众生。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">这就是大乘精神。</span></p>\n<hr>"},{"id":"section-119","kind":"chapter","number":119,"title":"十、第三十五戒：不发愿戒","html":"<p>这一戒其实非常契合你。</p>\n<p>因为你最近一年最大的变化：</p>\n<p>不是禅定。</p>\n<p>不是读经。</p>\n<p>而是：</p>\n<p>持续发愿。</p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛要求常发十愿：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">孝顺父母</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">亲近善知识</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">学习经律</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">坚持佛戒</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">成就菩提</span></li></ul>\n<hr>\n<p>愿力是什么？</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">愿力就是：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">未来人生的导航系统。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">没有愿力。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">习气自动接管人生。</span></p>\n<hr>"},{"id":"section-120","kind":"chapter","number":120,"title":"十一、第三十六戒：不发誓戒","html":"<p>这是全段的高潮。</p>\n<p>愿之后。</p>\n<p>必须发誓。</p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">愿：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">是方向。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">誓：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">是决心。</span></p>\n<hr>\n<p>所以佛让菩萨发种种重誓：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">宁受刀山火海。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不毁佛戒。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">宁失生命。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不失戒体。</span></p>\n<hr>\n<p>智旭大师最后说得极重：</p>\n<p>对于出家人而言：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">如果淫欲习气实在控制不了。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">宁可舍戒还俗。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不要破戒。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">舍戒还有未来。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">破戒则伤根本。</span></p>\n<hr>"},{"id":"section-121","kind":"chapter","number":121,"title":"这一段三十六轻戒的总纲","html":"<p>其实可以浓缩成六句话：</p>\n<blockquote><p>不报仇（第二十一）</p></blockquote>\n<blockquote><p>不傲慢（第二十二、二十三）</p></blockquote>\n<blockquote><p>不荒废正学（第二十四）</p></blockquote>\n<blockquote><p>不贪名利（第二十六至二十九）</p></blockquote>\n<blockquote><p>不染世缘（第三十至三十三）</p></blockquote>\n<blockquote><p>不失菩提心（第三十四至三十六）</p></blockquote>\n<p>如果说《十诵律》是在训练一个人“不犯错”，那么《梵网经》这一段是在训练一个人逐渐成为真正的菩萨。</p>\n<p>尤其第三十四、三十五、三十六三戒，可以说是整部《梵网经》的心髓：</p>\n<p><strong><span style=\"color: var(--brand<em>color</em>green_primary);\">持戒是身体，菩提心是灵魂；愿力是方向，誓愿是发动机。</span></strong></p>\n<p>只有戒、愿、心三者同时具足，大乘菩萨道才真正建立起来。</p>\n<p>​</p>\n<p>​</p>"},{"id":"section-122","kind":"chapter","number":122,"title":"《梵网经菩萨戒》第37～48轻戒详细拆解","html":"<h3>第四大段总结：菩萨如何护持道业、护持正法、护持众生</h3>\n<p>前面十重戒解决的是<strong>不造大恶</strong>。</p>\n<p>这最后十二条轻戒，解决的是：</p>\n<blockquote><p><strong>如何让菩萨道持续增长而不退失。</strong></p></blockquote>\n<p>如果说十重戒是防止堕落，</p>\n<p>那么三十七至四十八轻戒，则是在建立：</p>\n<ul><li>修行制度</li><li>僧团秩序</li><li>弘法体系</li><li>护法精神</li><li>教化责任</li></ul>\n<p>这一部分已经不只是个人修行，而是进入：</p>\n<blockquote><p><strong>“如何令佛法久住世间”</strong></p></blockquote>\n<p>的层面。</p>\n<hr>"},{"id":"section-123","kind":"chapter","number":123,"title":"第三十七戒 冒难游行戒","html":"<h3>核心思想</h3>\n<p>不是怕死。</p>\n<p>而是不准愚勇。</p>\n<p>佛法讲：</p>\n<blockquote><p>菩萨可以舍身，  但不能乱舍身。</p></blockquote>\n<p>《发隐》说得极重：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">人身难得。</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">六道之中唯有人道能修菩提。</span></p></blockquote>\n<p>所以：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">保存道器，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">就是在护持佛法。</span></p></blockquote>\n<hr>\n<h3>为什么不能故意涉险</h3>\n<p>因为：</p>\n<h4>第一层</h4>\n<p>死了就不能修了。</p>\n<h4>第二层</h4>\n<p>临死恐怖。</p>\n<p>容易起恶念。</p>\n<h4>第三层</h4>\n<p>恶念引业。</p>\n<p>可能堕落。</p>\n<p>所以：</p>\n<blockquote><p>所丧事重。</p></blockquote>\n<p>失去的不只是生命。</p>\n<p>而是解脱机会。</p>\n<hr>\n<h3>对现代人的启示</h3>\n<p>很多人学佛以后说：</p>\n<blockquote><p>“我有佛菩萨保护。”</p></blockquote>\n<p>然后：</p>\n<ul><li>熬夜开车</li><li>冒险旅游</li><li>不顾身体</li><li>不治病</li></ul>\n<p>这都不是信心。</p>\n<p>而是愚痴。</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">真正修行人：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">不畏死，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">但不求死。</span></p></blockquote>\n<hr>"},{"id":"section-124","kind":"chapter","number":124,"title":"第三十八戒 乖尊卑次序戒","html":"<h3>核心思想</h3>\n<p>秩序就是道场。</p>\n<p>佛法最重：</p>\n<blockquote><p>戒腊次第。</p></blockquote>\n<p>不是年龄。</p>\n<p>不是财富。</p>\n<p>不是权力。</p>\n<p>不是身份。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">谁先受戒谁在前。</span></p></blockquote>\n<hr>\n<h3>为什么这么严格</h3>\n<p>因为：</p>\n<h4>人情建立等级</h4>\n<p>佛法建立道心等级。</p>\n<p>否则：</p>\n<ul><li>富人坐前面</li><li>官员坐前面</li><li>名气大坐前面</li></ul>\n<p>僧团马上世俗化。</p>\n<hr>\n<h3>深层智慧</h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛法不是消灭秩序。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是建立更高秩序。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">出家众按戒腊。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">在家众也按戒次。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">目的：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">让人尊法，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">而不是尊人。</span></p></blockquote>\n<hr>\n<h3>对今天的警示</h3>\n<p>很多寺院：</p>\n<ul><li>尊供养者</li><li>尊有钱人</li><li>尊网红法师</li></ul>\n<p>却不尊戒德。</p>\n<p>实际上已经违背此戒。</p>\n<hr>"},{"id":"section-125","kind":"chapter","number":125,"title":"第三十九戒 不修福慧戒","html":"<h3>核心思想</h3>\n<p>福慧双修。</p>\n<p>如鸟两翼。</p>\n<p>缺一不可。</p>\n<hr>\n<h3>为什么只修慧不行</h3>\n<p>很多人说：</p>\n<blockquote><p>我学空性就够了。</p></blockquote>\n<p>结果：</p>\n<ul><li>身体不好</li><li>经常缺钱</li><li>障碍重重</li></ul>\n<p>原因：</p>\n<p>福报不足。</p>\n<hr>\n<h3>为什么只修福也不行</h3>\n<p>有的人：</p>\n<ul><li>天天放生</li><li>天天捐钱</li></ul>\n<p>但：</p>\n<ul><li>没有正见</li><li>不学经典</li></ul>\n<p>最后容易迷信。</p>\n<hr>\n<h3>佛陀的标准</h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">修福：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">建寺</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">印经</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">供养三宝</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">护持道场</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">修慧：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">读经</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">讲经</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">学戒</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">弘法</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">两条腿一起走。</span></p>\n<hr>\n<h3>对你的启示</h3>\n<p>你最近：</p>\n<ul><li>拆解经典</li><li>写文章</li><li>制作笔记</li><li>劝人学法</li></ul>\n<p>其实属于：</p>\n<blockquote><p>福慧双修。</p></blockquote>\n<p>不是单纯读书。</p>\n<p>已经开始做法布施。</p>\n<hr>"},{"id":"section-126","kind":"chapter","number":126,"title":"第四十戒 揀择受戒戒","html":"<h3>核心思想</h3>\n<p>不以身份看人。</p>\n<p>只看是否具足受戒因缘。</p>\n<hr>\n<h3>佛法最平等的地方</h3>\n<p>国王可以受戒。</p>\n<p>奴婢可以受戒。</p>\n<p>富人可以受戒。</p>\n<p>乞丐也可以受戒。</p>\n<p>乃至鬼神都可受戒。</p>\n<p>因为：</p>\n<blockquote><p>一切众生皆有佛性。</p></blockquote>\n<hr>\n<h3>为什么只遮七逆</h3>\n<p>因为：</p>\n<p>七逆业太重。</p>\n<p>现生障碍戒体。</p>\n<p>除此之外：</p>\n<p>皆可摄受。</p>\n<hr>\n<h3>今天的现实意义</h3>\n<p>很多人：</p>\n<p>看人有钱就热情。</p>\n<p>没钱就冷淡。</p>\n<p>这属于：</p>\n<blockquote><p>贩卖佛法。</p></blockquote>\n<p>佛法不是会员制。</p>\n<p>不是VIP制度。</p>\n<hr>"},{"id":"section-127","kind":"chapter","number":127,"title":"第四十一戒 为利作师戒","html":"<h3>核心思想</h3>\n<p>自己没懂。</p>\n<p>却跑去当老师。</p>\n<p>这是重病。</p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">佛陀最怕什么</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">最怕：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">一盲引众盲。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">自己不懂：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">戒律</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">因果</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">修行次第</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">却：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">收徒</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">开班</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">讲课</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">害人极大。</span></p>\n<hr>\n<h3>为什么罪重</h3>\n<p>因为：</p>\n<p>不是自己错。</p>\n<p>而是带别人一起错。</p>\n<hr>\n<h3>今天特别危险</h3>\n<p>短视频时代：</p>\n<p>人人都能讲佛法。</p>\n<p>很多人：</p>\n<p>看几本书。</p>\n<p>听几节课。</p>\n<p>就开始讲经。</p>\n<p>这正是此戒所警告。</p>\n<hr>"},{"id":"section-128","kind":"chapter","number":128,"title":"第四十二戒 为恶人说戒戒","html":"<h3>核心思想</h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">法不轻传。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不是歧视众生。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是保护正法。</span></p>\n<hr>\n<h3>为什么未受戒者不说戒相</h3>\n<p>因为：</p>\n<p>提前知道。</p>\n<p>容易轻慢。</p>\n<p>就像：</p>\n<p>考试答案提前公开。</p>\n<p>学生反而不珍惜。</p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">佛法讲应机说法</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">药虽好。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">也要对症。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">法平等。</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">机不平等。</span></p></blockquote>\n<hr>\n<h3>今天如何理解</h3>\n<p>经典可以公开。</p>\n<p>但：</p>\n<p>深层戒法</p>\n<p>僧团羯磨</p>\n<p>特殊戒相</p>\n<p>不可随便戏论。</p>\n<p>否则容易毁谤。</p>\n<hr>"},{"id":"section-129","kind":"chapter","number":129,"title":"第四十三戒 无惭受施戒","html":"<h3>核心思想</h3>\n<p>故意破戒。</p>\n<p>还享受供养。</p>\n<p>最危险。</p>\n<hr>\n<h3>为什么叫佛法中贼</h3>\n<p>施主供养：</p>\n<p>是供养三宝。</p>\n<p>不是供养凡夫。</p>\n<p>结果：</p>\n<p>受供养的人：</p>\n<p>明知犯戒。</p>\n<p>故意不改。</p>\n<p>继续接受供养。</p>\n<p>就是：</p>\n<blockquote><p>偷佛饭吃。</p></blockquote>\n<hr>\n<h3>发隐一句极重</h3>\n<blockquote><p>破戒比丘，  天地虽宽，  无处可著。</p></blockquote>\n<p>令人警醒。</p>\n<hr>\n<h3>对在家人的提醒</h3>\n<p>虽然此戒主要针对出家人。</p>\n<p>但在家修行也一样：</p>\n<p>不要拿修行为招牌。</p>\n<p>获取利益。</p>\n<hr>"},{"id":"section-130","kind":"chapter","number":130,"title":"第四十四戒 不供养经典戒","html":"<h3>核心思想</h3>\n<p>敬法。</p>\n<p>重于敬人。</p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">为什么古人抄经刺血</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不是形式主义。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">表达尊法之心。</span></p></blockquote>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">五种供养</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">①受持</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">②读</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">③诵</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">④书写</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">⑤供养</span></p>\n<hr>\n<h3>对现代人的启示</h3>\n<p>供养经典：</p>\n<p>不一定烧香。</p>\n<p>更重要的是：</p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">阅读</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">整理</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">传播</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">实践</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">你现在大量拆解经典。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">其实已经属于：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">法供养。</span></p></blockquote>\n<hr>"},{"id":"section-131","kind":"chapter","number":131,"title":"第四十五戒 不化众生戒","html":"<h3>核心思想</h3>\n<p>菩萨不能只管自己。</p>\n<hr>\n<h3>菩萨与声闻区别</h3>\n<p>声闻：</p>\n<p>重自度。</p>\n<p>菩萨：</p>\n<p>重度众。</p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">为什么见人就劝三皈十戒</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">人生最大的帮助：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不是给钱。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是给方向。</span></p>\n<hr>\n<h3>对你的修行</h3>\n<p>你最近：</p>\n<ul><li>拆解律藏</li><li>分享戒律</li><li>劝人远离放逸</li></ul>\n<p>实际上就在实践此戒。</p>\n<p>这也是法布施。</p>\n<hr>"},{"id":"section-132","kind":"chapter","number":132,"title":"第四十六戒 说法不如法戒","html":"<h3>核心思想</h3>\n<p>法要尊重。</p>\n<p>不是随便讲。</p>\n<hr>\n<h3>为什么法师要高座</h3>\n<p>不是摆架子。</p>\n<p>而是：</p>\n<p>尊重法。</p>\n<p>不是尊重人。</p>\n<hr>\n<h3>佛法的逻辑</h3>\n<p>人高：</p>\n<p>未必值得尊敬。</p>\n<p>法高：</p>\n<p>一定值得尊敬。</p>\n<hr>\n<h3>深层含义</h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">说法前：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">先建立恭敬心。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">然后：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">法才能入心。</span></p>\n<hr>"},{"id":"section-133","kind":"chapter","number":133,"title":"第四十七戒 非法制限戒","html":"<h3>核心思想</h3>\n<p>不得障碍别人修善。</p>\n<hr>\n<h3>最重的三种障碍</h3>\n<p>阻止：</p>\n<ul><li>出家</li><li>建寺</li><li>印经</li></ul>\n<p>等于断三宝。</p>\n<hr>\n<h3>今天的现实版</h3>\n<p>例如：</p>\n<p>故意打压弘法者。</p>\n<p>故意阻碍善法传播。</p>\n<p>故意让人不能学法。</p>\n<p>都属此类精神。</p>\n<hr>\n<h3>正确理解</h3>\n<p>不是不能管理。</p>\n<p>而是：</p>\n<blockquote><p>为护法而管理可以。  为灭法而管理不行。</p></blockquote>\n<p>智者大师特别赞叹：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">唐太宗规范僧团。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">属于护法。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不是破法。</span></p>\n<hr>"},{"id":"section-134","kind":"chapter","number":134,"title":"第四十八戒 破法戒","html":"<h3>核心思想</h3>\n<p>狮子身中虫。</p>\n<p>自食狮子肉。</p>\n<hr>\n<h3>佛法最大的敌人是谁</h3>\n<p>不是外道。</p>\n<p>不是魔王。</p>\n<p>而是：</p>\n<blockquote><p>佛门内部的人。</p></blockquote>\n<hr>\n<h3>为什么罪重</h3>\n<p>因为：</p>\n<p>外人不了解佛法。</p>\n<p>伤害有限。</p>\n<p>内部人了解规则。</p>\n<p>破坏更大。</p>\n<hr>\n<h3>经中特别强调</h3>\n<p>僧人有过：</p>\n<p>先依僧法处理。</p>\n<p>不是动不动：</p>\n<ul><li>告官</li><li>公开羞辱</li><li>借权势打击</li></ul>\n<p>否则破坏僧团威信。</p>\n<hr>\n<h3>但要注意</h3>\n<p>智旭大师特别解释：</p>\n<p>若真是恶僧。</p>\n<p>严重危害佛法。</p>\n<p>无法以内法治理。</p>\n<p>则可权衡处理。</p>\n<p>所以：</p>\n<p>此戒禁止的是：</p>\n<blockquote><p>横加迫害。</p></blockquote>\n<p>不是保护犯罪。</p>\n<hr>"},{"id":"section-135","kind":"chapter","number":135,"title":"第37～48轻戒总纲","html":"<p>这十二戒其实可以浓缩成六句话：</p>\n<h4>第一</h4>\n<p>护身命</p>\n<p>（37）</p>\n<p>不要愚勇冒险。</p>\n<h4>第二</h4>\n<p>护僧团</p>\n<p>（38）</p>\n<p>尊重次第。</p>\n<h4>第三</h4>\n<p>护资粮</p>\n<p>（39）</p>\n<p>福慧双修。</p>\n<h4>第四</h4>\n<p>护戒法</p>\n<p>（40～44）</p>\n<p>慎授戒、慎说戒、敬戒法。</p>\n<h4>第五</h4>\n<p>护众生</p>\n<p>（45～46）</p>\n<p>广行教化，如法说法。</p>\n<h4>第六</h4>\n<p>护三宝</p>\n<p>（47～48）</p>\n<p>不障善法，不破佛法。</p>\n<hr>\n<p>至此，《梵网经》四十八轻戒全部结束。</p>\n<p>若把前面的十重戒与四十八轻戒合起来看，可以归纳成一句话：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">十重戒，是堵住堕落之门；</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">四十八轻戒，是打开成佛之路。</span></p></blockquote>\n<p>十重戒重在“止恶”，四十八轻戒重在“行善”。</p>\n<p>因此智旭大师说：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">菩萨戒不是单纯不做坏事，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">而是要积极承担利益众生、护持正法的责任。</span></p></blockquote>\n<p>这也正是大乘菩萨道与小乘自利解脱最大的分野所在。</p>\n<p>​</p>\n<p>​</p>"},{"id":"section-136","kind":"chapter","number":136,"title":"《梵网经菩萨戒》圆满结论详解","html":"<h3>——从戒相回归心地，从持戒走向成佛</h3>\n<p>到了这里，《梵网经菩萨戒》已经全部讲完。</p>\n<p>前面讲了：</p>\n<ul><li>十重戒</li><li>四十八轻戒</li></ul>\n<p>如果只看到这里，容易误会：</p>\n<blockquote><p>菩萨戒不过是一套行为规范。</p></blockquote>\n<p>但最后这一段，佛陀突然把层次拔高。</p>\n<p>从戒相回归心地。</p>\n<p>从行为回归佛性。</p>\n<p>从持戒回归成佛。</p>\n<p>所以这一部分实际上是：</p>\n<blockquote><p>《梵网经》的总结，也是全经最深的地方。</p></blockquote>\n<hr>"},{"id":"section-137","kind":"chapter","number":137,"title":"一、三世诸佛共同宣说","html":"<p>经云：</p>\n<blockquote><p>三世诸佛已诵、当诵、今诵。</p></blockquote>\n<p>这句话极重要。</p>\n<p>意思是：</p>\n<p>过去佛这样说；</p>\n<p>现在佛这样说；</p>\n<p>未来佛还是这样说。</p>\n<p>说明：</p>\n<h4>戒不是释迦佛个人制定</h4>\n<p>而是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">法界诸佛共同发现的规律。</span></p></blockquote>\n<p>如同：</p>\n<ul><li>火能烧人</li><li>水能灭火</li></ul>\n<p>不是谁规定。</p>\n<p>而是本来如此。</p>\n<hr>\n<p>所以戒律也是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">佛不是立法者，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">佛只是发现者。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒即法则。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">法则即真理。</span></p>\n<hr>"},{"id":"section-138","kind":"chapter","number":138,"title":"二、为什么叫“佛性常住戒”","html":"<p>经云：</p>\n<blockquote><p>佛性常住戒卷</p></blockquote>\n<p>这是《梵网经》最核心的一句话。</p>\n<p>一般人认为：</p>\n<p>戒律是外面制定的规则。</p>\n<p>《梵网经》却说：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒就是佛性。</span></p></blockquote>\n<p>智旭大师解释：</p>\n<blockquote><p>戒藏者，通则一切诸法皆名为戒。</p></blockquote>\n<p>什么意思？</p>\n<p>真正的戒不是条文。</p>\n<p>而是：</p>\n<blockquote><p>心地本来清净。</p></blockquote>\n<p>杀盗淫妄为什么不对？</p>\n<p>因为违背佛性。</p>\n<p>慈悲忍辱为什么对？</p>\n<p>因为顺应佛性。</p>\n<hr>\n<p>所以：</p>\n<h4>小乘戒</h4>\n<p>重在：</p>\n<blockquote><p>不许做什么。</p></blockquote>\n<h4>大乘戒</h4>\n<p>重在：</p>\n<blockquote><p>恢复本来面目。</p></blockquote>\n<hr>\n<p>这就是：</p>\n<blockquote><p>心地戒。</p></blockquote>\n<hr>"},{"id":"section-139","kind":"chapter","number":139,"title":"三、持戒为什么能见佛","html":"<p>经云：</p>\n<blockquote><p>得见千佛，为千佛授手。</p></blockquote>\n<p>很多人把这理解成神通感应。</p>\n<p>其实智旭解释得很好：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">授手者，与佛相邻。</span></p></blockquote>\n<p>意思是：</p>\n<p>不是佛把手伸给你。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">你的心越来越接近佛。</span></p></blockquote>\n<hr>\n<p>什么人最容易见佛？</p>\n<p>不是聪明人。</p>\n<p>不是神通人。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">持戒人。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因为：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒清净；</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">心清净；</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">心佛自然感应。</span></p>\n<hr>"},{"id":"section-140","kind":"chapter","number":140,"title":"四、持戒五大利益","html":"<p>这是全经最后的利益总结。</p>\n<h3>第一利：诸佛守护</h3>\n<p>经云：</p>\n<blockquote><p>十方佛憫念常守護</p></blockquote>\n<p>为什么？</p>\n<p>因为：</p>\n<p>持戒人是在护佛法。</p>\n<p>佛自然护念。</p>\n<hr>\n<h3>第二利：<span style=\"color: var(--brand<em>color</em>green_primary);\">临终欢喜</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">破戒的人：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">临终恐惧。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">业力现前。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">心神散乱。</span></p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">持戒的人：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">知道自己去处。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">正见现前。</span></p></blockquote>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">心生欢喜。</span></p></blockquote>\n<hr>\n<p>这是净土宗特别重视的地方。</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">临终正念。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒律是根基。</span></p>\n<hr>\n<h3>第三利：生生世世遇菩萨</h3>\n<p>经云：</p>\n<blockquote><p>为诸菩萨友</p></blockquote>\n<p>物以类聚。</p>\n<p>人以群分。</p>\n<hr>\n<p>今天喜欢什么样的人。</p>\n<p>未来就容易到什么样的环境。</p>\n<hr>\n<p>喜欢名利：</p>\n<p>来世继续名利圈。</p>\n<p>喜欢佛法：</p>\n<p>来世继续佛法圈。</p>\n<hr>"},{"id":"section-141","kind":"chapter","number":141,"title":"第四利：功德聚","html":"<p>经云：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">功德聚，戒度悉成就</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒是一切功德根本。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">如同大地。</span></p>\n<hr>\n<p>布施从戒长出。</p>\n<p>忍辱从戒长出。</p>\n<p>禅定从戒长出。</p>\n<p>智慧从戒长出。</p>\n<hr>\n<p>所以：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒为万善之基。</span></p></blockquote>\n<hr>"},{"id":"section-142","kind":"chapter","number":142,"title":"第五利：福慧圆满","html":"<p>这是最究竟利益。</p>\n<p>经云：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">性戒福慧满</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">什么意思？</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛性本具：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">福德</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">智慧</span></li></ul>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">持戒不是创造佛性。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是显发佛性。</span></p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">因此：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">持戒越深。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">福报越大。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">智慧越明。</span></p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">最终：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">成佛。</span></p>\n<hr>"},{"id":"section-143","kind":"chapter","number":143,"title":"五、全经最高峰——中道实相","html":"<p>下面这段是《梵网经》最深的部分：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">不生亦不灭</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">不常复不断</span>  <span style=\"color: var(--brand<em>color</em>green<em>primary);\">不一亦不异</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">不来亦不去</span></p></blockquote>\n<p>这实际上就是：</p>\n<p>中论 的八不中道。</p>\n<hr>\n<h3>为什么放在最后</h3>\n<p>因为：</p>\n<p>如果只守戒。</p>\n<p>容易执着。</p>\n<p>认为：</p>\n<p>我持戒。</p>\n<p>别人犯戒。</p>\n<p>我好。</p>\n<p>别人坏。</p>\n<hr>\n<p>这样：</p>\n<p>戒反而成障碍。</p>\n<hr>\n<p>所以最后佛陀说：</p>\n<h4>戒有</h4>\n<p>不能执有。</p>\n<h4>戒空</h4>\n<p>不能执空。</p>\n<hr>\n<p>真正戒体：</p>\n<p>超越有无。</p>\n<hr>\n<p>这就是：</p>\n<blockquote><p>心地实相。</p></blockquote>\n<hr>"},{"id":"section-144","kind":"chapter","number":144,"title":"六、一心三因佛性","html":"<p>智旭大师这一段极精彩。</p>\n<p>他说：</p>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">一心</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">正因佛性</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">本来具足。</span></p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">静观</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">了因佛性</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">开发智慧。</span></p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">持戒修行</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">缘因佛性</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">增长福德。</span></p>\n<hr>\n<p>三者合一：</p>\n<p>就是成佛之路。</p>\n<hr>\n<p>换句话说：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">佛性不是等来的。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是：</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">本有佛性</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">（正因）</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">闻思修</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">（了因）</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">持戒行善</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">（缘因）</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">成佛</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">（果）</span></p>\n<hr>"},{"id":"section-145","kind":"chapter","number":145,"title":"七、为什么凡夫和二乘都不是究竟","html":"<p>经云：</p>\n<blockquote><p>計我著相者不能生是法  滅壽取證者亦非下種處</p></blockquote>\n<p>佛同时破两边。</p>\n<hr>\n<h3>凡夫执有</h3>\n<p>我是真的。</p>\n<p>世界是真的。</p>\n<p>欲望是真的。</p>\n<hr>\n<p>这是：</p>\n<p>有边。</p>\n<hr>\n<h3>二乘执空</h3>\n<p>什么都不要。</p>\n<p>只求涅槃。</p>\n<hr>\n<p>这是：</p>\n<p>空边。</p>\n<hr>\n<p>佛说：</p>\n<p>两边都不是。</p>\n<hr>\n<p>菩萨走的是：</p>\n<blockquote><p>中道。</p></blockquote>\n<hr>"},{"id":"section-146","kind":"chapter","number":146,"title":"八、第一道与摩诃衍","html":"<p>经云：</p>\n<blockquote><p>是名第一道  亦名摩訶衍</p></blockquote>\n<p>什么叫第一道？</p>\n<p>就是：</p>\n<p>不落两边。</p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">什么叫摩诃衍（大乘）？</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">就是：</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不仅自己解脱。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">还要度尽众生。</span></p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以：</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">第一道</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">讲智慧。</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">摩诃衍</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">讲慈悲。</span></p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">智慧与慈悲结合。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">才是佛道。</span></p>\n<hr>"},{"id":"section-147","kind":"chapter","number":147,"title":"九、《梵网经》的最终结论","html":"<p>佛最后说：</p>\n<blockquote><p>护持净戒如护明珠</p></blockquote>\n<p>智旭大师解释得非常好。</p>\n<p>明珠有三义：</p>\n<h4>第一</h4>\n<p>清净</p>\n<p>不污染。</p>\n<hr>\n<h4>第二</h4>\n<p>圆满</p>\n<p>不缺损。</p>\n<hr>\n<h4>第三</h4>\n<p>光明</p>\n<p>不昏暗。</p>\n<hr>\n<p>这其实就是：</p>\n<p>卢舍那佛的三德。</p>\n<hr>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以持戒不是束缚。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而是：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">保护自己的佛性明珠。</span></p></blockquote>\n<hr>"},{"id":"section-148","kind":"summary","number":148,"title":"十、智旭大师最后的总结","html":"<p>智旭大师最后提出一个千古争论：</p>\n<p>有人说：</p>\n<blockquote><p>学教最重要。</p></blockquote>\n<p>有人说：</p>\n<blockquote><p>参禅最重要。</p></blockquote>\n<p>有人说：</p>\n<blockquote><p>戒律太浅。</p></blockquote>\n<hr>\n<p>智旭直接回答：</p>\n<p>错。</p>\n<hr>\n<p>因为：</p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">教</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">是解释心地。</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">禅</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">是证悟心地。</span></p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">戒</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">是保护心地。</span></p>\n<hr>\n<p>三者本来一体。</p>\n<p>不可分割。</p>\n<hr>\n<p>所以他说：</p>\n<blockquote><p>戒相、教相、禪相，  亦不可得。</p></blockquote>\n<p>最终：</p>\n<p>都回归：</p>\n<blockquote><p>心地。</p></blockquote>\n<hr>"},{"id":"section-149","kind":"summary","number":149,"title":"《梵网经》全经一句话总结","html":"<p>如果把《梵网经》全部浓缩成一句话，就是：</p>\n<blockquote><p>以佛性为体，  以菩提心为因，  以十重四十八轻戒为行，  以利益众生为愿，  以圆满佛果为归。</p></blockquote>\n<p>所以《梵网经》并不是一本单纯讲戒律的书。</p>\n<p>它实际上是一部：</p>\n<blockquote><p>从凡夫直达佛果的《菩萨成佛路线图》。</p></blockquote>\n<p>十重戒，是堵住堕落之门；</p>\n<p>四十八轻戒，是打开菩萨之路；</p>\n<p>最后这一品，则告诉我们：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green<em>primary);\">戒从心起，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">心即佛性；</span>  <span style=\"color: var(--brand<em>color</em>green<em>primary);\">守护心地，</span>  <span style=\"color: var(--brand</em>color<em>green</em>primary);\">即是成佛。</span></p></blockquote>\n<p>这正是卢舍那佛“心地法门”的究竟归宿。</p>\n<p>​</p>\n<p>​</p>\n<p>这是《梵网经菩萨戒》之后，蕅益大师专门为犯重戒者所制定的《梵网经忏悔行法》。如果说前面《梵网经》是在讲<strong>如何建立戒体</strong>，那么这一篇讲的就是：</p>\n<blockquote><p><strong>戒体受损之后，如何恢复。</strong></p></blockquote>\n<p>这篇文字极其重要，因为它解决了一个所有修行人都会面对的问题：</p>\n<p><strong>犯戒之后怎么办？</strong></p>\n<p>很多人学佛学到后来，往往有两种极端：</p>\n<p>第一种，犯了错就自暴自弃。</p>\n<blockquote><p>「反正已经破戒了，算了。」</p></blockquote>\n<p>第二种，死执形式。</p>\n<blockquote><p>「我已经犯了重罪，永远没救了。」</p></blockquote>\n<p>蕅益大师写此忏法，就是破除这两种邪见。</p>\n<hr>"},{"id":"section-150","kind":"chapter","number":150,"title":"一、整篇核心思想","html":"<p>可以浓缩成一句话：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">犯戒不可怕，最可怕的是覆藏不悔。</span></p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">所以大师开篇就引用《梵网经》：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">若有犯十戒者，应教忏悔。</span></p></blockquote>\n<p>注意。</p>\n<p>佛没有说：</p>\n<blockquote><p>犯了十重戒，永远完蛋。</p></blockquote>\n<p>而是说：</p>\n<blockquote><p>应教忏悔。</p></blockquote>\n<p>这就是大乘戒法和很多宗教最大的不同。</p>\n<p>佛法看重的不是过去。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">你现在是否回头。</span></p></blockquote>\n<hr>"},{"id":"section-151","kind":"chapter","number":151,"title":"二、蕅益大师为什么特别重视忏悔","html":"<p>他说：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">如从地倒，还从地起。</span></p></blockquote>\n<p>这句话非常经典。</p>\n<p>什么意思？</p>\n<p>比如一个人走路跌倒。</p>\n<p>跌倒在哪里？</p>\n<p>在地上。</p>\n<p>站起来靠什么？</p>\n<p>还是靠地。</p>\n<p>同样：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">你因戒而得佛法利益。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">又因毁戒而失去利益。</span></p>\n<p>那么恢复的方法是什么？</p>\n<p>还是戒。</p>\n<p>所以：</p>\n<blockquote><p>因戒失，仍因戒复。</p></blockquote>\n<p>这叫：</p>\n<p><strong>从地倒，还从地起。</strong></p>\n<hr>"},{"id":"section-152","kind":"chapter","number":152,"title":"三、整个忏法分十步","html":"<p>蕅益大师归纳为十意：</p>\n<p>| <strong>次第</strong>                                                           | <strong>内容</strong>                                                             | | ---------------------------------------------------------------- | ------------------------------------------------------------------ | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">1</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">严道场</span>  | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">2</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">净三业</span>  | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">3</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">香华供养</span> | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">4</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">赞礼归依</span> | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">5</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">陈罪悔除</span> | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">6</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">立愿诵戒</span> | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">7</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">苦到礼佛</span> | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">8</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">重修愿行</span> | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">9</span>  | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">旋绕自归</span> | | <span style=\"color: var(--brand<em>color</em>green<em>primary);\">10</span> | <span style=\"color: var(--brand</em>color<em>green</em>primary);\">坐念实相</span> |</p>\n<p>表面看很复杂。</p>\n<p>其实可以归纳成三部分：</p>\n<h4>第一部分：发露</h4>\n<p>1-5</p>\n<p>承认错误。</p>\n<p>不隐藏。</p>\n<p>不狡辩。</p>\n<hr>\n<h4>第二部分：重建</h4>\n<p>6-9</p>\n<p>重新发愿。</p>\n<p>重新持戒。</p>\n<p>重新做人。</p>\n<hr>\n<h4>第三部分：证入</h4>\n<p>10</p>\n<p>观罪性空。</p>\n<p>回归心地。</p>\n<hr>"},{"id":"section-153","kind":"chapter","number":153,"title":"四、蕅益大师最厉害的地方","html":"<p>不是礼佛。</p>\n<p>不是诵戒。</p>\n<p>而是最后的：</p>"},{"id":"section-154","kind":"chapter","number":154,"title":"坐念实相","html":"<p>这里已经进入大乘圆教。</p>\n<p>大师问：</p>\n<blockquote><p>罪从哪里来？</p></blockquote>\n<p>从心来？</p>\n<p>从境来？</p>\n<p>从心境和合来？</p>\n<p>还是无因来？</p>\n<p>然后层层追究。</p>\n<p>最后得出结论：</p>\n<blockquote><p>犯性本空。</p></blockquote>\n<p>注意。</p>\n<p>这不是说：</p>\n<blockquote><p>犯罪没关系。</p></blockquote>\n<p>而是说：</p>\n<blockquote><p>罪业缘起性空。</p></blockquote>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">犯时是真犯。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">果报是真受。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">但究竟观察：</span></p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">找不到一个固定不变的罪体。</span></p></blockquote>\n<p>这与《金刚经》：</p>\n<blockquote><p>过去心不可得，现在心不可得，未来心不可得。</p></blockquote>\n<p>完全一致。</p>\n<hr>"},{"id":"section-155","kind":"chapter","number":155,"title":"五、为什么一定要观空","html":"<p>蕅益大师回答得非常直接。</p>\n<p>他说：</p>\n<p>如果你戒根已经破损。</p>\n<p>定力不足。</p>\n<p>智慧不足。</p>\n<p>却拼命追求见佛、见光、见莲花。</p>\n<p>容易出问题。</p>\n<p>甚至容易著魔。</p>\n<p>所以他说：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">但深观罪性本空，罪既拔已，自成感应。</span></p></blockquote>\n<p>这是极重要的一句。</p>\n<p>很多修行人恰恰相反。</p>\n<p>天天盼感应。</p>\n<p>天天盼瑞相。</p>\n<p>天天盼见佛。</p>\n<p>结果越求越偏。</p>\n<p>大师告诉我们：</p>\n<p>正确顺序是：</p>\n<p>①<span style=\"color: var(--brand<em>color</em>green_primary);\">先忏悔</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">②先清净</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">③先观空</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">↓</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">④感应自然出现</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">而不是反过来。</span></p>\n<hr>"},{"id":"section-156","kind":"chapter","number":156,"title":"六、什么叫“好相”","html":"<p>经中一直讲：</p>\n<blockquote><p>要见好相。</p></blockquote>\n<p>很多人以为必须见佛。</p>\n<p>其实蕅益大师解释得非常细。</p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">下品</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">梦境变好。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">身体轻安。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">道心增长。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">烦恼减少。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">这已经算好相。</span></p>\n<hr>\n<h3><span style=\"color: var(--brand<em>color</em>green_primary);\">中品</span></h3>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">禅坐时：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">闻异香</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">见光明</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">法喜增长</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">这是中品好相。</span></p>\n<hr>\n<h3>上品</h3>\n<p>静坐时：</p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">自己清楚看见：</span></p>\n<ul><li><span style=\"color: var(--brand<em>color</em>green_primary);\">戒相分明</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">身心安稳</span></li><li><span style=\"color: var(--brand<em>color</em>green_primary);\">无所怖畏</span></li></ul>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">这是上品好相。</span></p>\n<hr>\n<p>可见：</p>\n<p>真正的好相，</p>\n<p>首先不是神通。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">戒体恢复。</span></p></blockquote>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">烦恼减轻。</span></p></blockquote>\n<blockquote><p><span style=\"color: var(--brand<em>color</em>green_primary);\">心地清净。</span></p></blockquote>\n<hr>"},{"id":"section-157","kind":"chapter","number":157,"title":"七、本篇最重要的一段","html":"<p>蕅益大师说：</p>\n<blockquote><p>有事仪而无理观，不能清罪之源。</p></blockquote>\n<blockquote><p>有理观而无事仪，不能竭罪之流。</p></blockquote>\n<p>这两句价值极大。</p>\n<p>很多修行人容易落两个极端。</p>\n<hr>\n<h3>第一种</h3>\n<p>只讲空性。</p>\n<p>不持戒。</p>\n<p>不礼佛。</p>\n<p>不忏悔。</p>\n<p>这是：</p>\n<blockquote><p>有理无事。</p></blockquote>\n<p>好比井里掉进死老鼠。</p>\n<p>你天天讲：</p>\n<blockquote><p>本来无老鼠。</p></blockquote>\n<p>结果井水还是臭。</p>\n<hr>\n<h3>第二种</h3>\n<p>只做仪式。</p>\n<p>天天拜。</p>\n<p>天天念。</p>\n<p>却不反省。</p>\n<p>不观心。</p>\n<p>这是：</p>\n<blockquote><p>有事无理。</p></blockquote>\n<p>只是表面洗刷。</p>\n<p>根还在。</p>\n<hr>\n<p>所以蕅益大师提出：</p>"},{"id":"section-158","kind":"chapter","number":158,"title":"事理双修","html":"<p><span style=\"color: var(--brand<em>color</em>green_primary);\">礼佛忏悔是事。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">观罪性空是理。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">两者缺一不可。</span></p>\n<hr>"},{"id":"section-159","kind":"chapter","number":159,"title":"八、对现代修行人的启示","html":"<p>这篇《梵网经忏悔行法》，其实正好对应很多现代人的问题。</p>\n<p>比如：</p>\n<ul><li>破色戒</li><li>刷短视频</li><li>起贪心</li><li>发脾气</li><li>妄语</li><li>懈怠</li></ul>\n<p>很多人犯了以后：</p>\n<p>不是懊悔过度。</p>\n<p>就是干脆摆烂。</p>\n<p>而蕅益大师给出的道路是：</p>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">第一步</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">承认。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不要找理由。</span></p>\n<hr>\n<h4><span style=\"color: var(--brand<em>color</em>green_primary);\">第二步</span></h4>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">发露。</span></p>\n<p><span style=\"color: var(--brand<em>color</em>green_primary);\">不要覆藏。</span></p>\n<hr>\n<h4><span style=\"color: var(--brand
