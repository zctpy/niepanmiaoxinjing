施 → 破除我执。</p>\n<p>普通人：</p>\n<p>忍辱 → 忍耐。</p>\n<p>菩萨：</p>\n<p>忍辱 → 证空。</p>\n<p>普通人：</p>\n<p>精进 → 成功。</p>\n<p>菩萨：</p>\n<p>精进 → 利生。</p>\n<hr>\n<h2>十三、一句话总结卷九</h2>\n<blockquote><p><strong><span style=\"color: #E00;\">十善是成佛的根基，六度是成佛的道路；但真正的大乘行，不在行为表面，而在于心离贪瞋痴、离我执分别，以无所得心利益一切众生。</span></strong></p></blockquote>\n<p>如果用《宗镜录》的“一心”思想总结：</p>\n<blockquote><p><strong><span style=\"color: #E00;\">十恶，是一念迷心向外攀缘；十善，是一念觉心返照自性；六度，是觉心展开的大悲妙用。</span></strong></p></blockquote>\n<p>所以佛最后说：</p>\n<blockquote><p><span style=\"color: #E00;\">“十善业道，是能安立一切善法功德根本。”</span></p></blockquote>\n<p>这句话，可以作为《大乘大集地藏十轮经》前九卷修行纲领的总钥匙。</p>\n<p>​</p>\n<p>​</p>"},{"id":"section-010","kind":"volume","number":10,"title":"《大乘大集地藏十轮经卷十》深度拆解","html":"<hr>\n<h2>《大乘大集地藏十轮经卷十》深度拆解</h2>\n<h3>一、核心主题：什么是真正的大乘菩萨？</h3>\n<p>这一卷反复出现一个词：</p>\n<blockquote><p><strong>大甲冑轮</strong></p></blockquote>\n<p>“甲冑”就是铠甲。</p>\n<p>佛用这个比喻说明：</p>\n<p>菩萨行菩提道，不是靠一时热情，而是需要穿上能够抵抗：</p>\n<ul><li>五欲诱惑</li><li>烦恼侵袭</li><li>众生恶业</li><li>生死恐惧</li></ul>\n<p>的智慧铠甲。</p>\n<p>这一卷提出五种“大甲胄”：</p>\n<ol><li>般若大甲胄轮</li><li>善巧方便大甲胄轮</li><li>大慈大甲胄轮</li><li>大悲大甲胄轮</li><li>大忍大甲胄轮</li></ol>\n<p>其实对应菩萨完整人格：</p>\n<p>| <strong>功德</strong> | <strong>解决的问题</strong>   | | ------ | ----------- | | 般若     | 不被错误认知束缚    | | 方便     | 知道如何帮助不同众生  | | 慈      | 给众生真正利益     | | 悲      | 愿众生离苦       | | 忍      | 面对长期菩萨事业不退转 |</p>\n<hr>\n<h2>二、般若大甲胄轮：智慧不是知识，而是无所得智慧</h2>\n<p>佛首先区分：</p>\n<h3>1. 世间般若</h3>\n<p>经文：</p>\n<blockquote><p>“唯依读诵、书写、听闻，为他演说三乘正法。”</p></blockquote>\n<p>这是什么？</p>\n<p>就是：</p>\n<ul><li>研究经典</li><li>讲解佛法</li><li>弘扬教义</li></ul>\n<p>这些当然很好。</p>\n<p>但是问题在哪里？</p>\n<p>佛说：</p>\n<blockquote><p>“有取、有著，是名菩萨世间般若。”</p></blockquote>\n<p>什么意思？</p>\n<p>如果：</p>\n<p>“我懂佛法。”</p>\n<p>“我的见解最高。”</p>\n<p>“别人修法不如我。”</p>\n<p>那么智慧马上变成新的执着。</p>\n<p>这就是：</p>\n<p><strong>佛法进入头脑，没有进入生命。</strong></p>\n<p>甚至会产生：</p>\n<ul><li>法执</li><li>慢心</li><li>分别心</li></ul>\n<p>所以这种智慧虽然超过普通知识，但仍属于世间层面。</p>\n<hr>\n<h3>2. 出世般若</h3>\n<p>真正的大般若：</p>\n<p>核心一句：</p>\n<blockquote><p><strong>无所得方便而住。</strong></p></blockquote>\n<p>这是《心经》的核心：</p>\n<blockquote><p>“无智亦无得。”</p></blockquote>\n<p>什么意思？</p>\n<p>不是没有智慧。</p>\n<p>而是：</p>\n<p>智慧出现时，没有一个“我拥有智慧”的主体。</p>\n<p>比如：</p>\n<p>普通人帮助别人：</p>\n<p>“我做了一件好事。”</p>\n<p>菩萨帮助众生：</p>\n<p>“因缘具足，自然如此。”</p>\n<p>没有：</p>\n<ul><li>能帮助的人</li><li>被帮助的人</li><li>帮助这件事</li></ul>\n<p>三轮体空。</p>\n<p>所以真正般若：</p>\n<p>不是增加知识，</p>\n<p>而是减少“我执”。</p>\n<hr>\n<h2>三、善巧方便：最高级的慈悲，是因材施教</h2>\n<p>这一部分非常重要。</p>\n<p>很多修行人容易犯一个错误：</p>\n<blockquote><p>自己学了最高法门，就希望所有人马上接受最高法门。</p></blockquote>\n<p>佛明确批判：</p>\n<blockquote><p>“若唯说一乘，是名恶说法。”</p></blockquote>\n<p>为什么？</p>\n<p>因为众生根器不同。</p>\n<p>比如：</p>\n<p>一个人现在：</p>\n<ul><li>贪欲很重</li><li>脾气暴躁</li><li>没有因果观</li></ul>\n<p>你直接跟他说：</p>\n<p>“一切皆空。”</p>\n<p>可能导致：</p>\n<p>“既然空，那杀盗淫也没关系。”</p>\n<p>所以佛说：</p>\n<p>对不同众生，要不同方法。</p>\n<hr>\n<h3><span style=\"color: #E00;\">佛给出的教学阶梯：</span></h3>\n<h4><span style=\"color: #E00;\">对恶业重的人：</span></h4>\n<p><span style=\"color: #E00;\">先讲：</span></p>\n<p><span style=\"color: #E00;\">因果。</span></p>\n<p><span style=\"color: #E00;\">让他知道：</span></p>\n<p><span style=\"color: #E00;\">杀生 → 恶果</span></p>\n<p><span style=\"color: #E00;\">贪欲 → 痛苦</span></p>\n<p><span style=\"color: #E00;\">邪见 → 堕落</span></p>\n<h4><span style=\"color: #E00;\">对有善根的人：</span></h4>\n<p><span style=\"color: #E00;\">讲：</span></p>\n<p><span style=\"color: #E00;\">戒律、禅定、智慧。</span></p>\n<h4><span style=\"color: #E00;\">对大乘根器成熟者：</span></h4>\n<p><span style=\"color: #E00;\">讲：</span></p>\n<p><span style=\"color: #E00;\">空性、菩萨道。</span></p>\n<p><span style=\"color: #E00;\">这就是：</span></p>\n<blockquote><p><strong><span style=\"color: #E00;\">方便不是降低真理，而是按照众生接受能力呈现真理。</span></strong></p></blockquote>\n<hr>\n<h2>四、世间方便最大的错误：没有智慧的慈悲</h2>\n<p>佛特别指出：</p>\n<p>如果没有善知识指导：</p>\n<blockquote><p>“不依明师、不依善友。”</p></blockquote>\n<p>菩萨会犯严重错误。</p>\n<p>例如：</p>\n<p>有人喜欢杀生。</p>\n<p>你告诉他：</p>\n<p>“一切众生皆空。”</p>\n<p>他可能理解成：</p>\n<p>“杀也没有关系。”</p>\n<p>这不是慈悲，是害人。</p>\n<p>真正方便：</p>\n<p>必须观察：</p>\n<ul><li>对方根器</li><li>对方烦恼</li><li>对方阶段</li></ul>\n<p>然后给予最适合的方法。</p>\n<hr>\n<h2>五、大慈：从“爱众生”提升到“见法界平等”</h2>\n<p>佛说：</p>\n<p>慈有二种：</p>\n<h3>第一种：</h3>\n<p>有情缘慈。</p>\n<p>就是：</p>\n<p>“希望某个人幸福。”</p>\n<p>比如：</p>\n<p>爱自己的孩子。</p>\n<p>这是普通慈悲。</p>\n<p>声闻缘觉也能修。</p>\n<hr>\n<h3>第二种：</h3>\n<p>法缘慈。</p>\n<p>这是菩萨的大慈。</p>\n<p>为什么？</p>\n<p>因为菩萨看到：</p>\n<p>众生不是一个固定实体。</p>\n<p>而是：</p>\n<p>五蕴因缘假合。</p>\n<p>所以慈悲不是：</p>\n<p>“我帮助一个可怜的人。”</p>\n<p>而是：</p>\n<p><span style=\"color: #E00;\">“一切法界众生，本来同体。”</span></p>\n<p><span style=\"color: #E00;\">这里已经进入《华严》的境界：</span></p>\n<blockquote><p><span style=\"color: #E00;\">心佛众生，三无差别。</span></p></blockquote>\n<hr>\n<h2>六、大悲：菩萨和二乘最大的区别</h2>\n<p>经文：</p>\n<blockquote><p>“声闻独觉但为己身得利乐故而修行悲。”</p></blockquote>\n<p>这不是批评声闻不好。</p>\n<p>而是指出：</p>\n<p>大小乘发心不同。</p>\n<p>声闻：</p>\n<p>目标：</p>\n<p>解除自己的生死。</p>\n<p>菩萨：</p>\n<p>目标：</p>\n<p>众生未度，誓不成佛。</p>\n<hr>\n<p>真正的大悲：</p>\n<p>不是情绪上的同情。</p>\n<p>而是：</p>\n<p>智慧指导下的长期行动。</p>\n<p>经中说：</p>\n<p>布施时：</p>\n<blockquote><p>不见施者，不见受者，不见施物。</p></blockquote>\n<p>什么意思？</p>\n<p>做利益众生的事情：</p>\n<p>但是没有：</p>\n<p>“我是救世主。”</p>\n<p>“我牺牲巨大。”</p>\n<p>“别人应该感谢我。”</p>\n<p>这就是：</p>\n<p>无所得的大悲。</p>\n<hr>\n<h2>七、最大智慧：帮助别人，但没有一个“帮助者”</h2>\n<p>这一卷最深处其实在这里。</p>\n<p>普通慈悲：</p>\n<p>有三个东西：</p>\n<p>我 → 帮助 → 众生</p>\n<p>菩萨慈悲：</p>\n<p>三者消融。</p>\n<p>因为：</p>\n<p>我也是因缘。</p>\n<p>众生也是因缘。</p>\n<p>帮助行为也是因缘。</p>\n<p>所以：</p>\n<p>慈悲而不执着慈悲。</p>\n<p>行动而没有行动者。</p>\n<p>这就是：</p>\n<p>《金刚经》：</p>\n<blockquote><p>“应无所住而生其心。”</p></blockquote>\n<hr>\n<h2>八、大忍大甲胄轮：最高级修行是“不动心”</h2>\n<p>后面进入非常深的禅定部分。</p>\n<p>核心：</p>\n<blockquote><p>心无行動，寂静而住。</p></blockquote>\n<p>不是身体不动。</p>\n<p>而是：</p>\n<p>面对：</p>\n<ul><li>六根</li><li>六尘</li><li>六识</li><li>三受</li><li>三界</li><li>一切佛法</li></ul>\n<p>心不被牵引。</p>\n<hr>\n<p>例如：</p>\n<p>别人赞美：</p>\n<p>普通人：</p>\n<p>开心。</p>\n<p>别人批评：</p>\n<p>痛苦。</p>\n<p>修行人：</p>\n<p>知道：</p>\n<p>赞美只是声音。</p>\n<p>批评只是声音。</p>\n<p>都是心识现象。</p>\n<p>所以：</p>\n<p>不增不减。</p>\n<hr>\n<h2>九、念佛三昧的真正含义</h2>\n<p>这一卷最后非常精彩。</p>\n<p>菩萨入定：</p>\n<p>然后：</p>\n<blockquote><p>“思念佛故则唯见佛。”</p></blockquote>\n<p>很多人误解念佛：</p>\n<p>认为：</p>\n<p>念佛 = 求佛出现。</p>\n<p>但是这里揭示：</p>\n<p>念佛最高境界：</p>\n<p>是心佛相应。</p>\n<p>为什么？</p>\n<p>因为：</p>\n<p>佛是觉性。</p>\n<p>念佛：</p>\n<p>就是让自己的心回归觉性。</p>\n<p>所以：</p>\n<p>念佛到深处：</p>\n<p>不是看到外面的佛。</p>\n<p>而是：</p>\n<p>发现自心佛性。</p>\n<hr>\n<p>经中：</p>\n<blockquote><p><span style=\"color: #E00;\">“一切色像皆同佛身。”</span></p></blockquote>\n<p><span style=\"color: #E00;\">这是什么境界？</span></p>\n<p><span style=\"color: #E00;\">《华严经》：</span></p>\n<p><span style=\"color: #E00;\">一切法界皆毗卢遮那。</span></p>\n<p><span style=\"color: #E00;\">《宗镜录》：</span></p>\n<p><span style=\"color: #E00;\">一心具足万法。</span></p>\n<p><span style=\"color: #E00;\">这里完全相通。</span></p>\n<hr>\n<h2>十、《获益嘱累品》总结：真正弘法者获得十种护持</h2>\n<p>佛最后嘱托虚空藏菩萨：</p>\n<p>如果有人：</p>\n<ul><li>读诵此经</li><li>思惟义理</li><li>为他解说</li><li>依教修行</li></ul>\n<p>护持十法：</p>\n<ol><li>财位不损</li><li>怨敌远离</li><li>离邪见恶业</li><li>离身语灾害</li><li>离诽谤轻慢</li><li>戒律清净</li><li>离非人灾病</li><li>离横死灾难</li><li>临终见佛</li><li>往生善趣</li></ol>\n<p>这里不是简单理解为：</p>\n<p>“读经发财。”</p>\n<p>真正意思：</p>\n<p>当一个人的生命方向转向：</p>\n<p>智慧、慈悲、正见，</p>\n<p>他的生命轨迹自然改变。</p>\n<hr>\n<h2>十一、整卷最核心的五句话</h2>\n<h3>1.</h3>\n<blockquote><p>有智慧没有慈悲，是小乘。</p></blockquote>\n<p>智慧帮助自己解脱。</p>\n<h3>2.</h3>\n<blockquote><p>有慈悲没有智慧，是凡夫善心。</p></blockquote>\n<p>容易好心办坏事。</p>\n<h3>3.</h3>\n<blockquote><p>有方便没有空性，会成为执着。</p></blockquote>\n<p>认为：</p>\n<p>“我在度众生。”</p>\n<h3>4.</h3>\n<blockquote><p>有空性没有方便，会成为寂灭。</p></blockquote>\n<p>自己清净，但无法利益众生。</p>\n<h3>5.</h3>\n<blockquote><p><span style=\"color: #E00;\">空性智慧 + 善巧方便 + 大慈大悲 = 菩萨道。</span></p></blockquote>\n<hr>\n<h2>十二、结合现代修行的启示</h2>\n<p>这一卷对于现代修行者尤其重要。</p>\n<h3>第一：</h3>\n<p>不要把佛法变成知识收藏。</p>\n<p>读了一百部经：</p>\n<p>如果：</p>\n<p>脾气更大，</p>\n<p>优越感更强，</p>\n<p>说明：</p>\n<p>般若没有生起。</p>\n<hr>\n<h3>第二：</h3>\n<p><span style=\"color: #E00;\">不要用自己的境界要求别人。</span></p>\n<p><span style=\"color: #E00;\">家庭中：</span></p>\n<p><span style=\"color: #E00;\">夫妻、孩子、朋友，</span></p>\n<p><span style=\"color: #E00;\">都是不同根器。</span></p>\n<p><span style=\"color: #E00;\">真正修行：</span></p>\n<p><span style=\"color: #E00;\">不是要求别人改变。</span></p>\n<p><span style=\"color: #E00;\">而是：</span></p>\n<p><span style=\"color: #E00;\">观察因缘，用方便引导。</span></p>\n<hr>\n<h3>第三：</h3>\n<p>最高修行不是逃避世界。</p>\n<p>而是在世界中：</p>\n<ul><li>做事</li><li>赚钱</li><li>关系互动</li><li>面对压力</li></ul>\n<p>但是：</p>\n<p>心不被境转。</p>\n<hr>\n<h2>总结一句话：</h2>\n<blockquote><p><strong>《地藏十轮经》卷十三告诉我们：真正的大乘菩萨，不是拥有多少佛法知识，而是在般若空性中生起无限慈悲，用善巧方便进入众生世界，利益一切而心无所得。</strong></p></blockquote>\n<p>这一卷其实与你之前拆解《宗镜录》中“一心化现”“真空不碍妙有”的思想完全呼应：</p>\n<p><strong>真空 → 生般若；</strong></p>\n<p><strong>般若 → 起方便；</strong></p>\n<p><strong>方便 → 行慈悲；</strong></p>\n<p><strong>慈悲 → 成佛道。</strong></p>\n<p>这就是大乘菩萨从“自觉”走向“觉他”的完整路线。</p>"}];
const home=document.querySelector('#home'),readerWrap=document.querySelector('#readerWrap'),sideToc=document.querySelector('#sideToc'),search=document.querySelector('#search');let current=-1,baseFont=17,touchX=0,touchY=0;
const label=c=>c.kind==='volume'?`第${c.number}卷`:c.kind==='summary'?'总结':`第${c.number}章`;
function save(){try{localStorage.setItem('ebook-ba635c0e72-progress',JSON.stringify({id:current,scroll:window.scrollY}))}catch(e){}}
function setProgress(){let max=document.documentElement.scrollHeight-innerHeight;document.querySelector('#progressBar').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}
function go(i,saveScroll=false){if(i<0){current=-1;readerWrap.classList.add('hidden');home.classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0);save();return}i=Math.max(0,Math.min(CHAPTERS.length-1,i));current=i;const c=CHAPTERS[i];home.classList.add('hidden');readerWrap.classList.remove('hidden');document.querySelector('#chapterKicker').textContent=c.kind==='volume'?`${document.title.replace(' · 电子书','')} · ${label(c)}`:c.kind==='summary'?`${document.title.replace(' · 电子书','')} · 全书回顾`:`${document.title.replace(' · 电子书','')} · ${label(c)}`;document.querySelector('#chapterTitle').textContent=c.title;document.querySelector('#prose').innerHTML=c.html;document.querySelector('#prevBtn').disabled=i===0;document.querySelector('#nextBtn').disabled=i===CHAPTERS.length-1;document.querySelectorAll('[data-chapter]').forEach(x=>x.classList.toggle('active',Number(x.dataset.chapter)===i));history.replaceState(null,'',`#${c.id}`);document.querySelector('#sidebar').classList.remove('open');window.scrollTo(0,0);if(saveScroll){const y=saveScroll;window.scrollTo(0,y)}save();setProgress()}
function item(c,i,cls=''){return `<button class="${cls}" data-chapter="${i}"><b>${c.kind==='summary'?'末':String(c.number).padStart(2,'0')}</b><span>${c.title}</span></button>`}
function build(){sideToc.innerHTML=CHAPTERS.map((c,i)=>item(c,i)).join('');home.innerHTML=`<div class="hero"><div class="seal">阅</div><h1>大乘大集地藏十轮经</h1><div class="sub">10 篇 · 网页电子书</div><div class="hero-rule"></div><p>从目录选择篇目开始阅读。阅读进度会保存在当前设备的浏览器中，方便下次接续。</p><div class="home-actions"><button class="primary" id="continueBtn">继续上次阅读</button><button class="action" id="startBtn">从第一卷开始</button></div></div><section class="contents"><h2>卷目目录</h2><div class="toc-grid">${CHAPTERS.map((c,i)=>item(c,i,'toc-card')).join('')}</div></section>`;document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.chapter))));document.querySelector('#startBtn').onclick=()=>go(0);document.querySelector('#continueBtn').onclick=resume}
function resume(){try{const p=JSON.parse(localStorage.getItem('ebook-ba635c0e72-progress'));if(p&&p.id>=0){go(p.id);setTimeout(()=>window.scrollTo(0,p.scroll||0),80);return}}catch(e){}go(0)}
document.querySelector('#prevBtn').onclick=()=>go(current-1);document.querySelector('#nextBtn').onclick=()=>go(current+1);document.querySelector('#homeBtn').onclick=()=>go(-1);
document.querySelector('#fullBtn').onclick=async()=>{document.body.classList.add('reading');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('已切换阅读布局')}document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('reading');document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.querySelector('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('ebook-ba635c0e72-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('ebook-ba635c0e72-dark')==='1'||(localStorage.getItem('ebook-ba635c0e72-dark')===null&&document.body.dataset.template==='5'))document.body.classList.add('dark');
document.querySelector('#fontUp').onclick=()=>{baseFont=Math.min(24,baseFont+1);document.querySelector('#prose').style.fontSize=baseFont+'px'};document.querySelector('#fontDown').onclick=()=>{baseFont=Math.max(14,baseFont-1);document.querySelector('#prose').style.fontSize=baseFont+'px'};
document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');search.addEventListener('input',()=>{let q=search.value.trim().toLowerCase();sideToc.querySelectorAll('button').forEach((b,i)=>b.style.display=(CHAPTERS[i].title.toLowerCase().includes(q)||label(CHAPTERS[i]).includes(q))?'':'none')});
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('reading');document.querySelector('#sidebar').classList.remove('open');if(document.fullscreenElement)document.exitFullscreen();return}if(current<0||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
const reader=document.querySelector('#readerWrap');reader.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});reader.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)go(current+(dx<0?1:-1))},{passive:true});
window.addEventListener('scroll',()=>{setProgress();if(current>=0){clearTimeout(window._saveTimer);window._saveTimer=setTimeout(save,180)}},{passive:true});window.addEventListener('resize',setProgress);
build();let hash=location.hash.slice(1),fromHash=CHAPTERS.findIndex(c=>c.id===hash);if(fromHash>=0)go(fromHash);else{try{const p=JSON.parse(localStorage.getItem('ebook-ba635c0e72-progress'));if(p&&p.id>=0){document.querySelector('#continueBtn').textContent=`继续阅读：${label(CHAPTERS[p.id])}`}}catch(e){}}
</script></body></html>
