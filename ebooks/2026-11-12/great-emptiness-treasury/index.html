p>\n<p>靠众生继续传承。</p>\n<hr>\n<p>佛说：</p>\n<blockquote><p>“护持正法不不断三宝种。”</p></blockquote>\n<p>三宝为什么重要？</p>\n<p>因为：</p>\n<p><span style=\"color: #E00;\">佛已经过去。</span></p>\n<p><span style=\"color: #E00;\">法需要有人讲。</span></p>\n<p><span style=\"color: #E00;\">僧需要有人实践。</span></p>\n<hr>\n<h2>十一、为什么受持此经功德超过无量布施？</h2>\n<p>佛用了大量宇宙级比喻：</p>\n<p>十方世界碎成微尘。</p>\n<p>微尘数量无法计算。</p>\n<p>有人：</p>\n<p>用七宝布满所有世界布施。</p>\n<p>功德巨大。</p>\n<p>但是：</p>\n<p>有人真正理解此经：</p>\n<p>超过。</p>\n<p>为什么？</p>\n<p>不是说布施不好。</p>\n<p>而是：</p>\n<p>财富只能解决外在。</p>\n<p>智慧才能解决根本。</p>\n<hr>\n<p>一句话：</p>\n<blockquote><p>给人财富，只解决一世问题；给予觉悟，解决无量生命问题。</p></blockquote>\n<hr>\n<h2>十二、对现代修行人的六个实践启示</h2>\n<h3>1. 不要和自己的烦恼战斗</h3>\n<p>错误：</p>\n<p>我要消灭愤怒。</p>\n<p>正确：</p>\n<p>观察：</p>\n<p>愤怒如何产生？</p>\n<hr>\n<h3>2. 训练“不如理作意”的觉察</h3>\n<p>每天观察：</p>\n<p>今天什么时候：</p>\n<ul><li>我认为别人针对我？</li><li>我认为自己必须被认可？</li><li>我把假设当事实？</li></ul>\n<hr>\n<h3>3. 不把佛法变成知识收藏</h3>\n<p>经典学习最终必须进入：</p>\n<p>行为。</p>\n<p>否则：</p>\n<p>只是增长所知障。</p>\n<hr>\n<h3>4. 真正护法先护自己的心</h3>\n<p>每天检查：</p>\n<p>有没有：</p>\n<p>贪名？</p>\n<p>贪赞？</p>\n<p>贪认可？</p>\n<hr>\n<h3>5. 面对恶人学习佛的方法</h3>\n<p>佛面对室利毱多：</p>\n<p>不是愤怒。</p>\n<p>而是：</p>\n<p>看到他的未来。</p>\n<hr>\n<h3>6. 传播佛法需要两个基础：</h3>\n<p>智慧 + 慈悲。</p>\n<p>只有智慧：</p>\n<p>容易傲慢。</p>\n<p>只有慈悲：</p>\n<p>容易没有方向。</p>\n<hr>\n<h2>十三、结合你近期学习《宗镜录》《密严经》的贯通理解</h2>\n<p>这一卷与你之前拆解的内容高度连接：</p>\n<p>《宗镜录》说：</p>\n<blockquote><p>心外无法，法外无心。</p></blockquote>\n<p>本卷说：</p>\n<blockquote><p>自性清净心。</p></blockquote>\n<p>《密严经》说：</p>\n<blockquote><p>第八识如瀑流，真非真恐迷。</p></blockquote>\n<p>本卷说：</p>\n<blockquote><p>非如理作意依清净心。</p></blockquote>\n<p>《大法炬陀罗尼经》说：</p>\n<blockquote><p>一切法皆因缘生。</p></blockquote>\n<p>本卷说：</p>\n<blockquote><p><span style=\"color: #E00;\">一切烦恼业障皆因缘和合。</span></p></blockquote>\n<p>其实都是指向同一个核心：</p>\n<hr>\n<h2>一念迷：</h2>\n<p>清净心变成轮回。</p>\n<h2>一念觉：</h2>\n<p>轮回当下就是菩提。</p>\n<hr>\n<h3>本卷一句总结：</h3>\n<blockquote><p><strong><span style=\"color: #E00;\">烦恼不是佛性的敌人，而是被误解的佛性；魔不是永恒的敌人，而是尚未觉醒的众生。真正的大乘修行，不只是自己离苦，而是在看破一切之后，承担护持正法、利益众生的责任。</span></strong></p></blockquote>\n<p>​</p>\n<p>​</p>\n<h2>《大集大虚空藏菩萨所问经》到底讲什么？</h2>\n<h3>一部揭示“心性本净、烦恼本空、护持正法、成就佛智”的大乘密典</h3>\n<hr>\n<h3>开篇：为什么今天的人仍然需要读《大集大虚空藏菩萨所问经》？</h3>\n<p>在浩瀚的大乘佛教经典中，有些经典讨论宇宙结构，有些经典讲解空性智慧，有些经典强调菩萨行愿。</p>\n<p>而《大集大虚空藏菩萨所问经》非常特别。</p>\n<p>它表面上讲：</p>\n<ul><li>虚空藏菩萨向佛请问甚深佛法；</li><li>魔王波旬也被授予成佛记；</li><li>四大天王、帝释、大梵天王护持经典；</li><li>末法时代如何守护佛法；</li><li>受持此经有不可思议功德。</li></ul>\n<p>但如果深入观察，会发现整部经真正围绕一个核心：</p>\n<blockquote><p><strong><span style=\"color: #E00;\">众生为什么会被烦恼束缚？如何认识自己的清净本性？如何从凡夫心进入佛智？</span></strong></p></blockquote>\n<p><span style=\"color: #E00;\">佛陀最终给出的答案是：</span></p>\n<blockquote><p><strong><span style=\"color: #E00;\">一切烦恼皆依不如理作意而起，而众生本具自性清净心。若能如实观察、不执邪正、不取染净，便能超越魔境，进入佛境，成就一切智智。</span></strong></p></blockquote>\n<p>这是一部从“认识自己的心”开始，最终走向“护持正法、利益众生”的完整大乘修行地图。</p>\n<hr>\n<h2>一、时代背景：佛法衰微时代，众生最大的危机是什么？</h2>\n<h3>1. 佛陀时代之后，修行环境越来越复杂</h3>\n<p>《大集大虚空藏菩萨所问经》属于大乘经典体系，产生于佛教发展成熟时期。</p>\n<p>当时佛教面临几个重要问题：</p>\n<h4>第一，外道思想竞争</h4>\n<p>印度当时各种哲学流派兴盛：</p>\n<ul><li>常见论：认为有一个永恒实体；</li><li>断见论：认为死后一切断灭；</li><li>苦行主义；</li><li>唯物主义。</li></ul>\n<p>佛弟子需要回答：</p>\n<blockquote><p>世界到底有没有一个固定不变的“我”？</p></blockquote>\n<hr>\n<h4>第二，佛教内部出现形式化倾向</h4>\n<p>经典中佛陀特别批评一些未来比丘：</p>\n<blockquote><p>“住相希名利，为魔之伴党。”</p></blockquote>\n<p>什么意思？</p>\n<p>不是说穿僧衣就是修行。</p>\n<p>如果：</p>\n<ul><li>贪着供养；</li><li>追求名声；</li><li>离开禅修；</li><li>喜欢世俗议论；</li><li>执着自己的见解；</li></ul>\n<p>虽然外表是佛弟子，内心却已经偏离佛法。</p>\n<hr>\n<h4>第三，末法时代最大的敌人不是外部，而是内心</h4>\n<p>本经不断强调：</p>\n<p>真正障碍佛法的，不只是：</p>\n<ul><li>魔王；</li><li>外道；</li><li>逆境。</li></ul>\n<p>最大的魔：</p>\n<blockquote><p>是众生自己的无明、分别、执著。</p></blockquote>\n<p>所以佛陀最后说：</p>\n<p><span style=\"color: #E00;\">菩萨四种事业：</span></p>\n<ol><li><span style=\"color: #E00;\">破烦恼魔；</span></li><li><span style=\"color: #E00;\">摧伏外道；</span></li><li><span style=\"color: #E00;\">成熟众生；</span></li><li><span style=\"color: #E00;\">护持正法。</span></li></ol>\n<p>而这四种，最后归结为：</p>\n<blockquote><p>护持正法。</p></blockquote>\n<p>因为真正护持佛法，就是让智慧不断在人心中出现。</p>\n<hr>\n<h2>二、核心问题：这部经到底解决什么问题？</h2>\n<p>整部《大集大虚空藏菩萨所问经》实际上回答六个根本问题。</p>\n<hr>\n<h2>问题一：</h2>\n<h3>为什么众生本来清净，却不断产生烦恼？</h3>\n<p>佛陀回答：</p>\n<blockquote><p>心本清净，烦恼只是客尘。</p></blockquote>\n<p>经中有一个非常重要比喻：</p>\n<hr>\n<h3>虚空、风、水、大地</h3>\n<p>佛说：</p>\n<p>大地依水；</p>\n<p>水依风；</p>\n<p>风依虚空。</p>\n<p>但是：</p>\n<blockquote><p>虚空没有依靠。</p></blockquote>\n<p>对应修行：</p>\n<p>| <strong>层次</strong>                               | <strong>对应</strong>                                     | | ------------------------------------ | ------------------------------------------ | | <span style=\"color: #E00;\">大地</span> | <span style=\"color: #E00;\">五蕴、六根、六尘</span> | | <span style=\"color: #E00;\">水</span>  | <span style=\"color: #E00;\">业和烦恼</span>     | | <span style=\"color: #E00;\">风</span>  | <span style=\"color: #E00;\">不如理作意</span>    | | <span style=\"color: #E00;\">虚空</span> | <span style=\"color: #E00;\">自性清净心</span>    |</p>\n<p>众生为什么轮回？</p>\n<p>因为：</p>\n<p>清净心 →</p>\n<p>产生错误认知 →</p>\n<p>产生烦恼 →</p>\n<p>产生业 →</p>\n<p>形成五蕴世界。</p>\n<p>这个链条：</p>\n<p>``<code> 自性清净心 ↓ 不如理作意 ↓ 烦恼 ↓ 业 ↓ 五蕴身心 ↓ 生死轮回 </code>``</p>\n<hr>\n<p>但是反过来也成立：</p>\n<p>如果断掉“不如理作意”。</p>\n<p>那么：</p>\n<p>烦恼无所依；</p>\n<p>业无所生；</p>\n<p>轮回自然停止。</p>\n<hr>\n<h2>问题二：</h2>\n<h3>烦恼是真实存在的吗？</h3>\n<p>这是全经最核心的智慧。</p>\n<p>佛说：</p>\n<blockquote><p><span style=\"color: #E00;\">“烦恼者无有方所，亦无住处复无积聚。”</span></p></blockquote>\n<p>什么意思？</p>\n<p>烦恼看起来真实：</p>\n<p>愤怒来了；</p>\n<p>贪欲来了；</p>\n<p>恐惧来了。</p>\n<p>但是你寻找：</p>\n<p>“愤怒在哪里？”</p>\n<p>找不到。</p>\n<p>它没有固定位置。</p>\n<p>没有实体。</p>\n<p>只是：</p>\n<p>因缘组合产生的一种心理现象。</p>\n<hr>\n<p>比如：</p>\n<p>一杯水。</p>\n<p>水在哪里？</p>\n<p>是：</p>\n<p>氢元素？</p>\n<p>氧元素？</p>\n<p>温度？</p>\n<p>容器？</p>\n<p>如果拆开：</p>\n<p>找不到一个叫“水”的独立实体。</p>\n<p>烦恼也是如此。</p>\n<hr>\n<p>所以佛说：</p>\n<blockquote><p>如实知烦恼，则为正见。</p></blockquote>\n<p>关键不是消灭烦恼。</p>\n<p>而是：</p>\n<p>看见烦恼本空。</p>\n<hr>\n<h2>问题三：</h2>\n<h3>魔王波旬为什么也能成佛？</h3>\n<p>这是本经非常震撼的地方。</p>\n<p>佛给波旬授菩提记。</p>\n<p>很多人疑惑：</p>\n<p>魔不是坏的吗？</p>\n<p>为什么佛还认可他？</p>\n<p>因为佛看到：</p>\n<p>表面行为有善恶。</p>\n<p>但是：</p>\n<p>众生本性没有污染。</p>\n<hr>\n<p>佛法不是：</p>\n<p>“坏人永远是坏人”。</p>\n<p>而是：</p>\n<blockquote><p><span style=\"color: #E00;\">一切众生皆有佛性，一切生命皆有觉悟可能。</span></p></blockquote>\n<p>魔也是：</p>\n<p>被无明覆盖的觉悟者。</p>\n<hr>\n<p>这体现大乘佛教最高智慧：</p>\n<p>不是消灭敌人。</p>\n<p>而是转化迷惑。</p>\n<hr>\n<h2>问题四：</h2>\n<h3>什么是真正的正见？</h3>\n<p>很多人认为：</p>\n<p>正见=相信正确观点。</p>\n<p>佛经告诉我们：</p>\n<p>更深层：</p>\n<p><span style=\"color: #E00;\">正见是不执着任何观点。</span></p>\n<hr>\n<p>佛说：</p>\n<p>邪见和正见：</p>\n<p>如果执著：</p>\n<p>都是障碍。</p>\n<p>为什么？</p>\n<p>因为：</p>\n<p>“我拥有正确答案”。</p>\n<p>这个念头本身就是我执。</p>\n<hr>\n<p>真正智慧：</p>\n<p>不是：</p>\n<p>“我知道。”</p>\n<p>而是：</p>\n<p><span style=\"color: #E00;\">“我看见一切都是因缘显现。”</span></p>\n<hr>\n<h2>问题五：</h2>\n<h3>末法时代如何护持佛法？</h3>\n<p>本经用了大量篇幅描述未来恶世。</p>\n<p>未来会出现：</p>\n<ul><li>有人追求名利；</li><li>有人利用佛法包装自己；</li><li>有人毁谤经典；</li><li>有人执著个人见解。</li></ul>\n<p>那么怎么办？</p>\n<p>菩萨如何面对？</p>\n<p>佛给出的答案：</p>\n<p>不是愤怒。</p>\n<p>不是攻击。</p>\n<p>而是：</p>\n<p><span style=\"color: #E00;\">慈悲、智慧、忍辱。</span></p>\n<hr>\n<p>经中菩萨发愿：</p>\n<p>别人：</p>\n<ul><li>毁谤我；</li><li>侮辱我；</li><li>阻碍我。</li></ul>\n<p>我仍然：</p>\n<p>“不起报心。”</p>\n<p>因为：</p>\n<p>对方也是被无明控制。</p>\n<hr>\n<p>这就是大乘菩萨精神。</p>\n<hr>\n<h2>三、佛陀答案：一条从凡夫到佛境的道路</h2>\n<p>整部经可以浓缩成五步。</p>\n<hr>\n<h3>第一步：认识自性清净心</h3>\n<p>核心：</p>\n<blockquote><p><span style=\"color: #E00;\">我们的问题不是没有佛性，而是不认识佛性。</span></p></blockquote>\n<hr>\n<h3>第二步：观察烦恼的虚妄性</h3>\n<p>不要：</p>\n<p>压制烦恼。</p>\n<p>不要：</p>\n<p>讨厌烦恼。</p>\n<p>而是：</p>\n<p>观察：</p>\n<p>“这个念头从哪里来？”</p>\n<p>“它是否真实存在？”</p>\n<hr>\n<h3>第三步：停止不如理作意</h3>\n<p>什么是不如理作意？</p>\n<p>就是：</p>\n<p><span style=\"color: #E00;\">把无常看成永恒；</span></p>\n<p><span style=\"color: #E00;\">把假相看成真实；</span></p>\n<p><span style=\"color: #E00;\">把念头看成自己。</span></p>\n<hr>\n<p>比如：</p>\n<p>别人一句话。</p>\n<p>普通人：</p>\n<p>他说我不好 →</p>\n<p>我受伤 →</p>\n<p>我愤怒。</p>\n<p>智慧观察：</p>\n<p>声音出现 →</p>\n<p>身体反应 →</p>\n<p>念头升起 →</p>\n<p>情绪形成。</p>\n<p>只是过程。</p>\n<p>没有一个固定的“我”受到伤害。</p>\n<hr>\n<h3>第四步：进入无分别智慧</h3>\n<p>佛说：</p>\n<blockquote><p><span style=\"color: #E00;\">有分别者名烦恼，无分别者名清净。</span></p></blockquote>\n<p>不是没有思想。</p>\n<p>而是不被思想控制。</p>\n<hr>\n<h3>第五步：护持正法，利益众生</h3>\n<p>觉悟不是逃离世界。</p>\n<p>真正的大乘：</p>\n<p>自己觉悟以后：</p>\n<p>帮助别人觉悟。</p>\n<hr>\n<h2>四、关键概念拆解</h2>\n<hr>\n<h2>1. 自性清净心</h2>\n<p>这是本经核心。</p>\n<p>意思：</p>\n<p>众生本具觉悟能力。</p>\n<p>烦恼只是暂时覆盖。</p>\n<p>如：</p>\n<p>乌云覆盖太阳。</p>\n<p>乌云不是太阳。</p>\n<p>烦恼不是我们的本质。</p>\n<hr>\n<h2>2. 不如理作意</h2>\n<p>这是轮回发动机。</p>\n<p>简单说：</p>\n<p>错误理解现实。</p>\n<p>例如：</p>\n<p>认为：</p>\n<p>“财富代表我的价值。”</p>\n<p>“别人认可决定我的存在。”</p>\n<p>“身体就是我。”</p>\n<p>这些都是不如理作意。</p>\n<hr>\n<h2>3. 无生忍</h2>\n<p>经中很多菩萨证无生忍。</p>\n<p>什么叫无生？</p>\n<p>不是世界不存在。</p>\n<p>而是：</p>\n<p><span style=\"color: #E00;\">看见一切现象：</span></p>\n<p><span style=\"color: #E00;\">因缘生；</span></p>\n<p><span style=\"color: #E00;\">因缘灭；</span></p>\n<p><span style=\"color: #E00;\">没有固定自性。</span></p>\n<p><span style=\"color: #E00;\">所以心不再被境界推动。</span></p>\n<hr>\n<h2>4. 护持正法</h2>\n<p>最高层不是保护外在佛教形式。</p>\n<p>而是：</p>\n<p><span style=\"color: #E00;\">让智慧在人间延续。</span></p>\n<p>包括：</p>\n<ul><li>自己修行；</li><li>正确理解佛法；</li><li>分享智慧；</li><li>利益众生。</li></ul>\n<hr>\n<h2>5. 虚空藏菩萨</h2>\n<p>“虚空藏”三个字非常重要。</p>\n<p>虚空：</p>\n<p>无限包容。</p>\n<p>藏：</p>\n<p>无尽宝藏。</p>\n<p>代表：</p>\n<p>众生心性本来具有无限智慧。</p>\n<hr>\n<h2>五、对现代人的启示</h2>\n<h3>1. 最大的问题不是环境，而是认知系统</h3>\n<p>现代人的痛苦：</p>\n<p>很多来自：</p>\n<p>错误解释。</p>\n<p>同一个事件：</p>\n<p>有人痛苦；</p>\n<p>有人成长。</p>\n<p>区别在哪里？</p>\n<p>认知。</p>\n<hr>\n<h3>2. 情绪不是敌人，而是观察入口</h3>\n<p>现代心理学说：</p>\n<p>觉察情绪。</p>\n<p>佛法更进一步：</p>\n<p>观察情绪没有实体。</p>\n<hr>\n<p>愤怒出现：</p>\n<p>不要：</p>\n<p>“我是愤怒的人。”</p>\n<p>改成：</p>\n<p>“愤怒正在发生。”</p>\n<p>这一转：</p>\n<p>从被控制进入观察。</p>\n<hr>\n<h3>3. 财富、事业、关系都是心的训练场</h3>\n<p>佛法不是逃避人生。</p>\n<p>而是在：</p>\n<p><span style=\"color: #E00;\">财富中练不贪；</span></p>\n<p><span style=\"color: #E00;\">关系中练慈悲；</span></p>\n<p><span style=\"color: #E00;\">压力中练智慧。</span></p>\n<hr>\n<h3>4. 信息时代更需要护持正法</h3>\n<p>今天：</p>\n<p>信息爆炸。</p>\n<p>观点冲突。</p>\n<p>真假混杂。</p>\n<p>真正修行：</p>\n<p>不是收藏更多知识。</p>\n<p>而是：</p>\n<p>提升辨别力。</p>\n<hr>\n<h2>六、修行实践：如何落实《大集大虚空藏菩萨所问经》？</h2>\n<h3>第一法：</h3>\n<h2>每天观察“不如理作意”</h2>\n<p>每天问自己：</p>\n<p>今天哪个念头让我痛苦？</p>\n<p>例如：</p>\n<p>“别人看不起我。”</p>\n<p>观察：</p>\n<p>这是事实？</p>\n<p>还是我的解释？</p>\n<hr>\n<h3>第二法：</h3>\n<h2>修自性清净观</h2>\n<p>每天静坐10分钟。</p>\n<p>观察：</p>\n<p>念头来了。</p>\n<p>不追。</p>\n<p>不压。</p>\n<p>只是知道。</p>\n<p>训练：</p>\n<p>“觉知在，念头来去。”</p>\n<hr>\n<h3>第三法：</h3>\n<h2>烦恼观察法</h2>\n<p>烦恼出现时：</p>\n<p>不要问：</p>\n<p>“为什么又这样？”</p>\n<p>改问：</p>\n<ol><li>这个烦恼在哪里？</li><li>它持续多久？</li><li>它有没有固定实体？</li></ol>\n<p>慢慢发现：</p>\n<p>烦恼如梦。</p>\n<hr>\n<h3>第四法：</h3>\n<h2>修无相布施</h2>\n<p>帮助别人时：</p>\n<p>减少：</p>\n<p>“我是帮助者。”</p>\n<p>“他是被帮助者。”</p>\n<p>只是：</p>\n<p>因缘互助。</p>\n<hr>\n<h3>第五法：</h3>\n<h2>护持正法</h2>\n<p>现代人的护法方式：</p>\n<p>不是争论。</p>\n<p>而是：</p>\n<ul><li>正确理解佛法；</li><li>自己实践；</li><li>用生命证明佛法有效。</li></ul>\n<hr>\n<h2>结语：</h2>\n<p>《大集大虚空藏菩萨所问经》八卷经文，最终讲的不是神秘力量，也不是外在护法。</p>\n<p>它讲的是：</p>\n<blockquote><p><strong><span style=\"color: #E00;\">众生本来具有清净智慧，只因为错误认知而流转生死；若能看破烦恼本空，回归自性清净，并以慈悲智慧利益众生，就能从凡夫心进入佛智。</span></strong></p></blockquote>\n<p>佛陀给现代人的最大启示：</p>\n<p>不要一直寻找外在答案。</p>\n<p>真正的宝藏：</p>\n<p>一直就在自己的心中。</p>\n<p>如虚空藏菩萨之名：</p>\n<blockquote><p><strong><span style=\"color: #E00;\">虚空无尽，智慧无尽；心性本净，佛道本成。</span></strong></p></blockquote>\n<p>这就是《大集大虚空藏菩萨所问经》八卷经文给予我们的终极答案。</p>"}];

function save(){try{localStorage.setItem('ebook-cae5585224-progress',JSON.stringify({id:current,scroll:window.scrollY}))}catch(e){}}
function setProgress(){let max=document.documentElement.scrollHeight-innerHeight;document.querySelector('#progressBar').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}
function go(i,saveScroll=false){if(i<0){current=-1;readerWrap.classList.add('hidden');home.classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0);save();return}i=Math.max(0,Math.min(CHAPTERS.length-1,i));current=i;const c=CHAPTERS[i];home.classList.add('hidden');readerWrap.classList.remove('hidden');document.querySelector('#chapterKicker').textContent=c.kind==='volume'?`${document.title.replace(' · 电子书','')} · ${label(c)}`:c.kind==='summary'?`${document.title.replace(' · 电子书','')} · 全书回顾`:`${document.title.replace(' · 电子书','')} · ${label(c)}`;document.querySelector('#chapterTitle').textContent=c.title;document.querySelector('#prose').innerHTML=c.html;document.querySelector('#prevBtn').disabled=i===0;document.querySelector('#nextBtn').disabled=i===CHAPTERS.length-1;document.querySelectorAll('[data-chapter]').forEach(x=>x.classList.toggle('active',Number(x.dataset.chapter)===i));history.replaceState(null,'',`#${c.id}`);document.querySelector('#sidebar').classList.remove('open');window.scrollTo(0,0);if(saveScroll){const y=saveScroll;window.scrollTo(0,y)}save();setProgress()}
function item(c,i,cls=''){return `<button class="${cls}" data-chapter="${i}"><b>${c.kind==='summary'?'末':String(c.number).padStart(2,'0')}</b><span>${c.title}</span></button>`}
function build(){sideToc.innerHTML=CHAPTERS.map((c,i)=>item(c,i)).join('');home.innerHTML=`<div class="hero"><div class="seal">阅</div><h1>大集大虛空藏菩薩所问经</h1><div class="sub">8 篇 · 网页电子书</div><div class="hero-rule"></div><p>从目录选择篇目开始阅读。阅读进度会保存在当前设备的浏览器中，方便下次接续。</p><div class="home-actions"><button class="primary" id="continueBtn">继续上次阅读</button><button class="action" id="startBtn">从第一卷开始</button></div></div><section class="contents"><h2>卷目目录</h2><div class="toc-grid">${CHAPTERS.map((c,i)=>item(c,i,'toc-card')).join('')}</div></section>`;document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.chapter))));document.querySelector('#startBtn').onclick=()=>go(0);document.querySelector('#continueBtn').onclick=resume}
function resume(){try{const p=JSON.parse(localStorage.getItem('ebook-cae5585224-progress'));if(p&&p.id>=0){go(p.id);setTimeout(()=>window.scrollTo(0,p.scroll||0),80);return}}catch(e){}go(0)}
document.querySelector('#prevBtn').onclick=()=>go(current-1);document.querySelector('#nextBtn').onclick=()=>go(current+1);document.querySelector('#homeBtn').onclick=()=>go(-1);
document.querySelector('#fullBtn').onclick=async()=>{document.body.classList.add('reading');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('已切换阅读布局')}document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('reading');document.querySelector('#fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.querySelector('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('ebook-cae5585224-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('ebook-cae5585224-dark')==='1'||(localStorage.getItem('ebook-cae5585224-dark')===null&&document.body.dataset.template==='5'))document.body.classList.add('dark');
document.querySelector('#fontUp').onclick=()=>{baseFont=Math.min(24,baseFont+1);document.querySelector('#prose').style.fontSize=baseFont+'px'};document.querySelector('#fontDown').onclick=()=>{baseFont=Math.max(14,baseFont-1);document.querySelector('#prose').style.fontSize=baseFont+'px'};
document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');search.addEventListener('input',()=>{let q=search.value.trim().toLowerCase();sideToc.querySelectorAll('button').forEach((b,i)=>b.style.display=(CHAPTERS[i].title.toLowerCase().includes(q)||label(CHAPTERS[i]).includes(q))?'':'none')});
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('reading');document.querySelector('#sidebar').classList.remove('open');if(document.fullscreenElement)document.exitFullscreen();return}if(current<0||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
const reader=document.querySelector('#readerWrap');reader.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});reader.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)go(current+(dx<0?1:-1))},{passive:true});
window.addEventListener('scroll',()=>{setProgress();if(current>=0){clearTimeout(window._saveTimer);window._saveTimer=setTimeout(save,180)}},{passive:true});window.addEventListener('resize',setProgress);
build();let hash=location.hash.slice(1),fromHash=CHAPTERS.findIndex(c=>c.id===hash);if(fromHash>=0)go(fromHash);else{try{const p=JSON.parse(localStorage.getItem('ebook-cae5585224-progress'));if(p&&p.id>=0){document.querySelector('#continueBtn').textContent=`继续阅读：${label(CHAPTERS[p.id])}`}}catch(e){}}
</script></body></html>
